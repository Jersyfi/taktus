name: ci

# CI validates. CI never deploys.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The contracts are language-neutral and need no installed project: the validator brings its
  # own dependencies (PEP 723 header), so this job stays green independently of the Python gates.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: contracts
        run: make gate-contracts

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The repository is public. A finding is handled as rotate-first,
      # never as a false positive to silence.
      - name: secrets
        uses: gitleaks/gitleaks-action@v2

      - uses: astral-sh/setup-uv@v5
      - run: make install

      - name: lint and types
        run: make lint

      - name: architecture
        run: make gate-arch

      - name: conformance
        run: make gate-conformance

      - name: governance
        run: make gate-governance

      - name: exactness
        run: make gate-exactness

      - name: documentation freshness
        run: make gate-docs

      - name: test
        run: make test
