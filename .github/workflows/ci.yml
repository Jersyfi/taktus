name: ci

# CI validates. CI never deploys.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The contracts are language-neutral and need no installed project: the validator brings its
  # own dependencies (PEP 723 header), so this job stays green independently of the Python gates.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: contracts
        run: make gate-contracts

  # The decision register is plain Markdown and needs no installed project either. On a pull
  # request the job also reads the description and the draft flag: a pull request that names a
  # BLOCKING decision while not being a draft fails here (ADR-0017).
  decisions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: pull request description
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
      - name: decisions (pull request)
        if: github.event_name == 'pull_request'
        run: >
          uv run tools/check_decisions.py
          --pr-body "$RUNNER_TEMP/pr-body.md"
          --draft ${{ github.event.pull_request.draft }}
      - name: decisions (main)
        if: github.event_name != 'pull_request'
        run: uv run tools/check_decisions.py --forbid-open-blocking

  gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The repository is public. A finding is handled as rotate-first,
      # never as a false positive to silence. The action needs the workflow's own token to read
      # the commits of a pull request; that token is created by GitHub per run, not stored here.
      - name: secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v5
      - run: make install

      - name: lint and types
        run: make lint

      - name: architecture
        run: make gate-arch

      - name: conformance
        run: make gate-conformance

      - name: governance
        run: make gate-governance

      - name: exactness
        run: make gate-exactness

      - name: documentation freshness
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: make gate-docs BASE="$BASE"

      - name: decisions
        run: make gate-decisions

      # The runner has Docker; the PostgreSQL tests run in a container and may not skip here.
      - name: test
        env:
          TAKTUS_REQUIRE_DATABASE: "1"
        run: make test
