name: ci

# CI validates. CI never deploys.
#
# Pushes to `taktus/**` run the same gates as a pull request: P-03 Implementation puts a change
# on such a branch and reads the pipeline's verdict before it opens the pull request
# (blueprints/dev-orchestration/processes/P-03-implementation.yaml), so the verdict must exist
# for a branch without one.
on:
  pull_request:
  push:
    branches: [main, "taktus/**"]

permissions:
  contents: read

jobs:
  # The contracts are language-neutral and need no installed project: the validator brings its
  # own dependencies (PEP 723 header), so this job stays green independently of the Python gates.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: contracts
        run: make gate-contracts

  # The decision register is plain Markdown and needs no installed project either. What a pull
  # request's description says — and the draft flag a BLOCKING decision requires — is the
  # `description` workflow's, which runs on an edit too.
  decisions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      # What a pull request's description says is checked by the `description` workflow, which
      # also runs when a description is edited (NTC-0013). Here: the register itself.
      - name: decisions
        if: github.event_name == 'pull_request'
        run: uv run tools/check_decisions.py
      - name: decisions (main)
        if: github.event_name != 'pull_request'
        run: uv run tools/check_decisions.py --forbid-open-blocking
      # Every ADR that makes a promise states where the promise ends. Plain Markdown, the same
      # standard-library tool shape as the decisions gate.
      - name: architecture decision records
        run: make gate-adrs
      # The vision layer holds together and every principle is served by a use case. Plain
      # Markdown, standard library; the use cases themselves are checked in the gates job, which
      # has the project environment their named tests need.
      - name: vision
        run: make gate-vision
      # The status report is current: touched by every change to the state of the project, and
      # section 3 pointing at `make status` (ADR-0028). The last section of a description is the
      # `description` workflow's.
      - name: status (pull request)
        if: github.event_name == 'pull_request'
        run: uv run tools/check_status.py --base origin/${{ github.base_ref }}
      - name: status (main)
        if: github.event_name != 'pull_request'
        # A push to main compares with what main was; the first push of a `taktus/**` branch
        # has no "before" (GitHub sends the null sha) and compares with main (DEC-0017).
        run: uv run tools/check_status.py --base ${{ github.ref == 'refs/heads/main' && github.event.before || 'origin/main' }}

  gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The repository is public. A finding is handled as rotate-first,
      # never as a false positive to silence. The action needs the workflow's own token to read
      # the commits of a pull request; that token is created by GitHub per run, not stored here.
      - name: secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v5
      - run: make install

      - name: lint and types
        run: make lint

      - name: architecture
        run: make gate-arch

      - name: conformance
        run: make gate-conformance

      - name: governance
        run: make gate-governance

      - name: exactness
        run: make gate-exactness

      - name: documentation freshness
        env:
          # A pull request compares with its base; a push to main with what main was; the first
          # push of a `taktus/**` branch has no "before" — GitHub sends the null sha, which no
          # gate can diff against — and compares with main (DEC-0017).
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.ref == 'refs/heads/main' && github.event.before || 'origin/main') }}
        run: make gate-docs BASE="$BASE"

      - name: decisions
        run: make gate-decisions

      # Every use case has a state, a verification condition and a principle; a verified one's
      # named tests are run and must be green; an ADR that moved under a use case fails until it
      # is checked again; a pull request may not change a requirement and its implementation
      # together (CLAUDE.md §9). Compared with the same base as the documentation gate.
      - name: use cases
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.ref == 'refs/heads/main' && github.event.before || 'origin/main') }}
        run: make gate-usecases BASE="$BASE"

      # The runner has Docker; the PostgreSQL tests run in a container and may not skip here.
      - name: test
        env:
          TAKTUS_REQUIRE_DATABASE: "1"
        run: make test
