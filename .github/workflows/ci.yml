name: ci

# CI validates. CI never deploys.
#
# Every check runs where it costs least, and every lane is a job of its own, so that a run takes
# as long as its slowest lane rather than all of them together (ADR-0096). The ruleset requires
# one check, `gates`: an aggregate that needs every job, passes when each one passed, and always
# reports.
#
# Pushes to `taktus/**` run the same gates as a pull request: P-03 Implementation puts a change
# on such a branch and reads the pipeline's verdict before it opens the pull request
# (blueprints/dev-orchestration/processes/P-03-implementation.yaml), so the verdict must exist
# for a branch without one.
on:
  pull_request:
  push:
    branches: [main, "taktus/**"]

# A newer push to a pull request or a `taktus/**` branch cancels the run it supersedes. A run on
# `main` is never cancelled: every commit there is checked in full (ADR-0096 §5).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Which lanes this change runs (ADR-0096 §3, #390): `tools/lanes.py`, the code `make verify`
  # runs too. `static` and `decisions` always run; the others when a path they claim changed. A
  # push to `main` runs every lane: every commit there is checked in full.
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      contracts: ${{ steps.lanes.outputs.contracts }}
      web: ${{ steps.lanes.outputs.web }}
      conformance: ${{ steps.lanes.outputs.conformance }}
      test: ${{ steps.lanes.outputs.test }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: the lanes this change selects
        id: lanes
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
          EVERYTHING: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        run: |
          if [ "$EVERYTHING" = "true" ]; then
            python3 tools/lanes.py --all --github-output "$GITHUB_OUTPUT"
          else
            python3 tools/lanes.py --base "$BASE" --github-output "$GITHUB_OUTPUT"
          fi

  # The contracts are language-neutral and need no installed project: the validator brings its
  # own dependencies (PEP 723 header), so this job stays green independently of the Python gates.
  contracts:
    needs: select
    if: needs.select.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: contracts
        run: make gate-contracts

  # The decision register is plain Markdown and needs no installed project either. What a pull
  # request's description says — and the draft flag a BLOCKING decision requires — is the
  # `description` workflow's, which runs on an edit too.
  decisions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      # What a pull request's description says is checked by the `description` workflow, which
      # also runs when a description is edited (NTC-0013). Here: the register itself.
      # Against the base, every record the pull request adds carries a number reserved on the
      # repository (`make reserve`, DEC-0189 rule 6). Listing the reservations reads the public
      # repository and needs no write permission.
      - name: decisions
        if: github.event_name == 'pull_request'
        run: uv run tools/check_decisions.py --base origin/${{ github.base_ref }}
      - name: decisions (main)
        if: github.event_name != 'pull_request'
        run: uv run tools/check_decisions.py --forbid-open-blocking
      # Every ADR that makes a promise states where the promise ends. Plain Markdown, the same
      # standard-library tool shape as the decisions gate.
      - name: architecture decision records
        run: make gate-adrs
      # The vision layer holds together and every principle is served by a use case. Plain
      # Markdown, standard library; the use cases themselves are checked in the static job, which
      # has the project environment their named tests need.
      - name: vision
        run: make gate-vision
      # The status report is current: touched by every change to the state of the project, and
      # section 3 pointing at `make status` (ADR-0028). The last section of a description is
      # written by the `owner-list` workflow (DEC-0189).
      - name: status (pull request)
        if: github.event_name == 'pull_request'
        run: uv run tools/check_status.py --base origin/${{ github.base_ref }}
      - name: status (main)
        if: github.event_name != 'pull_request'
        # A push to main compares with what main was; the first push of a `taktus/**` branch
        # has no "before" (GitHub sends the null sha) and compares with main (DEC-0017).
        run: uv run tools/check_status.py --base ${{ github.ref == 'refs/heads/main' && github.event.before || 'origin/main' }}

  # The web app under web/ (ADR-0063): its packages from the lock file, its types, its tests and
  # its build. It needs Node and not the Python environment; here the gate may not skip.
  web:
    needs: select
    if: needs.select.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: web
        env:
          TAKTUS_REQUIRE_NODE: "1"
        run: make gate-web

  # Everything that reads the code rather than running it: secrets, lint and types, the
  # architecture, the chart, governance, exactness, documentation, the register and the use cases.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The repository is public. A finding is handled as rotate-first, never as a false
      # positive to silence. The range is the one this run's event names, so that every commit
      # of it is in the clone (#389); the scan first proves it finds a planted key.
      - name: secrets
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: tools/install_gitleaks.sh && tools/scan_secrets.sh "$BASE" "$HEAD"

      - uses: astral-sh/setup-uv@v5
      - run: make install

      - name: lint and types
        run: make lint

      - name: architecture
        run: make gate-arch

      # The chart is linted and rendered with the pinned helm, and its manifests are read back by
      # the governance tests (tests/governance/test_chart.py); here they may not skip.
      - name: helm
        run: make helm

      - name: governance
        env:
          TAKTUS_REQUIRE_HELM: "1"
        run: make gate-governance

      - name: exactness
        run: make gate-exactness

      - name: documentation freshness
        env:
          # A pull request compares with its base; a push to main with what main was; the first
          # push of a `taktus/**` branch has no "before" — GitHub sends the null sha, which no
          # gate can diff against — and compares with main (DEC-0017).
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.ref == 'refs/heads/main' && github.event.before || 'origin/main') }}
        run: make gate-docs BASE="$BASE"

      - name: decisions
        run: make gate-decisions

      # Every use case has a state, a verification condition and a principle; a verified one's
      # named tests are run and must be green; an ADR that moved under a use case fails until it
      # is checked again; a pull request may not change a requirement and its implementation
      # together (CLAUDE.md §9). Compared with the same base as the documentation gate.
      - name: use cases
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.ref == 'refs/heads/main' && github.event.before || 'origin/main') }}
        run: make gate-usecases BASE="$BASE"

  # The conformance suite of every contract. Each test starts its own worker or connector
  # process, so the tests spread over the runner's cores (`pytest-xdist`).
  conformance:
    needs: select
    if: needs.select.outputs.conformance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: make install
      - name: conformance
        run: make gate-conformance

  # Unit, domain and integration tests. The runner has Docker; the PostgreSQL tests run in a
  # container and may not skip here. The test images are built once before the tests spread
  # over the cores, so that no two processes build the same image.
  test:
    needs: select
    if: needs.select.outputs.test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: make install
      - name: images
        run: make images
      - name: test
        env:
          TAKTUS_REQUIRE_DATABASE: "1"
        run: make test

  # The one check the ruleset requires. It needs every job above, fails unless each one
  # succeeded, and always reports — a job that failed, was cancelled or timed out fails it.
  # On a pull request its last step is the guard (ADR-0096 §5, #391): while the newest run on
  # `main` is red, only a repair merges — a revert, or a pull request naming
  # `Mends main: <sha>`. When the host does not answer, the guard fails: nothing merges blind.
  gates:
    if: always()
    needs: [select, contracts, decisions, web, static, conformance, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      - name: every lane passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # A lane the change did not select is skipped, and passes; one that failed, was
          # cancelled or timed out fails the check, and so does a selection that did not succeed.
          echo "$RESULTS" | jq -e '.select.result == "success"' > /dev/null
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null

      # The description is read now, so that a `Mends main:` added since the push counts when
      # the run is repeated. Title and description reach the tool as files and variables, never
      # in a command line.
      - name: main is green, or this pull request mends it
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=10" \
            > "$RUNNER_TEMP/runs.json" || : > "$RUNNER_TEMP/runs.json"
          gh api "repos/$REPO/pulls/$PR" --jq '.body // ""' > "$RUNNER_TEMP/body.md" || :
          python3 tools/ci_watch.py guard --runs "$RUNNER_TEMP/runs.json" --title "$TITLE" \
            --body-file "$RUNNER_TEMP/body.md"
