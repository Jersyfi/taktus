name: live

# Live tests: the tests that need a credential and act on a real service (DEC-0048). They never
# run on a pull request — the repository is public, a credential in a pull request's pipeline is
# reachable from every workflow that names it, and a key that costs money would spend on every
# push. They run on a schedule and by dispatch, on `main` only, never in a fork. Their secrets sit
# in the environment `live`, which admits `main` alone and which no other workflow names;
# `tests/tools/test_live_workflow.py` holds every workflow to that.
#
# Every run is capped and leaves its evidence. A job that spends money reads its cap from the
# environment's variable `LIVE_SPEND_CAP_USD` and refuses to start without it, in its first
# step; a job whose service charges nothing is bounded by its time limit. What a run consumed is kept as an
# artifact, as the removal test keeps its own.
on:
  schedule:
    - cron: "0 7 1 * *"   # the first of every month, 07:00 UTC (DEC-0058: weekly was more than the interfaces need)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The repository connector against the real hosting service, in a scratch repository that exists
  # for this test alone and on which Taktus's own app is installed (NEED-0013, DEC-0058). The
  # connector acts as the app (ADR-0033): it mints an installation token that lives an hour from
  # the app's private key, in this run, and stores it nowhere. The identifier and the key are
  # secrets of the environment, so that neither is printed in this public log; the key is written
  # to a file outside the evidence directory, readable by the runner's user alone, for the length
  # of the step. Nothing runs without the scratch repository's name; with the name and without the
  # app, the step fails, because half a configuration is a fault and not a skip (NEED-0016). The
  # hosting service charges nothing for these calls; the job's time limit bounds the run, and the
  # test log, which lists every call's test, is its evidence.
  connector:
    if: github.repository == 'Jersyfi/taktus' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: live
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: make install
      - name: live connector test
        if: ${{ vars.TAKTUS_LIVE_REPOSITORY != '' }}
        env:
          TAKTUS_LIVE_REPOSITORY: ${{ vars.TAKTUS_LIVE_REPOSITORY }}
          TAKTUS_REPOSITORY_APP_ID: ${{ secrets.LIVE_APP_ID }}
          LIVE_APP_PRIVATE_KEY: ${{ secrets.LIVE_APP_PRIVATE_KEY }}
        # `shell: bash` runs with pipefail, so that a failing test fails the step through `tee`.
        shell: bash
        run: |
          if [ -z "$TAKTUS_REPOSITORY_APP_ID" ] || [ -z "$LIVE_APP_PRIVATE_KEY" ]; then
            echo "::error::the app's identifier or key is not set in the environment 'live' (NEED-0016)"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/live" "$RUNNER_TEMP/app"
          chmod 700 "$RUNNER_TEMP/app"
          key="$RUNNER_TEMP/app/key.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$LIVE_APP_PRIVATE_KEY" >"$key")
          unset LIVE_APP_PRIVATE_KEY
          export TAKTUS_CREDENTIAL_REPOSITORY_APP_KEY_FILE="$key"
          uv run pytest tests/adapters/connectors/test_repository_live.py -rA \
            | tee "$RUNNER_TEMP/live/connector.log"
          # A test that skipped proved nothing: the run fails unless it passed.
          grep -Eq '^PASSED ' "$RUNNER_TEMP/live/connector.log" \
            || { echo "::error::the live connector test did not run"; exit 1; }
      - name: not provided yet
        if: ${{ vars.TAKTUS_LIVE_REPOSITORY == '' }}
        run: echo "::notice::the scratch repository is not configured in the environment 'live' (NEED-0016); nothing ran"
      - name: keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-connector-${{ github.run_id }}
          path: ${{ runner.temp }}/live
          if-no-files-found: ignore
          retention-days: 90

  # The coding worker against its real agent, on one small assignment: one file in an empty
  # workspace (#68, NEED-0012). The job spends money on the agent's key, so it does not start
  # without the cap per run. The test converts the cap into the run's budget in tokens, because
  # the worker learns the money only when the assignment ends; the worker halts at a boundary
  # before the cap's line (NTC-0028). The run's ledger, its output, the conversion and the
  # worker's log are the evidence. The agent's own configuration stays out of it.
  coding:
    if: github.repository == 'Jersyfi/taktus' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: live
    timeout-minutes: 20
    steps:
      - name: refuse without the cap
        if: ${{ vars.LIVE_SPEND_CAP_USD == '' }}
        run: |
          echo "::error::the environment 'live' sets no LIVE_SPEND_CAP_USD; a job that spends money does not start without its cap (NEED-0012)"
          exit 1
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: make install
      # The version the release image carries, from the one file both read, so that the test
      # checks what ships (#116). A newer release is said, not installed: moving the pin is a
      # pull request of its own, proven by this job (workers/claudecode/README.md).
      - name: the agent's command line, at the pinned version
        run: |
          pinned="$(cat workers/claudecode/agent-version)"
          npm install --global "@anthropic-ai/claude-code@${pinned}"
          current="$(npm view @anthropic-ai/claude-code version 2>/dev/null || true)"
          if [ -n "$current" ] && [ "$current" != "$pinned" ]; then
            echo "::notice::the agent is pinned at ${pinned}; its registry's latest release is ${current}"
          fi
      - name: the key, into a file only this job reads
        env:
          KEY: ${{ secrets.CODING_AGENT_API_KEY }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/credentials"
          printf '%s' "$KEY" > "$RUNNER_TEMP/credentials/coding-agent-api-key"
          echo "TAKTUS_CREDENTIAL_CODING_AGENT_API_KEY_FILE=$RUNNER_TEMP/credentials/coding-agent-api-key" >> "$GITHUB_ENV"
      - name: live coding worker test
        env:
          LIVE_SPEND_CAP_USD: ${{ vars.LIVE_SPEND_CAP_USD }}
          TAKTUS_REQUIRE_LIVE: "1"
          TAKTUS_LIVE_EVIDENCE: ${{ runner.temp }}/live/coding
        # `shell: bash` runs with pipefail, so that a failing test fails the step through `tee`.
        shell: bash
        run: |
          mkdir -p "$TAKTUS_LIVE_EVIDENCE"
          uv run pytest -rA \
            "tests/workers/test_coding_worker_live.py::test_the_coding_worker_against_its_real_agent_under_the_cap" \
            | tee "$RUNNER_TEMP/live/pytest.log"
      - name: the tokens against the estimate, on the run's page
        if: always()
        run: cat "$RUNNER_TEMP/live/coding/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/credentials"
      - name: keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-coding-${{ github.run_id }}
          path: ${{ runner.temp }}/live
          if-no-files-found: ignore
          retention-days: 90
