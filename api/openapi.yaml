components:
  schemas:
    AcceptBody:
      properties:
        process_version:
          type: string
          minLength: 1
          title: Process Version
      type: object
      required:
      - process_version
      title: AcceptBody
    AddBody:
      properties:
        identity:
          type: string
          minLength: 1
          title: Identity
        org_path:
          items:
            type: string
          type: array
          title: Org Path
          description: Below the tenant.
        roles:
          items:
            type: string
          type: array
          title: Roles
      type: object
      required:
      - identity
      title: AddBody
    Answer:
      type: string
      enum:
      - send
      - not
      - local
    CaseBody:
      properties:
        process:
          type: string
          minLength: 1
          title: Process
          description: A process of your tenant.
        inputs:
          additionalProperties: true
          type: object
          title: Inputs
          description: The run's inputs.
      additionalProperties: false
      type: object
      required:
      - process
      title: CaseBody
    ChooseBody:
      properties:
        choices:
          additionalProperties: true
          type: object
          title: Choices
          description: The value of each choice the process offers, by its name; a choice left out keeps
            the value the gallery shows.
      type: object
      title: ChooseBody
    Circle:
      type: string
      enum:
      - alone
      - team
      - project_team
      - company
      title: Circle
      description: Whom a project is for (UC-1.6 §2).
    CoachBody:
      properties:
        'on':
          type: boolean
          title: 'On'
        hints_per_week:
          anyOf:
          - type: integer
            maximum: 7.0
            minimum: 0.0
          - type: 'null'
          title: Hints Per Week
      type: object
      required:
      - 'on'
      title: CoachBody
    CommissionBody:
      properties:
        approve_raise:
          type: boolean
          title: Approve Raise
          description: 'True: you approve a raise of an autonomy level the version makes (ADR-0026).'
          default: false
        override:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Override
          description: 'Your reason for commissioning against the verdict of the proposal''s evaluation
            on the process''s cases: a regression, or a case without a score. Recorded with the reason
            (ADR-0134 §4).'
      type: object
      title: CommissionBody
    DeclineBody:
      properties:
        purpose:
          type: string
          pattern: ^[a-z][a-z0-9_-]*$
          title: Purpose
          description: The offer's purpose.
        occasion:
          type: string
          title: Occasion
          description: 'The offer''s occasion: introduced, proposed or changed.'
        model:
          type: string
          minLength: 1
          title: Model
          description: The model the offer concerns.
        reason:
          type: string
          maxLength: 500
          title: Reason
          description: Why you decline it, in your words; optional.
          default: ''
      additionalProperties: false
      type: object
      required:
      - purpose
      - occasion
      - model
      title: DeclineBody
    FieldsBody:
      properties:
        fields:
          additionalProperties: true
          type: object
          title: Fields
          description: The fields of the draft, set at once.
      type: object
      required:
      - fields
      title: FieldsBody
    HandBackBody:
      properties:
        result:
          title: Result
          description: The step's result, as one JSON value. It is kept as the step's artifact `<takeover>.result`,
            and the steps after it read it as they would the worker's.
      type: object
      required:
      - result
      title: HandBackBody
    KnowledgeBody:
      properties:
        base:
          type: string
          minLength: 1
          title: Base
          description: The link documentation is filed under.
      type: object
      required:
      - base
      title: KnowledgeBody
    LevelsBody:
      properties:
        levels:
          items:
            type: string
          type: array
          maxItems: 8
          minItems: 2
          title: Levels
      type: object
      required:
      - levels
      title: LevelsBody
    LinkCodeRequest:
      properties:
        channel:
          type: string
          pattern: ^[a-z][a-z0-9]*(\.[a-z][a-z0-9_-]*)+$
          title: Channel
          description: The channel whose account is to be linked, as a capability (`channel.repo`).
      type: object
      required:
      - channel
      title: LinkCodeRequest
    MessageBody:
      properties:
        text:
          type: string
          maxLength: 8000
          minLength: 1
          title: Text
          description: What the step's worker should take into account from its next boundary on. It is
            an input of the steps after that boundary; it never widens what the step may do, nor what
            it may consume.
      type: object
      required:
      - text
      title: MessageBody
    Mode:
      type: string
      enum:
      - guided
      - expert
      title: Mode
    OpenBody:
      properties:
        said:
          type: string
          maxLength: 2000
          title: Said
          description: What should be achieved.
          default: ''
      type: object
      title: OpenBody
    PlaceBody:
      properties:
        unit:
          type: string
          minLength: 1
          title: Unit
      type: object
      required:
      - unit
      title: PlaceBody
    PlacedKind:
      type: string
      enum:
      - process
      - agent
      - connector
      - model
      - skill
      - budget
      title: PlacedKind
      description: What a unit holds. Every one of these belongs to exactly one unit (UC-1.4 §2).
    PrepareBody:
      properties:
        kind:
          $ref: '#/components/schemas/RequestKind'
          description: access, rectification, erasure or portability.
        subject:
          type: string
          maxLength: 500
          minLength: 1
          title: Subject
          description: The subject, by the identifier the organisation's systems use — the value a case's
            scope names.
      additionalProperties: false
      type: object
      required:
      - kind
      - subject
      title: PrepareBody
    ProjectBody:
      properties:
        id:
          type: string
          minLength: 1
          title: Id
        name:
          type: string
          minLength: 1
          title: Name
        circle:
          $ref: '#/components/schemas/Circle'
        unit:
          anyOf:
          - type: string
          - type: 'null'
          title: Unit
        members:
          items:
            type: string
          type: array
          title: Members
      type: object
      required:
      - id
      - name
      - circle
      title: ProjectBody
    ProposeBody:
      properties:
        bundle:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Bundle
          description: The changed process bundle, as a document. Without it, `request` is turned into
            a proposal by the process the instance names for it, and the answer names that run (ADR-0091
            §2).
        request:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Request
          description: The words the change was asked for in.
      type: object
      title: ProposeBody
    QuotaBody:
      properties:
        concurrent_runs:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Concurrent Runs
        budget:
          items:
            type: string
          type: array
          title: Budget
          description: As 250eur, once a currency.
        check_every_seconds:
          type: integer
          minimum: 1.0
          title: Check Every Seconds
          default: 900
      type: object
      title: QuotaBody
    Reference:
      properties:
        kind:
          type: string
          maxLength: 40
          minLength: 1
          title: Kind
        link:
          type: string
          maxLength: 2000
          minLength: 1
          title: Link
        title:
          type: string
          maxLength: 200
          title: Title
          default: ''
      additionalProperties: false
      type: object
      required:
      - kind
      - link
      title: Reference
      description: 'Something of the organisation''s own that a project refers to: a ticket, a document,
        a

        board. The project holds the link, never a copy (UC-1.6 §2).'
    RehearseBody:
      properties:
        inputs:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Inputs
          description: What the rehearsal is given; without it, the active version's last run's.
      type: object
      title: RehearseBody
    ReportAnswerBody:
      properties:
        option:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Option
          description: The identifier of one offered answer.
        text:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Text
          description: The answer in your words, as in the channel.
      type: object
      title: ReportAnswerBody
    RequestKind:
      type: string
      enum:
      - access
      - rectification
      - erasure
      - portability
      title: RequestKind
    ReviewAnswer:
      properties:
        answer:
          $ref: '#/components/schemas/Answer'
          description: '`send` it now, `not` now, or `local` for us.'
      additionalProperties: false
      type: object
      required:
      - answer
      title: ReviewAnswer
      description: An answer to one candidate in review. A field the surface does not know is refused.
    ReviewConfirmation:
      properties:
        answer:
          $ref: '#/components/schemas/Answer'
        confirmation:
          type: string
          maxLength: 64
          minLength: 64
          title: Confirmation
          description: 'The `confirmation` the reading carried: a digest of what was read back.'
        confirmed:
          type: boolean
          title: Confirmed
          description: 'True: do it. False: nothing is done.'
      additionalProperties: false
      type: object
      required:
      - answer
      - confirmation
      - confirmed
      title: ReviewConfirmation
      description: The reading of an answer, confirmed or rejected.
    RolesBody:
      properties:
        roles:
          items:
            type: string
          type: array
          title: Roles
      type: object
      title: RolesBody
    RollbackBody:
      properties:
        approve_raise:
          type: boolean
          title: Approve Raise
          description: 'True: you approve a raise of an autonomy level the version makes (ADR-0026).'
          default: false
        version:
          type: string
          minLength: 1
          title: Version
          description: The earlier version to make current again.
        as_version:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: As Version
          description: The new version's name; the next free one if none.
      type: object
      required:
      - version
      title: RollbackBody
    SayBody:
      properties:
        text:
          type: string
          maxLength: 8000
          minLength: 1
          title: Text
        channel:
          type: string
          title: Channel
          default: channel.web
      type: object
      required:
      - text
      title: SayBody
    SettleBody:
      properties:
        goal:
          type: string
          maxLength: 2000
          minLength: 1
          title: Goal
      type: object
      required:
      - goal
      title: SettleBody
    Share:
      properties:
        role:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          title: Role
          description: 'The role the trace is shared with: a lowercase token such as `reviewer`. Never
            a person.'
      additionalProperties: false
      type: object
      required:
      - role
      title: Share
      description: A field the surface does not know — a person among them — is refused.
    ShareBody:
      properties:
        circle:
          $ref: '#/components/schemas/Circle'
        unit:
          anyOf:
          - type: string
          - type: 'null'
          title: Unit
      type: object
      required:
      - circle
      title: ShareBody
    StreamBody:
      properties:
        name:
          type: string
          minLength: 1
          title: Name
          description: The stream's name, as people call it.
        kind:
          $ref: '#/components/schemas/StreamKind'
          description: '`core` from the customer''s need to their outcome; `management` or `support` beside
            the core streams.'
        trigger:
          type: string
          minLength: 1
          title: Trigger
          description: The need it starts from.
        outcome:
          type: string
          minLength: 1
          title: Outcome
          description: The outcome it ends in.
        role:
          type: string
          pattern: ^[a-z][a-z0-9_.-]*$
          title: Role
          description: The one role responsible. Never a person.
        processes:
          items:
            type: string
          type: array
          minItems: 1
          title: Processes
          description: Its processes, in the order they hand over to each other.
      type: object
      required:
      - name
      - kind
      - trigger
      - outcome
      - role
      - processes
      title: StreamBody
    StreamKind:
      type: string
      enum:
      - core
      - management
      - support
      title: StreamKind
    Submitted:
      properties:
        key:
          type: string
          maxLength: 200
          minLength: 1
          title: Key
          description: The sender's public key, base64url.
        payload:
          type: string
          maxLength: 40000
          minLength: 1
          title: Payload
          description: The submission as JSON text, exactly as it was signed.
        signature:
          type: string
          maxLength: 400
          minLength: 1
          title: Signature
          description: The signature over the payload, base64url.
      additionalProperties: false
      type: object
      required:
      - key
      - payload
      - signature
      title: Submitted
      description: One signed submission. A field the surface does not know is refused.
    TenantName:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
          description: 'The tenant''s display name: what a person reads. It may change later.'
        by:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: By
          description: The administrator who acts, as the ledger names them. Optional.
      additionalProperties: false
      type: object
      required:
      - name
      title: TenantName
      description: A field the surface does not know — an identifier among them — is refused.
    TrialBody:
      properties:
        role:
          type: string
          pattern: ^[a-z][a-z0-9-]*$
          title: Role
          description: 'The role that ran the process by hand: a role, never a person.'
        passed:
          type: boolean
          title: Passed
          description: Whether the process could be run from the instructions alone.
        missing:
          items:
            type: string
          type: array
          title: Missing
          description: What the instructions lacked, one point per entry.
      type: object
      required:
      - role
      - passed
      title: TrialBody
    UnitBody:
      properties:
        id:
          type: string
          minLength: 1
          title: Id
        name:
          type: string
          minLength: 1
          title: Name
        parent:
          type: string
          minLength: 1
          title: Parent
      type: object
      required:
      - id
      - name
      - parent
      title: UnitBody
    taktus__adapters__driving__rest__app__AnswerBody:
      properties:
        option:
          anyOf:
          - type: string
            pattern: ^[A-Z]$
          - type: 'null'
          title: Option
          description: The identifier of one option.
        text:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Text
          description: Free text, as you would write it.
      type: object
      title: AnswerBody
    taktus__adapters__driving__rest__app__ConfirmBody:
      properties:
        confirmed:
          type: boolean
          title: Confirmed
          description: 'True: the reading sent back is right, and it takes effect. False: it is not; nothing
            takes effect and the request is open again.'
      type: object
      required:
      - confirmed
      title: ConfirmBody
    taktus__adapters__driving__rest__catalogue__StartBody:
      properties:
        inputs:
          additionalProperties: true
          type: object
          title: Inputs
          description: The process's inputs by name, as its catalogue entry lists them.
      type: object
      title: StartBody
    taktus__adapters__driving__rest__evaluations__ConfirmBody:
      properties:
        target:
          title: Target
          description: The result the step should have produced, where it is not the corrected value the
            case was proposed with.
      type: object
      title: ConfirmBody
    taktus__adapters__driving__rest__planning__AnswerBody:
      properties:
        field:
          type: string
          minLength: 1
          title: Field
          description: The field the guided question asked for.
        value:
          title: Value
          description: The answer.
        step_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Step Id
          description: 'For an estimate: its step.'
      type: object
      required:
      - field
      - value
      title: AnswerBody
    taktus__adapters__driving__rest__subjects__ConfirmBody:
      properties:
        identity_checked:
          type: boolean
          title: Identity Checked
          description: You checked that the person asking is the subject, or may act for them. Without
            it nothing is carried out.
      additionalProperties: false
      type: object
      required:
      - identity_checked
      title: ConfirmBody
    taktus__adapters__driving__rest__trials__StartBody:
      properties:
        purpose:
          type: string
          pattern: ^[a-z][a-z0-9_-]*$
          title: Purpose
          description: The purpose the candidates are tried for.
        candidates:
          items:
            type: string
          type: array
          maxItems: 8
          minItems: 1
          title: Candidates
          description: The models to try, each a model of this instance's configuration, as `model.<member>`.
        occasion:
          type: string
          title: Occasion
          description: 'Why the trial runs: one of introduced, proposed, changed, asked; `asked` unless
            it answers an offer.'
          default: asked
        cases:
          items:
            $ref: '#/components/schemas/CaseBody'
          type: array
          maxItems: 50
          title: Cases
          description: 'Cases you name beside the evaluation cases: a process whose active version asks
            for the purpose, and the inputs of one run. Each runs once per candidate; it has no target,
            so it passes on its run''s own ending (ADR-0149 §1).'
      additionalProperties: false
      type: object
      required:
      - purpose
      - candidates
      title: StartBody
