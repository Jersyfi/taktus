        '401':
          description: No account key, or one that proves no identity.
          content:
            application/problem+json: {}
        '422':
          description: A parameter does not validate.
          content:
            application/problem+json: {}
  /roles/{role}/description:
    get:
      tags:
      - roles
      summary: A role's profile as a draft position description
      description: 'Markdown. It says that it is a draft, not to be used before the labour-law review
        DEC-0029 names. It carries no time figure, nothing of the reader''s own and no person: a role''s
        description, never a person''s file.'
      operationId: drafted_roles__role__description_get
      parameters:
      - name: role
        in: path
        required: true
        schema:
          type: string
          title: Role
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: The draft.
          content:
            text/markdown; charset=utf-8: {}
        '404':
          description: No such role.
          content:
            application/problem+json: {}
        '401':
          description: No account key, or one that proves no identity.
          content:
            application/problem+json: {}
        '422':
          description: A parameter does not validate.
          content:
            application/problem+json: {}
  /runs/{run_id}/spend:
    get:
      tags:
      - spend
      summary: Where one run spent, step by step
      description: 'Each step''s tokens by price kind (plain input, cache writes, cache reads, output),
        turns, the input before and after a compression, compute seconds, money at the run''s own price
        table and Takte at its own weighting table, its outcome and the digest of its result. What cannot
        be priced is named, never counted as free. With `against`, another run of the same task beside
        it: both by step, per step the difference right less left and whether both produced the same result;
        where the runs are of different processes or priced at different tables, the answer says so (ADR-0148).'
      operationId: of_run_runs__run_id__spend_get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      - name: against
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          description: A second run to set beside this one.
          title: Against
        description: A second run to set beside this one.
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: The run's spend, or the two runs side by side.
          content:
            application/json:
              schema: {}
        '401':
          description: No account key, or one that proves no identity.
          content:
            application/problem+json: {}
        '404':
          description: No such run or process that you may see.
          content:
            application/problem+json: {}
        '422':
          description: A parameter does not validate.
          content:
            application/problem+json: {}
  /processes/{process_id}/spend:
    get:
      tags:
      - spend
      summary: Where a process spent over a window, step by step
      description: 'Every run of the process whose steps finished in the last `days` days, per step: what
        it used, how often it finished, and its money summed per currency at each run''s own table (ADR-0148).'
      operationId: of_process_processes__process_id__spend_get
      parameters:
      - name: process_id
        in: path
        required: true
        schema:
          type: string
          title: Process Id
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 366
          minimum: 1
          description: How many days back from now; 30 unless given.
          default: 30
          title: Days
        description: How many days back from now; 30 unless given.
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: The process's spend per step.
          content:
            application/json:
              schema: {}
        '401':
          description: No account key, or one that proves no identity.
          content:
            application/problem+json: {}
        '404':
          description: No such run or process that you may see.
          content:
            application/problem+json: {}
        '422':
          description: A parameter does not validate.
          content:
            application/problem+json: {}
  /trials:
    get:
      tags:
      - trials
      summary: The model trials of your tenant, and those offered
      description: Every trial, newest first, and the trials offered now (ADR-0149 §3).
      operationId: trials_trials_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: The trials and the offers.
          content:
            application/json:
              schema: {}
        '401':
          description: No account key, or one that proves no identity.
          content:
            application/problem+json: {}
        '422':
          description: A parameter does not validate.
          content:
            application/problem+json: {}
    post:
      tags:
      - trials
      summary: Start a model trial
      description: 'Every evaluation case of the processes whose active version asks for the purpose runs
        once per candidate, as a rehearsal: nothing outside is acted on, and the purpose is bound to the
        candidate for that run alone. Each run is held to its version''s limits. The ledger records `trial.started`
        with you as its actor (ADR-0149).'
      operationId: start_trials_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/taktus__adapters__driving__rest__trials__StartBody'
      responses:
        '201':
          description: The trial, its runs submitted.
          content:
            application/json:
              schema:
                title: Response Start Trials Post
        '409':
          description: No process asks for the purpose with cases.
          content:
            application/problem+json: {}
        '401':
          description: No account key, or one that proves no identity.
          content:
            application/problem+json: {}
        '422':
          description: A parameter does not validate.
          content:
            application/problem+json: {}
  /trials/offers:
    get:
      tags:
      - trials
      summary: The model trials offered now
      description: A trial is offered when a purpose's model has answered no step yet and no trial included
        it, when Taktus proposed another model for a purpose, and when the model a member answers as changed
        its version since the purpose's last trial. An offer is never started on its own (ADR-0149 §3).
      operationId: offers_trials_offers_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: The offers.
          content:
            application/json:
              schema: {}
        '401':
          description: No account key, or one that proves no identity.
          content:
            application/problem+json: {}
        '422':
          description: A parameter does not validate.
          content:
            application/problem+json: {}
  /trials/{trial_id}:
    get:
      tags:
      - trials
      summary: One model trial, with its report
      description: Per candidate the cases passed, money at each run's own price table, tokens in and
        out, wall time, and each case's result digests beside the other candidates'; the cases whose results
        differ are named. `settled` says whether every run has gone as far as it can. The report decides
        nothing (ADR-0149 §2, §4).
      operationId: read_trials__trial_id__get
      parameters:
      - name: trial_id
        in: path
        required: true
        schema:
          type: string
          title: Trial Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: The trial and its report.
          content:
            application/json:
              schema:
                title: Response Read Trials  Trial Id  Get
        '404':
          description: No such trial of your tenant.
          content:
            application/problem+json: {}
        '401':
          description: No account key, or one that proves no identity.
          content:
            application/problem+json: {}
        '422':
          description: A parameter does not validate.
          content:
            application/problem+json: {}
components:
  schemas:
    Answer:
      type: string
      enum:
      - send
      - not
      - local
    AnswerBody:
      properties:
        option:
          anyOf:
          - type: string
            pattern: ^[A-Z]$
          - type: 'null'
          title: Option
          description: The identifier of one option.
        text:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Text
          description: Free text, as you would write it.
      type: object
      title: AnswerBody
    ChooseBody:
      properties:
        choices:
          additionalProperties: true
          type: object
          title: Choices
          description: The value of each choice the process offers, by its name; a choice left out keeps
            the value the gallery shows.
      type: object
      title: ChooseBody
    CommissionBody:
      properties:
        approve_raise:
          type: boolean
          title: Approve Raise
          description: 'True: you approve a raise of an autonomy level the version makes (ADR-0026).'
          default: false
        override:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Override
          description: 'Your reason for commissioning against the verdict of the proposal''s evaluation
            on the process''s cases: a regression, or a case without a score. Recorded with the reason
            (ADR-0134 §4).'
      type: object
      title: CommissionBody
    HandBackBody:
      properties:
        result:
          title: Result
          description: The step's result, as one JSON value. It is kept as the step's artifact `<takeover>.result`,
            and the steps after it read it as they would the worker's.
      type: object
      required:
      - result
      title: HandBackBody
    LinkCodeRequest:
      properties:
        channel:
          type: string
          pattern: ^[a-z][a-z0-9]*(\.[a-z][a-z0-9_-]*)+$
          title: Channel
          description: The channel whose account is to be linked, as a capability (`channel.repo`).
      type: object
      required:
      - channel
      title: LinkCodeRequest
    MessageBody:
      properties:
        text:
          type: string
          maxLength: 8000
          minLength: 1
          title: Text
          description: What the step's worker should take into account from its next boundary on. It is
            an input of the steps after that boundary; it never widens what the step may do, nor what
            it may consume.
      type: object
      required:
      - text
      title: MessageBody
    ProposeBody:
      properties:
        bundle:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Bundle
          description: The changed process bundle, as a document. Without it, `request` is turned into
            a proposal by the process the instance names for it, and the answer names that run (ADR-0091
            §2).
        request:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Request
          description: The words the change was asked for in.
      type: object
      title: ProposeBody
    RehearseBody:
      properties:
        inputs:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Inputs
          description: What the rehearsal is given; without it, the active version's last run's.
      type: object
      title: RehearseBody
    ReportAnswerBody:
      properties:
        option:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Option
          description: The identifier of one offered answer.
        text:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Text
          description: The answer in your words, as in the channel.
      type: object
      title: ReportAnswerBody
    ReviewAnswer:
      properties:
        answer:
          $ref: '#/components/schemas/Answer'
          description: '`send` it now, `not` now, or `local` for us.'
      additionalProperties: false
      type: object
      required:
      - answer
      title: ReviewAnswer
      description: An answer to one candidate in review. A field the surface does not know is refused.
    ReviewConfirmation:
      properties:
        answer:
          $ref: '#/components/schemas/Answer'
        confirmation:
          type: string
          maxLength: 64
          minLength: 64
          title: Confirmation
          description: 'The `confirmation` the reading carried: a digest of what was read back.'
        confirmed:
          type: boolean
          title: Confirmed
          description: 'True: do it. False: nothing is done.'
      additionalProperties: false
      type: object
      required:
      - answer
      - confirmation
      - confirmed
      title: ReviewConfirmation
      description: The reading of an answer, confirmed or rejected.
    RollbackBody:
      properties:
        approve_raise:
          type: boolean
          title: Approve Raise
          description: 'True: you approve a raise of an autonomy level the version makes (ADR-0026).'
          default: false
        version:
          type: string
          minLength: 1
          title: Version
          description: The earlier version to make current again.
        as_version:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: As Version
          description: The new version's name; the next free one if none.
      type: object
      required:
      - version
      title: RollbackBody
    Share:
      properties:
        role:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          title: Role
          description: 'The role the trace is shared with: a lowercase token such as `reviewer`. Never
            a person.'
      additionalProperties: false
      type: object
      required:
      - role
      title: Share
      description: A field the surface does not know — a person among them — is refused.
    StreamBody:
      properties:
        name:
          type: string
          minLength: 1
          title: Name
          description: The stream's name, as people call it.
        kind:
          $ref: '#/components/schemas/StreamKind'
          description: '`core` from the customer''s need to their outcome; `management` or `support` beside
            the core streams.'
        trigger:
          type: string
          minLength: 1
          title: Trigger
          description: The need it starts from.
        outcome:
          type: string
          minLength: 1
          title: Outcome
          description: The outcome it ends in.
        role:
          type: string
          pattern: ^[a-z][a-z0-9_.-]*$
          title: Role
          description: The one role responsible. Never a person.
        processes:
          items:
            type: string
          type: array
          minItems: 1
          title: Processes
          description: Its processes, in the order they hand over to each other.
      type: object
      required:
      - name
      - kind
      - trigger
      - outcome
      - role
      - processes
      title: StreamBody
    StreamKind:
      type: string
      enum:
      - core
      - management
      - support
      title: StreamKind
    Submitted:
      properties:
        key:
          type: string
          maxLength: 200
          minLength: 1
          title: Key
          description: The sender's public key, base64url.
        payload:
          type: string
          maxLength: 40000
          minLength: 1
          title: Payload
          description: The submission as JSON text, exactly as it was signed.
        signature:
          type: string
          maxLength: 400
          minLength: 1
          title: Signature
          description: The signature over the payload, base64url.
      additionalProperties: false
      type: object
      required:
      - key
      - payload
      - signature
      title: Submitted
      description: One signed submission. A field the surface does not know is refused.
    TenantName:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
          description: 'The tenant''s display name: what a person reads. It may change later.'
        by:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: By
          description: The administrator who acts, as the ledger names them. Optional.
      additionalProperties: false
      type: object
      required:
      - name
      title: TenantName
      description: A field the surface does not know — an identifier among them — is refused.
    taktus__adapters__driving__rest__app__ConfirmBody:
      properties:
        confirmed:
          type: boolean
          title: Confirmed
          description: 'True: the reading sent back is right, and it takes effect. False: it is not; nothing
            takes effect and the request is open again.'
      type: object
      required:
      - confirmed
      title: ConfirmBody
    taktus__adapters__driving__rest__catalogue__StartBody:
      properties:
        inputs:
          additionalProperties: true
          type: object
          title: Inputs
          description: The process's inputs by name, as its catalogue entry lists them.
      type: object
      title: StartBody
    taktus__adapters__driving__rest__evaluations__ConfirmBody:
      properties:
        target:
          title: Target
          description: The result the step should have produced, where it is not the corrected value the
            case was proposed with.
      type: object
      title: ConfirmBody
    taktus__adapters__driving__rest__trials__StartBody:
      properties:
        purpose:
          type: string
          pattern: ^[a-z][a-z0-9_-]*$
          title: Purpose
          description: The purpose the candidates are tried for.
        candidates:
          items:
            type: string
          type: array
          maxItems: 8
          minItems: 1
          title: Candidates
          description: The models to try, each a model of this instance's configuration, as `model.<member>`.
        occasion:
          type: string
          title: Occasion
          description: 'Why the trial runs: one of introduced, proposed, changed, asked; `asked` unless
            it answers an offer.'
          default: asked
      additionalProperties: false
      type: object
      required:
      - purpose
      - candidates
      title: StartBody
