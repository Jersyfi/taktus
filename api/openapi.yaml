openapi: 3.1.0
info:
  title: Taktus
  description: An operating layer for a business — the control plane's own interface.
  version: 0.1.0
servers:
- url: '{prefix}'
  description: The path prefix the instance is served under (TAKTUS_PATH_PREFIX).
  variables:
    prefix:
      default: /
paths:
  /health:
    get:
      tags:
      - operations
      summary: 'Liveness: the process is alive'
      operationId: health_health_get
      responses:
        '200':
          description: The process answers.
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Health Get
  /ready:
    get:
      tags:
      - operations
      summary: 'Readiness: the process may receive traffic'
      operationId: ready_ready_get
      responses:
        '200':
          description: The database answers and is at the schema this build needs.
          content:
            application/json:
              schema: {}
        '503':
          description: Not ready; the problem's detail says why.
          content:
            application/problem+json: {}
  /intake/{channel}:
    post:
      tags:
      - intake
      summary: Webhook intake for a channel
      description: The delivery as the source system sent it — every header, the raw body — is handed
        to the connector that serves the channel. The connector verifies the signature before it reads
        the body, then normalises the event into the channel's half of a command. The identity component
        places the sender — the account must be linked to an identity — and the event is kept in that
        identity's tenant until it is completed into a command. A sender it cannot place is answered `unknown_sender`
        and nothing is kept; the sender is told in the channel how to link the account, or that a link
        code they wrote linked it. A verified delivery that is a handshake, not an event — a sender checking
        the address before it sends events — is refused with the answer the connector gives, and that
        answer is returned as it is, status 200; nothing is kept. Nothing is executed from here.
      operationId: intake_intake__channel__post
      parameters:
      - name: channel
        in: path
        required: true
        schema:
          type: string
          title: Channel
      responses:
        '202':
          description: 'Decided: `accepted` with the intake event, `refused`, `unknown_sender` with whether
            the sender was answered in the channel and whether the message linked their account, or `answer`
            for a message in the thread of a report to the owner, with what became of it.'
          content:
            application/json:
              schema: {}
        '200':
          description: 'A handshake: the body and media type the connector answered for its sender, returned
            as they are.'
          content:
            text/plain: {}
            application/json: {}
        '400':
          description: The body cannot be read.
          content:
            application/problem+json: {}
        '401':
          description: Unsigned, or the signature does not verify.
          content:
            application/problem+json: {}
        '404':
          description: No connector serves the channel.
          content:
            application/problem+json: {}
        '503':
          description: The connector did not answer, or the instance serves no tenant.
          content:
            application/problem+json: {}
        '422':
          description: A parameter does not validate.
          content:
            application/problem+json: {}
  /intake-events/{event_id}/complete:
    post:
      tags:
      - intake
      summary: Complete an intake event into a command
      description: 'The account key in `Authorization: Bearer` proves the caller''s identity, and only
        there: a key in the URL is not read. Only an event of that identity''s tenant is completed; one
        of another tenant is answered as one that does not exist. The event the connector accepted becomes
        a command: the identity component supplies who acts and the organisational path, from the link
        of the sender''s account, and the event is marked completed. Nothing is executed; the command
        is returned for whoever commissions a plan from it.'
      operationId: complete_intake_events__event_id__complete_post
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          title: Event Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: The command the event became.
          content:
            application/json:
              schema: {}
        '401':
          description: No account key, or one that proves no identity.
          content:
            application/problem+json: {}
        '404':
          description: No such intake event in your tenant.
          content:
            application/problem+json: {}
        '409':
          description: The event was completed before.
          content:
            application/problem+json: {}
        '422':
          description: The sender cannot be placed.
          content:
            application/problem+json: {}
  /identity/link-codes:
    post:
      tags:
      - identity
      summary: Create a link code in your Taktus account
      description: 'The account key in `Authorization: Bearer` proves the identity. The answer is a single-use
        code, valid for 30 minutes and shown once: written in the named channel from the account to be
        linked, it links that account to this identity. Nothing else links an account; a matching name
        or address never does (ADR-0040).'
      operationId: create_link_code_identity_link_codes_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkCodeRequest'
      responses:
        '201':
          description: The code, the channel and when the code expires.
          content:
            application/json:
              schema: {}
        '401':
          description: No account key, or one that proves no identity.
          content:
            application/problem+json: {}
        '422':
          description: A parameter does not validate.
          content:
            application/problem+json: {}
  /identity/agent-key:
    post:
      tags:
      - identity
      summary: Create an agent key for your own agent
      description: 'The account key in `Authorization: Bearer`, or the web app''s session, proves the
        identity. The answer is a new agent key, shown once: your own agent proves you with it on the
        MCP surface at `mcp`, and nowhere else. The key before it stops working. Your agent may read there;
        it may act only where a role you hold was granted the right, and `rights` names the rights your
        roles hold now (ADR-0131).'
      operationId: create_agent_key_identity_agent_key_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '201':
          description: The agent key, and the rights your roles hold.
          content:
            application/json:
              schema: {}
        '401':
          description: No account key, or one that proves no identity.
          content:
            application/problem+json: {}
        '422':
          description: A parameter does not validate.
          content:
            application/problem+json: {}
  /session:
    post:
      tags:
      - identity
      summary: 'Sign in to the web app: exchange your account key for a session cookie'
      description: 'The account key in `Authorization: Bearer` proves the identity, once. The answer sets
        the cookie `taktus_session`: `HttpOnly`, `Secure`, `SameSite=Strict`, scoped to the instance''s
        path prefix, and valid for `TAKTUS_SESSION_HOURS` (12 by default). From then on the cookie is
        accepted wherever the account key is. The token is never in the body. The session ends at its
        time, on `DELETE /session`, and when the identity''s key is replaced (ADR-0119).'
      operationId: sign_in_session_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '201':
          description: 'Signed in: who, and until when. The cookie is set.'
          content:
            application/json:
              schema: {}
        '401':
          description: No account key, or one that proves no identity.
          content:
            application/problem+json: {}
        '422':
          description: A parameter does not validate.
          content:
            application/problem+json: {}
    delete:
      tags:
      - identity
      summary: Sign out of the web app
      description: The session the cookie names ends now, and the answer clears the cookie. Signing out
        without a session clears the cookie too.
      operationId: sign_out_session_delete
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '204':
          description: Signed out.
        '403':
          description: The request did not come from the instance's pages.
          content:
            application/problem+json: {}
        '422':
          description: A parameter does not validate.
          content:
            application/problem+json: {}
  /decisions:
    get:
      tags:
      - decisions
      summary: The decision requests addressed to you
      description: Every request not yet applied whose deciding role your identity holds, the oldest due
        first; `overdue` marks one past its due date. Nothing waits silently (ADR-0042).
      operationId: addressed_decisions_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: The requests.
          content:
            application/json:
              schema: {}
        '401':
          description: No account key, or one that proves no identity.
          content:
            application/problem+json: {}
        '422':
          description: A parameter does not validate.
          content:
            application/problem+json: {}
  /decisions/response-times:
    get:
      tags:
      - decisions
      summary: 'How long decisions took: yours, and the rest only aggregated'
      description: Your own response times, each decision with its time; everyone else's only aggregated
        by role and by department, never by person, and withheld where a group has fewer than two deciders
        (ADR-0015).
      operationId: response_times_decisions_response_times_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: The response times you may read.
          content:
            application/json:
              schema: {}
        '401':
          description: No account key, or one that proves no identity.
          content:
            application/problem+json: {}
        '422':
          description: A parameter does not validate.
          content:
            application/problem+json: {}
  /decisions/{request_id}:
    get:
      tags:
      - decisions
      summary: One decision request addressed to you
      operationId: one_decisions__request_id__get
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema:
                title: Response One Decisions  Request Id  Get
        '403':
          description: The request is not addressed to you.
          content:
            application/problem+json: {}
        '404':
          description: No such request.
          content:
            application/problem+json: {}
        '401':
          description: No account key, or one that proves no identity.
          content:
            application/problem+json: {}
        '422':
          description: A parameter does not validate.
          content:
            application/problem+json: {}
  /decisions/{request_id}/answer:
    post:
      tags:
      - decisions
      summary: Answer a decision request
      description: 'With `option`, one option by its identifier; with `text`, free text. Neither takes
        effect: the answer is read, the reading comes back in one message, and only once you confirm it
        does it take effect (ADR-0008). Free text from which no single option can be read changes nothing,
        and the message says so.'
      operationId: answer_decisions__request_id__answer_post
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerBody'
      responses:
        '200':
          description: The message sent back, and the request.
          content:
            application/json:
              schema: {}
        '403':
          description: You do not hold the role that decides it.
          content:
            application/problem+json: {}
        '404':
          description: No such request.
          content:
            application/problem+json: {}
        '409':
          description: The request's answer already took effect.
          content:
            application/problem+json: {}
        '401':
          description: No account key, or one that proves no identity.
          content:
            application/problem+json: {}
        '422':
          description: A parameter does not validate.
          content:
            application/problem+json: {}
  /decisions/{request_id}/confirm:
    post:
      tags:
      - decisions
      summary: Confirm, or reject, how your answer was read
      description: 'Confirmed, the reading takes effect: the request is applied, the decision register
        gains its entry, and the run continues — or halts at its boundary, if the act was declined. Rejected,
        nothing takes effect and the request is open again.'
      operationId: confirm_decisions__request_id__confirm_post
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/taktus__adapters__driving__rest__app__ConfirmBody'
      responses:
        '200':
          description: Whether it was applied, and the register entry.
          content:
            application/json:
              schema: {}
        '403':
          description: You did not give the answer that was read.
          content:
            application/problem+json: {}
        '404':
          description: No such request.
          content:
            application/problem+json: {}
        '409':
          description: There is no reading to confirm.
          content:
            application/problem+json: {}
        '401':
          description: No account key, or one that proves no identity.
          content:
            application/problem+json: {}
        '422':
          description: A parameter does not validate.
          content:
            application/problem+json: {}
  /owner/reports:
    get:
      tags:
      - owner
      summary: What is needed from the owner
      description: 'Every report to the owner — a decision request addressed to them, a need, a date,
        a failure Taktus noticed about itself — the open ones first, the earliest due first, each as its
        view: what is needed, the steps, what stands still, the date, every delivery with its outcome,
        and its history (ADR-0045). The history says whether you acted, never who did.'
      operationId: reports_owner_reports_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: The reports.
          content:
            application/json:
              schema: {}
        '401':
          description: No account key, or one that proves no identity.
          content:
            application/problem+json: {}
        '403':
          description: You are not the owner, nor someone the owner named.
          content:
            application/problem+json: {}
        '422':
          description: A parameter does not validate.
          content:
            application/problem+json: {}
  /owner/reports/{report_id}:
    get:
      tags:
      - owner
      summary: One report to the owner, with its history
      description: A browser that asks for a page and sends no account key is sent to the report's page
        in the web app, where the reader signs in (ADR-0120). A client that asks for JSON is answered
        with the view, or with a problem.
      operationId: one_owner_reports__report_id__get
      parameters:
      - name: report_id
        in: path
        required: true
        schema:
          type: string
          title: Report Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: accept
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Accept
      responses:
        '200':
          description: The report's view.
          content:
            application/json:
              schema:
                title: Response One Owner Reports  Report Id  Get
        '303':
          description: 'A browser without a key: the report''s page in the web app.'
        '404':
          description: No such report.
          content:
            application/problem+json: {}
        '401':
          description: No account key, or one that proves no identity.
          content:
            application/problem+json: {}
        '403':
          description: You are not the owner, nor someone the owner named.
          content:
            application/problem+json: {}
        '422':
          description: A parameter does not validate.
          content:
            application/problem+json: {}
  /owner/reports/{report_id}/text:
    get:
      tags:
      - owner
      summary: One report as a repository text
      description: 'The report as a record in a repository: English, minimal — what future work needs,
        and where an answer was given, never what was said there.'
      operationId: text_owner_reports__report_id__text_get
      parameters:
      - name: report_id
        in: path
        required: true
        schema:
          type: string
          title: Report Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: The text.
          content:
            application/json:
              schema:
                title: Response Text Owner Reports  Report Id  Text Get
            text/markdown: {}
        '404':
          description: No such report.
          content:
            application/problem+json: {}
        '401':
          description: No account key, or one that proves no identity.
          content:
            application/problem+json: {}
        '403':
          description: You are not the owner, nor someone the owner named.
          content:
            application/problem+json: {}
        '422':
          description: A parameter does not validate.
          content:
            application/problem+json: {}
  /owner/reports/{report_id}/answer:
    post:
      tags:
      - owner
      summary: Answer a report on its page
      description: 'With `option`, one offered answer by its identifier; with `text`, the answer in your
        words, read by the same rule as in the channel. Neither takes effect: the reading comes back as
        the channel would say it, and only once you confirm it is the answer filed (ADR-0008, ADR-0120).
        Nothing is said in the channel.'
      operationId: answer_owner_reports__report_id__answer_post
      parameters:
      - name: report_id
        in: path
        required: true
        schema:
          type: string
          title: Report Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportAnswerBody'
      responses:
        '200':
          description: What became of the answer, the sentence said back, the view.
          content:
            application/json:
              schema:
                title: Response Answer Owner Reports  Report Id  Answer Post
        '404':
          description: No such report.
          content:
            application/problem+json: {}
        '401':
          description: No account key, or one that proves no identity.
          content:
            application/problem+json: {}
        '403':
          description: You are not the owner, nor someone the owner named.
          content:
            application/problem+json: {}
        '422':
          description: A parameter does not validate.
          content:
            application/problem+json: {}
  /owner/reports/{report_id}/confirm:
    post:
      tags:
      - owner
      summary: Confirm, or reject, how your answer to a report was read
      description: Confirmed, the answer is filed where it belongs — a decision in the register, any other
        answer on the report. Rejected, nothing is filed and the report is open again. Only the person
        whose answer was read confirms it.
      operationId: confirm_owner_reports__report_id__confirm_post
      parameters:
      - name: report_id
        in: path
        required: true
        schema:
          type: string
          title: Report Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/taktus__adapters__driving__rest__app__ConfirmBody'
      responses:
        '200':
          description: What became of the reading, the sentence said back, the view.
          content:
            application/json:
              schema:
                title: Response Confirm Owner Reports  Report Id  Confirm Post
        '404':
          description: No such report.
          content:
            application/problem+json: {}
        '409':
          description: No reading of your answer waits.
          content:
            application/problem+json: {}
        '401':
          description: No account key, or one that proves no identity.
          content:
            application/problem+json: {}
        '403':
          description: You are not the owner, nor someone the owner named.
          content:
            application/problem+json: {}
        '422':
          description: A parameter does not validate.
          content:
            application/problem+json: {}
  /runs:
    get:
      tags:
      - runs
      summary: The runs you may see, newest first, a page at a time
      description: 'The account key in `Authorization: Bearer` proves the identity, and only there: a
        key in the URL is not read. The answer holds the runs of your identity''s tenant that the visibility
        predicate lets you see — the same predicate as the stream of changes (ADR-0055 §5) — newest first,
        runs created at the same moment in ascending id. A page reads at most `limit` runs; `next` is
        present when more follow, and is passed back as `after` for the next page. A page may hold fewer
        runs than `limit` where the predicate withholds some, and `next` still leads on (ADR-0094).'
      operationId: list_runs_runs_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          description: How many runs a page reads at most; 100 unless given.
          default: 100
          title: Limit
        description: How many runs a page reads at most; 100 unless given.
      - name: after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          description: The `next` of the page before; the first page without it.
          title: After
        description: The `next` of the page before; the first page without it.
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: A page of runs as the run component records them.
          content:
            application/json:
              schema: {}
        '401':
          description: No account key, or one that proves no identity.
          content:
            application/problem+json: {}
        '422':
          description: A parameter does not validate.
          content:
            application/problem+json: {}
  /runs/{run_id}:
    get:
      tags:
      - runs
      summary: One run you may see
      description: 'The account key in `Authorization: Bearer` proves the identity. A run you may not
        see is answered as one that does not exist.'
      operationId: get_run_runs__run_id__get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema:
                title: Response Get Run Runs  Run Id  Get
        '401':
          description: No account key, or one that proves no identity.
          content:
            application/problem+json: {}
        '404':
          description: No such run that you may see.
          content:
            application/problem+json: {}
        '422':
          description: A parameter does not validate.
          content:
            application/problem+json: {}
  /runs/{run_id}/ledger:
    get:
      tags:
      - runs
      summary: The ledger entries of one run you may see, in sequence
      description: 'The account key in `Authorization: Bearer` proves the identity. A run you may not
        see is answered as one that does not exist.'
      operationId: run_ledger_runs__run_id__ledger_get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: The entries, and whether the tenant's chain verifies from its last verified checkpoint,
            which `chain.checkpoint` names (ADR-0105).
          content:
            application/json:
              schema:
                title: Response Run Ledger Runs  Run Id  Ledger Get
        '401':
          description: No account key, or one that proves no identity.
          content:
            application/problem+json: {}
        '404':
          description: No such run that you may see.
          content:
            application/problem+json: {}
        '422':
          description: A parameter does not validate.
          content:
            application/problem+json: {}
  /changes:
    get:
      tags:
      - changes
      summary: The changes of state, as they happen (Server-Sent Events)
      description: 'One long-lived response, `text/event-stream`. The scope is the tenant of your identity,
        one process (`process`) or one run (`run`). The first event is a `snapshot` of the scope — every
        run you may see in it, with its state and the state of each step — and then one `change` for every
        ledger entry that records a change of state of a run, a step or a decision request in the scope,
        as it is recorded. Each event''s `id` is its position: the hash of a ledger entry. Reconnect with
        the last one you received as `Last-Event-ID`, to any replica: you receive every change after it,
        or a fresh `snapshot` when the position is unknown or more than 1,000 entries behind. A comment
        line every 15 seconds keeps the connection open. Nothing carries content, a figure or a person.
        The account key is read from `Authorization: Bearer` and nowhere else; a stream whose key no longer
        proves an identity ends (ADR-0055). The contract is `contracts/changes/v1`.'
      operationId: changes_changes_get
      parameters:
      - name: process
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          description: Only the runs of this process.
          title: Process
        description: Only the runs of this process.
      - name: run
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          description: Only this run.
          title: Run
        description: Only this run.
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: last-event-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'The position of the last event received: the stream resumes after it.'
          title: Last-Event-Id
        description: 'The position of the last event received: the stream resumes after it.'
      responses:
        '200':
          description: The stream of `snapshot` and `change` events.
          content:
            application/json:
              schema: {}
            text/event-stream: {}
        '401':
          description: No account key, or one that proves no identity.
          content:
            application/problem+json: {}
        '503':
          description: This replica holds its maximum of open streams; try again after `Retry-After` seconds,
            possibly on another replica.
          content:
            application/problem+json: {}
        '422':
          description: A parameter does not validate.
          content:
            application/problem+json: {}
