openapi: 3.1.0
info:
  title: Taktus
  description: An operating layer for a business — the control plane's own interface.
  version: 0.1.0
servers:
- url: '{prefix}'
  description: The path prefix the instance is served under (TAKTUS_PATH_PREFIX).
  variables:
    prefix:
      default: /
paths:
  /health:
    get:
      tags:
      - operations
      summary: 'Liveness: the process is alive'
      operationId: health_health_get
      responses:
        '200':
          description: The process answers.
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Health Get
  /ready:
    get:
      tags:
      - operations
      summary: 'Readiness: the process may receive traffic'
      operationId: ready_ready_get
      responses:
        '200':
          description: The database answers and is at the schema this build needs.
          content:
            application/json:
              schema: {}
        '503':
          description: Not ready; the problem's detail says why.
          content:
            application/problem+json: {}
  /intake/{channel}:
    post:
      tags:
      - intake
      summary: Webhook intake for a channel
      description: The delivery as the source system sent it — every header, the raw body — is handed
        to the connector that serves the channel. The connector verifies the signature before it reads
        the body, then normalises the event into the channel's half of a command. The identity component
        places the sender — the account must be linked to an identity — and the event is kept in that
        identity's tenant until it is completed into a command. A sender it cannot place is answered `unknown_sender`
        and nothing is kept; the sender is told in the channel how to link the account, or that a link
        code they wrote linked it. Nothing is executed from here.
      operationId: intake_intake__channel__post
      parameters:
      - name: channel
        in: path
        required: true
        schema:
          type: string
          title: Channel
      responses:
        '202':
          description: 'Decided: `accepted` with the intake event, `refused`, or `unknown_sender` with
            whether the sender was answered in the channel and whether the message linked their account.'
          content:
            application/json:
              schema: {}
        '400':
          description: The body cannot be read.
          content:
            application/problem+json: {}
        '401':
          description: Unsigned, or the signature does not verify.
          content:
            application/problem+json: {}
        '404':
          description: No connector serves the channel.
          content:
            application/problem+json: {}
        '503':
          description: The connector did not answer.
          content:
            application/problem+json: {}
        '422':
          description: A parameter does not validate.
          content:
            application/problem+json: {}
  /intake-events/{event_id}/complete:
    post:
      tags:
      - intake
      summary: Complete an intake event into a command
      description: 'The event the connector accepted becomes a command: the identity component supplies
        who acts and the organisational path, from the link of the sender''s account, and the event is
        marked completed. Nothing is executed; the command is returned for whoever commissions a plan
        from it.'
      operationId: complete_intake_events__event_id__complete_post
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          title: Event Id
      - name: tenant
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The tenant; the instance's first configured tenant when absent.
          title: Tenant
        description: The tenant; the instance's first configured tenant when absent.
      responses:
        '200':
          description: The command the event became.
          content:
            application/json:
              schema: {}
        '404':
          description: No such intake event in the tenant.
          content:
            application/problem+json: {}
        '409':
          description: The event was completed before.
          content:
            application/problem+json: {}
        '422':
          description: The sender cannot be placed.
          content:
            application/problem+json: {}
  /identity/link-codes:
    post:
      tags:
      - identity
      summary: Create a link code in your Taktus account
      description: 'The account key in `Authorization: Bearer` proves the identity. The answer is a single-use
        code, valid for 30 minutes and shown once: written in the named channel from the account to be
        linked, it links that account to this identity. Nothing else links an account; a matching name
        or address never does (ADR-0040).'
      operationId: create_link_code_identity_link_codes_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkCodeRequest'
      responses:
        '201':
          description: The code, the channel and when the code expires.
          content:
            application/json:
              schema: {}
        '401':
          description: No account key, or one that proves no identity.
          content:
            application/problem+json: {}
        '422':
          description: A parameter does not validate.
          content:
            application/problem+json: {}
  /runs:
    get:
      tags:
      - runs
      summary: The runs of a tenant, newest first
      operationId: list_runs_runs_get
      parameters:
      - name: tenant
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The tenant; the instance's first configured tenant when absent.
          title: Tenant
        description: The tenant; the instance's first configured tenant when absent.
      responses:
        '200':
          description: A list of runs as the run component records them.
          content:
            application/json:
              schema: {}
        '422':
          description: A parameter does not validate.
          content:
            application/problem+json: {}
  /runs/{run_id}:
    get:
      tags:
      - runs
      summary: One run
      operationId: get_run_runs__run_id__get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      - name: tenant
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The tenant; the instance's first configured tenant when absent.
          title: Tenant
        description: The tenant; the instance's first configured tenant when absent.
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema: {}
        '404':
          description: No such run in the tenant.
          content:
            application/problem+json: {}
        '422':
          description: A parameter does not validate.
          content:
            application/problem+json: {}
  /runs/{run_id}/ledger:
    get:
      tags:
      - runs
      summary: The ledger entries of one run, in sequence
      operationId: run_ledger_runs__run_id__ledger_get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      - name: tenant
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The tenant; the instance's first configured tenant when absent.
          title: Tenant
        description: The tenant; the instance's first configured tenant when absent.
      responses:
        '200':
          description: The entries, and whether the tenant's chain verifies.
          content:
            application/json:
              schema: {}
        '404':
          description: No such run in the tenant.
          content:
            application/problem+json: {}
        '422':
          description: A parameter does not validate.
          content:
            application/problem+json: {}
components:
  schemas:
    LinkCodeRequest:
      properties:
        channel:
          type: string
          pattern: ^[a-z][a-z0-9]*(\.[a-z][a-z0-9_-]*)+$
          title: Channel
          description: The channel whose account is to be linked, as a capability (`channel.repo`).
      type: object
      required:
      - channel
      title: LinkCodeRequest
