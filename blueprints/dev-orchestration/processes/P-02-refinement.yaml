# P-02 Refinement — an issue without acceptance criteria becomes one with them.
#
# The second process of the dev-orchestration blueprint (blueprint.yaml, README.md), as a
# bundle that runs. Every reference to the outside is a capability; the connector configured
# for `repository.*` (TAKTUS_CONNECTORS) and the model configured for the purpose `reasoning`
# (TAKTUS_MODEL_*) are what they resolve to. The issue to refine is the run's input:
#
#     uv run taktusctl run --process blueprints/dev-orchestration/processes/P-02-refinement.yaml \
#         --input issue=11
#
# What the steps do when they run is `work`, in the shape of examples/README.md. The one step
# that judges is `refine`, a language model; everything before it reads and checks, and the
# one step after it writes exactly what the check let through.

id: p02-refinement
version: "1"
name: P-02 Refinement
autonomy:
  level: 3
  reason: >
    the one outward effect is a comment on an issue that a person reads before anything builds
    on it, the model's answer leaves the step only through a check, and a second run on the same
    issue writes nothing; a person watches through the comments themselves
  toward_next: >
    a demonstrated quality history — criteria that a person did not have to rewrite, over a
    month of issues — and the check on the answer's structure strengthened beyond a pattern;
    then the raise is proposed with that evidence (anchors.taktus.md M3.9)
author: the repository
reason: the second process of the dev-orchestration blueprint, runnable

triggers:
  - event: issue.opened
    filter: missing acceptance criteria

inputs:
  issue:
    description: the number of the issue to refine
    example: 11

# Connector calls are counted in requests; a model's tokens are counted per step and are not
# a limit kind, so the quota is what admission control holds this run against.
limits:
  quota: { units: 60 }

steps:
  - id: read-issue
    method: rule
    reason: the issue is read verbatim from the system of record; nothing to judge
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    work:
      rule: connector
      operation: repository.issues.read
      input:
        number: { $input: issue }
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }

  - id: read-comments
    method: rule
    reason: the discussion so far is context for the criteria, read verbatim
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    depends_on: [read-issue]
    work:
      rule: connector
      operation: repository.comments.list
      input:
        number: { $input: issue }
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }

  - id: admit
    method: rule
    reason: >
      whether the issue is open, is not a pull request, and has no acceptance criteria yet is
      a machine check over the fields just read; a wrong verdict here would write criteria
      onto the wrong record
    rejected:
      - method: llm
        why: a fixed set of conditions needs no judgement, and a judgement could be wrong
    exactness: exact
    depends_on: [read-issue, read-comments]
    work:
      rule: check
      conditions:
        - value: { $from: read-issue, $select: output.state }
          equals: open
        - value: { $from: read-issue, $select: output.is_pull_request }
          equals: false
        # The section, not the phrase: an issue that mentions acceptance criteria in prose
        # still lacks them (the run of 2026-09-19
        # found exactly that, docs/runs/2026-09-19-the-run-that-stopped.md).
        - value: { $from: read-issue, $select: output.body }
          not_matches: "(?m)^## Acceptance criteria"
        - value: { $from: read-comments, $select: output.comments }
          not_matches: "## Acceptance criteria"

  - id: refine
    method: llm
    reason: >
      deriving acceptance criteria from an issue's text and its discussion is understanding
      language and judging what "done" means for it; no rule expresses that
    rejected:
      - method: rule
        why: the wording of issues is too varied for a rule set
      - method: ml
        why: no labelled corpus of criteria exists yet; a classifier cannot write them
    exactness: sourced
    fallback:
      when: the answer fails the check, or the model is unavailable
      to: human
    depends_on: [admit]
    work:
      purpose: reasoning
      system: >
        You write acceptance criteria for software issues. Answer with a Markdown section
        headed exactly "## Acceptance criteria", followed by a checklist of three to eight
        items, each "- [ ] " and one testable sentence. Cite the issue's own words where the
        criterion comes from them. Write nothing before the heading and nothing after the list.
      prompt: |
        Issue #${number}: ${title}

        ${body}

        Comments so far (JSON, may be empty):
        ${comments}
      values:
        number: { $from: read-issue, $select: output.number }
        title: { $from: read-issue, $select: output.title }
        body: { $from: read-issue, $select: output.body }
        comments: { $from: read-comments, $select: output.comments }
      max_output_tokens: 1024
      # The check that makes this step sourced rather than free: the answer is the section the
      # system message asked for, with at least one checklist item, or it does not leave.
      pattern: "^## Acceptance criteria\\s*\\n(.*\\n)*?- \\[ \\] .+"

  - id: compose-comment
    method: rule
    reason: the comment is the model's section plus a fixed footer that says who wrote it
    rejected:
      - method: llm
        why: a fixed composition needs no model
    exactness: sourced
    depends_on: [refine]
    work:
      rule: template
      text: |
        ${criteria}

        ---
        Written by Taktus, process P-02 Refinement, from the issue and its comments. Edit
        freely; P-03 Implementation reads this section when the issue is ready.
      values:
        criteria: { $from: refine, $select: text }

  - id: write-criteria
    method: rule
    reason: writing a comment is an API call with a fixed body; the effect leaves the system
    rejected:
      - method: worker
        why: nothing here needs a sandbox or tools
    exactness: sourced
    depends_on: [compose-comment]
    work:
      rule: connector
      operation: repository.comments.create
      input:
        number: { $input: issue }
        body: { $from: compose-comment }
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }
