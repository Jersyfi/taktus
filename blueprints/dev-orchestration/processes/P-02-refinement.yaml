# P-02 Refinement — an issue that lacks a section of the ready standard gains it as a comment.
#
# The second process of the dev-orchestration blueprint (blueprint.yaml, README.md), as a
# bundle that runs. Every reference to the outside is a capability; the connector configured
# for `repository.*` (TAKTUS_CONNECTORS) and the model configured for the purpose `reasoning`
# (TAKTUS_MODEL_*) are what they resolve to. The issue to refine is the run's input:
#
#     uv run taktusctl run --process blueprints/dev-orchestration/processes/P-02-refinement.yaml \
#         --input issue=11
#
# What the steps do when they run is `work`, in the shape of examples/README.md. The standard
# is the backlog's (docs/process/README.md, DEC-0051): a task is ready when it carries three
# sections — what must be achieved, how it is verified, where the boundary lies — and more. This
# process writes the sections an issue lacks, no others, as a comment a person reads; it does
# not edit the issue and does not add the label `ready`. A person, or P-01, does that once the
# sections are in the issue, until this process's autonomy is raised (anchors.taktus.md M3.9).
# The one step that judges is `refine`, a language model; everything before it reads and
# checks, and the one step after it writes exactly what the check let through.
#
# Every step an integration serves — a connector call, a wait on a connector, the worker, the
# model — names a person as its fallback for when that integration is unavailable (issue #90).
# The engine does not switch to the person: the step fails or is refused, and the run escalates
# or halts there. A person then does the step, or continues the process, by hand, following
# "By hand — the takeover test of these processes" in the blueprint's README.md. The removal
# test (S-01) reads the declaration and says *changed* for the integration, not *broke*.

id: p02-refinement
version: "4"
name: P-02 Refinement
autonomy:
  level: 3
  reason: >
    the one outward effect is a comment on an issue that a person reads before anything builds
    on it, the model's answer leaves the step only through a check, and a second run on the same
    issue writes nothing; a person watches through the comments themselves
  toward_next: >
    a demonstrated quality history — sections that a person did not have to rewrite, over a
    month of issues — and the check on the answer's structure strengthened beyond a pattern;
    then the raise is proposed with that evidence (anchors.taktus.md M3.9)
author: the repository
reason: the second process of the dev-orchestration blueprint, runnable

# Every opened issue starts a run (contracts/events/v1, ADR-0048). Whether a section is missing
# is not the trigger's to judge: a trigger reads the event alone, and the run's own steps find
# what the issue lacks: the step `missing` refuses an issue that lacks nothing, and nothing is
# written.
triggers:
  - event: issue.opened
    from_event: { issue: issue }

inputs:
  issue:
    description: the number of the issue to refine
    example: 11

# Connector calls are counted in requests; a model's tokens are counted per step and are not
# a limit kind, so the quota is what admission control holds this run against.
limits:
  quota: { units: 60 }

steps:
  - id: read-issue
    method: rule
    reason: the issue is read verbatim from the system of record; nothing to judge
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    fallback:
      when: the connector serving repository.issues is unavailable
      to: human
    work:
      rule: connector
      operation: repository.issues.read
      input:
        number: { $input: issue }
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }

  - id: read-comments
    method: rule
    reason: the discussion so far is context for the sections, read verbatim
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    fallback:
      when: the connector serving repository.comments is unavailable
      to: human
    depends_on: [read-issue]
    work:
      rule: connector
      operation: repository.comments.list
      input:
        number: { $input: issue }
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }

  - id: admit
    method: rule
    reason: >
      whether this process already wrote its comment on the issue is a machine check over the
      comments just read; a wrong verdict here would write the same sections twice
    rejected:
      - method: llm
        why: a fixed condition needs no judgement, and a judgement could be wrong
    exactness: exact
    checks:   # provisional: DEC-0173
      - { kind: recomputation, subject: the verdict whether the issue may be refined }
    depends_on: [read-issue, read-comments]
    work:
      rule: check
      conditions:
        - value: { $from: read-comments, $select: output.comments }
          not_matches: "Written by Taktus, process P-02 Refinement"

  - id: missing
    method: rule
    reason: >
      which sections of the ready standard the issue lacks is the standard's own reading of
      its body — the rule `ready`, the same code a session's `make backlog` runs, rather than
      a `check` with patterns that would state the standard a second time and could drift from
      it; an issue that is closed, a pull request, or carries every section is refused here,
      and nothing is written
    rejected:
      - method: llm
        why: whether a section is there is a fact of the text, not a judgement
    exactness: exact
    checks:   # provisional: DEC-0173
      - { kind: recomputation, subject: the list of sections the issue lacks }
    depends_on: [admit]
    work:
      rule: ready
      expect: sections_missing
      issue: { $from: read-issue, $select: output }

  - id: refine
    method: llm
    reason: >
      writing what must be achieved, how it is verified and where the boundary lies from an
      issue's text and its discussion is understanding language and judging what "done" means
      for it; no rule expresses that
    rejected:
      - method: rule
        why: the wording of issues is too varied for a rule set
      - method: ml
        why: no labelled corpus of such sections exists yet; a classifier cannot write them
    exactness: sourced
    fallback:
      when: the answer fails the check, or the model serving the purpose reasoning is unavailable
      to: human
    depends_on: [missing]
    work:
      purpose: reasoning
      system: >
        You write the missing sections of a task in a software backlog. You are given the
        names of the sections that are missing; write exactly those, each headed "### " and
        the name, in the order given, and no other section. "What must be achieved" states the
        outcome, not the route. "How it is verified" states the conditions that must hold, as a
        list of testable sentences, so that it cannot be met by interpretation. "Where the
        boundary lies" states what is not part of it. Cite the issue's own words where a
        sentence comes from them. Write nothing before the first heading.
      prompt: |
        Issue #${number}: ${title}

        ${body}

        Comments so far (JSON, may be empty):
        ${comments}

        The sections missing (JSON): ${missing}
      values:
        number: { $from: read-issue, $select: output.number }
        title: { $from: read-issue, $select: output.title }
        body: { $from: read-issue, $select: output.body }
        comments: { $from: read-comments, $select: output.comments }
        missing: { $from: missing, $select: missing }
      max_output_tokens: 1536
      # The check that makes this step sourced rather than free: the answer opens with one of
      # the three headings of the standard and carries text under it, or it does not leave.
      pattern: "^### (What must be achieved|How it is verified|Where the boundary lies)[ \\t]*\\n+\\s*\\S"

  - id: compose-comment
    method: rule
    reason: the comment is the model's sections plus a fixed footer that says who wrote them
    rejected:
      - method: llm
        why: a fixed composition needs no model
    exactness: sourced
    depends_on: [refine]
    work:
      rule: template
      text: |
        ${sections}

        ---
        Written by Taktus, process P-02 Refinement, from the issue and its comments: the
        sections of the ready standard the issue lacks (docs/process/README.md). Edit freely.
        Once they are in the issue, a person adds the label `ready`; P-03 Implementation reads
        the issue, not this comment.
      values:
        sections: { $from: refine, $select: text }

  - id: write-sections
    method: rule
    reason: writing a comment is an API call with a fixed body; the effect leaves the system
    rejected:
      - method: worker
        why: nothing here needs a sandbox or tools
    exactness: sourced
    fallback:
      when: the connector serving repository.comments is unavailable
      to: human
    depends_on: [compose-comment]
    work:
      rule: connector
      operation: repository.comments.create
      input:
        number: { $input: issue }
        body: { $from: compose-comment }
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }
