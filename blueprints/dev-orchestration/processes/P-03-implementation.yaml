# P-03 Implementation — an issue that is ready becomes a pull request.
#
# The third process of the dev-orchestration blueprint (blueprint.yaml, README.md), as a
# bundle that runs. A coding worker implements the issue in a clone of the repository; the run
# — not the worker — puts the change on a branch through the repository connector, waits for
# the pipeline, takes the pipeline's verdict, and opens the pull request. Nothing here writes
# to the base branch: the pull request is opened, the pipeline decides, a person merges.
#
#     uv run taktusctl run --process blueprints/dev-orchestration/processes/P-03-implementation.yaml \
#         --input issue=11 --input records_path=docs/decisions/open \
#         --input repository_url=https://host/owner/name.git \
#         --input repository_host=host --input coding_credential=CODING_AGENT_API_KEY \
#         [--input "closing_section=$(<the repository's generator>)"]
#
# Ready means the backlog's ready standard (docs/process/README.md, DEC-0051), evaluated by the
# rule `ready` — the same code a session's `make backlog` runs — over the issue, the repository's
# open issues and the open records under `records_path` on the base branch. P-03 takes only an
# issue handed to Taktus: labelled `to-taktus` by the owner or by P-01 (the label `taktus` marks
# the pull requests P-03 opens and hands nothing over), and naming no ADR under
# "Blocked by" (DEC-0197, docs/process/README.md, *Handed to Taktus*). An issue that meets all
# of it is claimed with the label `in-progress` before anything is implemented, so that a
# session or another run skips it, and the run says so in a comment that names it.
#
# A run that escalates after its claim gives the claim back (ADR-0097): three steps that run
# only then take the label `in-progress` off the issue and say in a comment which step failed
# and why. The label `to-taktus` stays: a person removes it to give the task to a session, or
# removes and adds it to hand it to Taktus again. A run that escalates before the claim, or at
# the last step, when the pull request is open, gives nothing back.
#
# Before the coding step spends anything, the run reads the branch it will create. A branch of
# that name it did not make stops the run there, naming the branch: a person looks at it,
# deletes or renames it, and hands the task over again (ADR-0099, DEC-0202).
#
# Inputs: `issue`, the issue's number; `records_path`, the directory of the base branch that
# holds the open decision and needs records; `repository_url`, where the worker clones from;
# `repository_host`, the one host the step lets the worker reach (the clone's; the hosts its own
# service needs are configured for the worker, ADR-0089); `coding_credential`, the
# name of the credential the coding worker's authentication needs (its README);
# `closing_section`, optional, the section the repository generates for the end of every pull
# request description, verbatim with its heading. Without it the worker generates the section:
# after its change it runs the repository's generator in its workspace — the tree the branch
# will carry, which is what the checks compare against — and the run appends what it printed
# under the section's heading (DEC-0037, ADR-0053). The connector configured for
# `repository.*` and the worker configured for `code.*` are what the capabilities resolve to;
# no product is named here.
#
# A record of this repository's register that the change adds — a decision, a notice, a needs
# request — carries a number that must be reserved on the repository before the branch is
# written (DEC-0189 rule 6), and the pipeline fails one that is not. The worker cannot reserve:
# its workspace has no right to push. So the run reserves, as `make reserve` would, through the
# connector: it derives the references from the paths the changeset adds, less the records
# `main` already holds, and creates them before it writes the branch. A number somebody else
# holds stops the run there, with the reference named (ADR-0095, issues #382 and #281).
#
# Every step an integration serves — a connector call, a wait on a connector, the worker, the
# model — names a person as its fallback for when that integration is unavailable (issue #90).
# The engine does not switch to the person: the step fails or is refused, and the run escalates
# or halts there. A person then does the step, or continues the process, by hand, following
# "By hand — the takeover test of these processes" in the blueprint's README.md. The removal
# test (S-01) reads the declaration and says *changed* for the integration, not *broke*.

id: p03-implementation
version: "11"
name: P-03 Implementation
autonomy:
  level: 4
  reason: >
    nothing writes to a protected branch, the pipeline's verdict is the gate and never the
    worker's opinion, a person merges, and every outward effect is reversible until the merge.
    The fourth condition is the deployment's, not the bundle's: the worker runs in isolation
    with exactly the hosts and credentials the frame names, and the hosts its own service needs
    as the operator configures them for the worker (ADR-0089), where the execution kind
    provides it — `container` and `cluster` do, `process` and `endpoint` do not, and with those
    two the isolation is whoever started the worker's (DEC-0022)
author: the repository
reason: the third process of the dev-orchestration blueprint, runnable

# The blueprint's `issue.handed`: the event `issue.labelled` with the filter `label: to-taktus` and
# the condition `capacity.available` (contracts/events/v1 §2). The label `ready` starts nothing:
# on 2026-10-13 a trigger on it took ten of twenty-two issues a session had just written, and
# opened a duplicate pull request (DEC-0197). A run started by an event has
# nobody to ask, so the trigger gives every input the process requires: this repository's
# records, its clone and the host of the clone, and the name of the coding worker's credential;
# the issue comes from the event. It gives no `closing_section`: the worker generates the
# section inside the run (DEC-0037, ADR-0053, NTC-0112). P-03 still starts by hand as above.
triggers:
  - event: issue.labelled
    filter: { label: to-taktus }
    condition: capacity.available
    inputs:
      records_path: docs/decisions/open
      repository_url: https://github.com/Jersyfi/taktus.git
      repository_host: github.com
      coding_credential: CODING_AGENT_API_KEY
    from_event: { issue: issue }

inputs:
  issue:
    description: the number of the issue to implement
    example: 11
  records_path:
    description: >
      the directory of the base branch that holds the open decision and needs records, one
      file each, named by its identifier (NEED-NNNN-…, DEC-NNNN-…); a record named under
      "Blocked by" is open while its file is there
    example: docs/decisions/open
  repository_url:
    description: where the coding worker clones the repository from
    example: https://repo.example/owner/name.git
  repository_host:
    description: the one host the worker may reach — the clone's
    example: repo.example
  coding_credential:
    description: the name of the credential the coding worker's authentication needs
    example: CODING_AGENT_API_KEY
  # A copy of what the repository generates is a rule, never a model's output (issue #34).
  # The run itself cannot generate it: the block is derived from files of the repository by the
  # repository's own code, and a template composes, it does not compute. So the worker runs
  # that code after its change, as a command of its task (`after`), and the run appends what it
  # printed. Whoever starts the run by hand may still hand the section in, generated from the
  # base branch, the way a person pastes the output of the repository's command into a
  # description they open by hand; given, it is what the description ends with.
  closing_section:
    description: >
      the section the repository generates for the end of every pull request description,
      verbatim with its heading, from the base branch; empty when the repository generates none.
      Left out, the worker's generated section stands in for it
    example: "## Generated\n\nNothing is open."
    required: false

# The money is what the coding step may spend; no other step spends any. The worker prices its
# tokens at every boundary and halts there before the run's money is crossed, keeping its
# checkpoint; the run halts with cause `limit`, nothing restarts it, and a person resumes it
# with a raised limit from that checkpoint, or gives the task back (DEC-0202, ADR-0005 seventh
# amendment). The limit stays USD 5, the owner's figure (DEC-0203): finished coding steps on the
# instance cost USD 0.69 to 1.78, so none would have been halted, and a step that runs away stops
# at half of the USD 10 the run for #277 spent. Version 9 held USD 5 only against the worker's
# estimate, because the money came at the end. Connector calls count in requests.
limits:
  currency: { usd: 5.0 }
  quota: { units: 200 }

steps:
  - id: read-issue
    method: rule
    reason: the issue is read verbatim from the system of record
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    fallback:
      when: the connector serving repository.issues is unavailable
      to: human
    work:
      rule: connector
      operation: repository.issues.read
      input:
        number: { $input: issue }
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }

  - id: read-comments
    method: rule
    reason: the discussion is context for the worker
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    fallback:
      when: the connector serving repository.comments is unavailable
      to: human
    depends_on: [read-issue]
    work:
      rule: connector
      operation: repository.comments.list
      input:
        number: { $input: issue }
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }

  - id: context
    method: rule
    reason: the issue and its comments as one text, for the check and for the worker
    rejected:
      - method: llm
        why: a fixed composition needs no model
    exactness: sourced
    depends_on: [read-issue, read-comments]
    work:
      rule: template
      text: |
        # ${title}

        ${body}

        ## Discussion (JSON)

        ${comments}
      values:
        title: { $from: read-issue, $select: output.title }
        body: { $from: read-issue, $select: output.body }
        comments: { $from: read-comments, $select: output.comments }

  - id: read-open-issues
    method: rule
    reason: >
      an issue named under "Blocked by" blocks while it is open; which are open is read from
      the system of record, every page, and a reading that stopped short fails
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    fallback:
      when: the connector serving repository.issues is unavailable
      to: human
    depends_on: [read-issue]
    work:
      rule: connector
      operation: repository.issues.list
      input:
        state: open
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }
      expect:
        - { select: complete, equals: true }

  - id: read-open-records
    method: rule
    reason: >
      a decision or needs record named under "Blocked by" blocks while its file is in the
      directory of open records on the base branch — where a session's `make backlog` looks
      too; the directory is read, not a copy of it
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    fallback:
      when: the connector serving repository.files is unavailable
      to: human
    depends_on: [read-issue]
    work:
      rule: connector
      operation: repository.files.list
      input:
        path: { $input: records_path }
        ref: main
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }

  - id: admit
    method: rule
    reason: >
      ready means the backlog's ready standard — the three sections, a component, a milestone,
      one priority label, the label `ready`, nothing open under "Blocked by" — and open, not a
      pull request, not labelled as no work, not claimed, and handed to Taktus: the label
      `to-taktus`, and no ADR named under "Blocked by" (DEC-0197). The rule `ready`, the same code
      a session's `make backlog` runs, over the fields just read; a refusal names every reason.
      The run's budget is checked by admission control before every step, not here
    rejected:
      - method: llm
        why: a fixed set of conditions needs no judgement, and a judgement could be wrong
    exactness: exact
    checks:   # provisional: DEC-0173
      - { kind: recomputation, subject: the verdict whether the issue is ready }
    depends_on: [read-issue, read-open-issues, read-open-records]
    work:
      rule: ready
      expect: ready
      handed: true
      issue: { $from: read-issue, $select: output }
      open_issues: { $from: read-open-issues, $select: output.issues }
      open_records: { $from: read-open-records, $select: output.entries }

  - id: claim
    method: rule
    reason: >
      the issue is claimed with the label `in-progress` before anything is implemented, so
      that a session or another run reading the backlog skips it; a repeat finds the label
      and adds nothing
    rejected:
      - method: worker
        why: nothing here needs a sandbox or tools
    exactness: sourced
    fallback:
      when: the connector serving repository.labels is unavailable
      to: human
    depends_on: [admit]
    work:
      rule: connector
      operation: repository.labels.set
      input:
        number: { $input: issue }
        labels: [in-progress]
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }

  # Whoever reads the issue sees that Taktus took it, and which run to look for (DEC-0197). The
  # run is named by its identifier: the address of the instance it runs on is the operator's,
  # and no bundle names it.
  - id: claim-notice
    method: rule
    reason: the comment that says the issue was taken, naming the run, as a fixed composition
    rejected:
      - method: llm
        why: a fixed composition needs no model
    exactness: sourced
    depends_on: [claim]
    work:
      rule: template
      text: |
        Taktus took this issue: run `${run}` of `${version}` claimed it with the label `in-progress`.

        *Written by Taktus, process P-03 Implementation. The run ends in a pull request that
        closes this issue, or it gives the issue back here and says why. Merging stays with a
        person.*
      values:
        run: { $run: id }
        version: { $run: process_version }

  - id: announce-claim
    method: rule
    reason: >
      the claim is said where people read the issue, beside the label; a repeat finds the
      comment by its mark and writes nothing twice
    rejected:
      - method: worker
        why: nothing here needs a sandbox or tools
    exactness: sourced
    fallback:
      when: the connector serving repository.comments is unavailable
      to: human
    depends_on: [claim, claim-notice]
    work:
      rule: connector
      operation: repository.comments.create
      input:
        number: { $input: issue }
        body: { $from: claim-notice }
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }

  - id: branch-name
    method: rule
    reason: the branch is named by the issue, deterministically
    rejected: []
    exactness: exact
    checks:   # provisional: DEC-0173
      - { kind: recomputation, subject: the branch name }
    depends_on: [admit]
    work:
      rule: template
      text: taktus/issue-${issue}
      values:
        issue: { $input: issue }

  # A branch of that name that this run did not make — one an earlier attempt left, its pipeline
  # red, or one a person pushed — would end the run in `conflict` at `create-branch`, after the
  # coding step has spent the run's money (2026-10-15, #256). So the run reads the branch before
  # it spends, and stops there while it is not free (DEC-0202). Free means no branch of that name,
  # or one whose head carries the key `create-branch` will write under: the run's own, which
  # `create-branch` replays. The read comes after the claim, so that the escalation gives the
  # claim back and the reason reaches the issue in its comment (ADR-0097, ADR-0099).
  - id: read-branch
    method: rule
    reason: >
      the branch the run will create is read before the coding step spends anything; one this
      run did not make stops the run here, naming the branch and what a person does, and a
      resume reads it again
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    fallback:
      when: the connector serving repository.branches is unavailable
      to: human
    depends_on: [claim, branch-name]
    work:
      rule: connector
      operation: repository.branches.read
      input:
        name: { $from: branch-name }
        key: { $run: keys.create-branch }
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }
      expect:
        - select: free
          equals: true
          says: >-
            the branch ${name} exists and this run did not make it (head ${sha}, key ${key}).
            Nothing was spent on the coding step. A person looks at the branch, deletes or
            renames it, and hands the task over again

  - id: implement
    method: worker
    reason: >
      changing code so that what the issue says is verified holds is multi-step work with
      tools in an isolated workspace, which is what a worker offers; the worker proposes, the pipeline decides
    rejected:
      - method: llm
        why: a single completion cannot read a repository, run its tests and revise
      - method: rule
        why: the core executes no code itself; that is the adapter obligation
    exactness: tolerant
    fallback:
      when: >
        the coding worker — the worker serving code.read, code.edit, code.test and
        shell.sandboxed — is unavailable, or the assignment fails, is stopped twice, or the
        pipeline is red
      to: human
    requires: [code.read, code.edit, code.test, shell.sandboxed]
    depends_on: [claim, context, read-branch]
    work:
      task:
        goal: >
          implement the issue given in the inputs — its title, text and discussion — so that
          what its section "What must be achieved" states is achieved, within its section
          "Where the boundary lies"
        acceptance:
          - every condition of the issue's section "How it is verified" holds
          # DEC-0021, answered: a pull request Taktus opens carries what every change of that
          # repository must carry, like any other; which changes need a status update is the
          # repository's own rule, and this criterion names no rule.
          - >
            the repository's own rules for a change are met: whatever its contribution
            documentation requires of every change, which the repository states and the
            workspace carries
          - >
            the repository's own checks are run in the workspace and pass. Where one cannot be
            run there — it needs the network, or a tool the workspace does not have — the
            summary names it and says why; no check is passed over in silence
          - no secret value is written into any file
          # The run writes the branch as Taktus's own app, which may not change the pipeline's
          # workflows (CREDENTIALS.md); the service refuses the whole change otherwise (#366).
          - >
            no file under .github/workflows/ is changed: the run that carries the change may not
            write the repository's pipeline. Where the issue needs a change there, the summary
            names it, file and exact change, for a person to make
          # The repository's own rule for a record's number is `make reserve`, which pushes a
          # reference; the workspace cannot push, so the run reserves what the change adds
          # (ADR-0095). The index of the register is generated, never written (issue #281).
          - >
            a record the change adds to the register under docs/decisions/ — a decision, a
            notice, a needs request — takes the next number free of its kind: one above the
            highest that a record on the base or a reservation holds, and the reservations are
            the references the clone's remote lists under refs/register/
            (`git ls-remote origin 'refs/register/*'`). The workspace does not reserve it; the
            run does, before it writes the branch. No row of the register's index is written or
            replaced: the index is generated
          - >
            the change is small and touches what the issue names, and what the rules above
            require of any change
          # The description of a pull request Taktus opens is the summary this assignment ends
          # with, so the shape the repository asks of a description is asked of the summary.
          # The section the repository generates is not asked of it: the run appends that
          # section itself, by a template, after the summary (issue #34), from what the command
          # below printed (DEC-0037).
          - >
            the summary this assignment ends with is the body of the pull request that will
            carry the change: what it delivers, and what a reviewer must know. Where the
            repository prescribes a shape for a pull request description — a template, or a
            section one of its checks reads — the summary is written in that shape, with the
            same headings at the same level and every required section present and truthful.
            One section is left out: the one whose content the repository generates, which the
            repository puts last. The run appends it after the summary, from the repository's
            own generator, so the summary neither writes nor copies it
        inputs:
          issue: { $input: issue }
          title: { $from: read-issue, $select: output.title }
          context: { $from: context }
        # The repository's generator of the closing section, run by the worker — not by the
        # agent, and with no model — once the work is done, in the workspace: the tree the
        # branch will carry. What it prints is the artifact `closing`, byte for byte (W-18).
        after:
          command: [python3, tools/check_status.py, --print]
          artifact: closing
      max_steps: 40
      workspace:
        kind: git
        location: { $input: repository_url }
      allowed_hosts:
        - { $input: repository_host }
      credentials:
        - { name: { $input: coding_credential }, injected_as: env }

  # The records `main` holds, read after the worker's change: a record the change edits or moves
  # keeps the number it has there, and needs no reservation.
  - id: read-register
    method: rule
    reason: the records the base holds, read from the system of record when the change is made
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    fallback:
      when: the connector serving repository.files is unavailable
      to: human
    depends_on: [implement]
    work:
      rule: connector
      operation: repository.files.list
      input:
        path: docs/decisions
        ref: main
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }

  - id: read-register-open
    method: rule
    reason: the open records the base holds, read from the system of record when the change is made
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    fallback:
      when: the connector serving repository.files is unavailable
      to: human
    depends_on: [implement]
    work:
      rule: connector
      operation: repository.files.list
      input:
        path: { $input: records_path }
        ref: main
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }

  - id: record-references
    method: rule
    reason: >
      the references that reserve the numbers of the records the change adds: every record the
      changeset writes under the register, by its identifier, less the identifiers the base
      holds — the comparison the pipeline's register check makes (DEC-0189 rule 6)
    rejected:
      - method: worker
        why: >
          the worker cannot see who holds a number when the branch is written, and a list it
          wrote would be its opinion; the changeset and the base are read
      - method: llm
        why: a fixed pattern over paths needs no model
    exactness: exact
    checks:   # provisional: DEC-0173
      - { kind: recomputation, subject: the references to reserve }
    depends_on: [implement, read-register, read-register-open]
    work:
      rule: extract
      values: { $from: implement, $artifact: changeset, $select: files }
      excluding:
        - { $from: read-register, $select: output.entries }
        - { $from: read-register-open, $select: output.entries }
      pattern: '^docs/decisions/(?:open/)?(?P<identifier>(?:DEC|NTC|NEED)-[0-9]{4})-[a-z0-9-]+\.md$'
      text: refs/register/${identifier}

  - id: reserve-records
    method: rule
    reason: >
      each number the change adds is reserved on the repository before the branch is written,
      as `make reserve` reserves it — a reference created once, atomically, by whoever comes
      first. A number somebody else holds is a conflict that names the reference, and the run
      stops before anything is written; a change without a new record skips the step
    rejected:
      - method: worker
        why: a worker that pushes has a credential to the repository and writes outward past the ledger
    exactness: sourced
    fallback:
      when: the connector serving repository.refs is unavailable
      to: human
    depends_on: [record-references]
    work:
      when:
        - value: { $from: record-references, $select: extracted }
          not_matches: '^\[\]$'
      rule: connector
      operation: repository.refs.create
      input:
        names: { $from: record-references, $select: extracted }
        target: main
        message: reserved by P-03 for a record its change adds
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }

  - id: create-branch
    method: rule
    reason: >
      the worker's change goes onto a branch through the connector — the run writes outward,
      never the worker — as one commit that carries the idempotency key; the effect leaves
      the system
    rejected:
      - method: worker
        why: a worker that pushes has a credential to the repository and writes outward past the ledger
    exactness: sourced
    fallback:
      when: the connector serving repository.branches is unavailable
      to: human
    depends_on: [implement, branch-name, reserve-records]
    work:
      rule: connector
      operation: repository.branches.create
      input:
        name: { $from: branch-name }
        base: main
        message: { $from: read-issue, $select: output.title }
        files: { $from: implement, $artifact: changeset, $select: files }
        deleted: { $from: implement, $artifact: changeset, $select: deleted }
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }

  - id: wait-for-pipeline
    method: wait
    reason: the pipeline runs on its own time; the run waits for its verdict, polling the state
    rejected: []
    fallback:
      when: the connector serving repository.pipelines is unavailable
      to: human
    depends_on: [create-branch]
    work:
      until:
        operation: repository.pipelines.status
        input:
          ref: { $from: branch-name }
        credentials:
          - { name: REPOSITORY_TOKEN, injected_as: env }
        select: state
        expect: [success, failure]
        poll_seconds: 30
        timeout_seconds: 2400

  - id: read-pipeline
    method: rule
    reason: >
      the pipeline's verdict, read once more so that the check below has a result to hold; the
      reading expects success and fails its own step otherwise, so that a resume after the
      pipeline was re-run reads it again instead of judging the old reading (issue #31)
    rejected: []
    exactness: sourced
    fallback:
      when: the connector serving repository.pipelines is unavailable
      to: human
    depends_on: [wait-for-pipeline]
    work:
      rule: connector
      operation: repository.pipelines.status
      input:
        ref: { $from: branch-name }
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }
      expect:
        - { select: state, equals: success }

  - id: verify
    method: rule
    reason: >
      whether the change is acceptable is the pipeline's verdict, never the worker's opinion of
      its own work: a check over the state the pipeline reported
    rejected:
      - method: worker
        why: a variable method never produces an exact result (ADR-0014)
      - method: llm
        why: a judgement of test output is not a verdict; the pipeline's conclusion is
    exactness: exact
    checks:   # provisional: DEC-0173
      - { kind: recomputation, subject: the pipeline's verdict as the run takes it }
    depends_on: [read-pipeline]
    work:
      rule: check
      conditions:
        - value: { $from: read-pipeline, $select: output.state }
          equals: success

  - id: pull-request-title
    method: rule
    reason: the title names the issue, deterministically
    rejected: []
    exactness: exact
    checks:   # provisional: DEC-0173
      - { kind: recomputation, subject: the title of the pull request }
    depends_on: [verify]
    work:
      rule: template
      text: "${title} (#${issue})"
      values:
        title: { $from: read-issue, $select: output.title }
        issue: { $input: issue }

  - id: closing-section
    method: rule
    reason: >
      the section the repository generates, as the worker's command printed it on the change's
      tree, under the heading the repository's description check reads
    rejected:
      - method: llm
        why: a fixed composition needs no model, and a copy by a model is not exact (issue #34)
    exactness: sourced
    depends_on: [verify]
    work:
      rule: template
      text: |
        ## Needed from the owner

        ${block}
      values:
        block: { $from: implement, $artifact: closing }

  - id: pull-request-body
    method: rule
    reason: >
      the body links the issue, carries the worker's own summary of what it did, and ends with
      the section the repository generates: the run's input where whoever started it gave one,
      and otherwise what the worker's command printed on the change's tree
    rejected:
      - method: llm
        why: a fixed composition needs no model; the summary is the worker's
      - method: worker
        why: >
          a copy of a generated block is a rule; in the first live run, four of the five
          refused descriptions failed on deterministic parts asked of the coding worker
          (DEC-0025)
    exactness: sourced
    depends_on: [verify, closing-section]
    work:
      rule: template
      # What Taktus says about itself comes first, not last: a repository whose checks read the
      # description read its *last* section, and that section is the one the repository
      # generates, appended here after the summary (DEC-0025, issue #34).
      text: |
        Closes #${issue}.

        *Opened by Taktus, process P-03 Implementation: the change was made by a coding worker
        in an isolated workspace, put on this branch by the run, and the pipeline's verdict was
        read before this pull request was opened. A person merges. A run raises no decision
        request — a process has no way to — so the section below is `None`, and a question this
        change turns out to raise is raised by the person who reviews it.*

        ## Decisions required

        None

        ## What this delivers

        ${summary}

        ${closing}
      values:
        issue: { $input: issue }
        summary: { $from: implement, $artifact: summary }
        closing: { $input: closing_section, $otherwise: { $from: closing-section } }

  - id: open-pr
    method: rule
    reason: opening a pull request is an API call; a repeat after a restart finds the one opened
    rejected: []
    exactness: sourced
    fallback:
      when: the connector serving repository.pullrequests is unavailable
      to: human
    depends_on: [pull-request-title, pull-request-body]
    work:
      rule: connector
      operation: repository.pullrequests.open
      input:
        head: { $from: branch-name }
        base: main
        title: { $from: pull-request-title }
        body: { $from: pull-request-body }
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }

  - id: label
    method: rule
    reason: the pull request is marked as Taktus's, so that a reader sees who opened it
    rejected: []
    exactness: sourced
    fallback:
      when: the connector serving repository.labels is unavailable
      to: human
    depends_on: [open-pr]
    work:
      rule: connector
      operation: repository.labels.set
      input:
        number: { $from: open-pr, $select: output.number }
        labels: [taktus]
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }

  # --- on escalation: the claim is given back (ADR-0097, DEC-0197) ------------------------------
  #
  # These steps are no part of the sequence. They run only when a step fails and the run
  # escalates, and only once the claim succeeded: a run refused at admission took nothing. A
  # run that escalates at `label`, the last step, leaves the claim: its pull request is open
  # and closes the issue. A run that finishes skips them.

  - id: give-back
    method: rule
    reason: >
      a run that failed works on the issue no more, so its claim comes off and a session or a
      later run may take the issue; a repeat finds the label gone and removes nothing
    rejected:
      - method: worker
        why: nothing here needs a sandbox or tools
    exactness: sourced
    fallback:
      when: the connector serving repository.labels is unavailable
      to: human
    depends_on: [claim]
    work:
      on_escalation: true
      when:
        - value: { $run: failed.step }
          not_matches: '^label$'
      rule: connector
      operation: repository.labels.remove
      input:
        number: { $input: issue }
        labels: [in-progress]
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }

  - id: give-back-notice
    method: rule
    reason: the comment that says why the issue was given back, as a fixed composition
    rejected:
      - method: llm
        why: a fixed composition needs no model, and the reason is the failed step's own
    exactness: sourced
    depends_on: [claim]
    work:
      on_escalation: true
      when:
        - value: { $run: failed.step }
          not_matches: '^label$'
      rule: template
      text: |
        Taktus gives this issue back: run `${run}` of `${version}` stopped at the step `${step}`.

        > ${reason}

        The label `in-progress` is removed. The label `to-taktus` stays: remove it to leave the
        task to a session, or remove it and add it again to hand it to Taktus once more.

        *Written by Taktus, process P-03 Implementation.*
      values:
        run: { $run: id }
        version: { $run: process_version }
        step: { $run: failed.step }
        reason: { $run: failed.reason }

  - id: announce-give-back
    method: rule
    reason: >
      the reason is said where people read the issue; a repeat finds the comment by its mark and
      writes nothing twice
    rejected:
      - method: worker
        why: nothing here needs a sandbox or tools
    exactness: sourced
    fallback:
      when: the connector serving repository.comments is unavailable
      to: human
    depends_on: [claim, give-back-notice]
    work:
      on_escalation: true
      rule: connector
      operation: repository.comments.create
      input:
        number: { $input: issue }
        body: { $from: give-back-notice }
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }
