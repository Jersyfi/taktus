      expertise: the repository's register of records and how their numbers are reserved
      credentials: []
      done: the list of new record identifiers is written, possibly empty
    reserve-records:
      system: the clone of the repository
      do: >
        for each identifier on the list, reserve its number with make reserve ID= followed by
