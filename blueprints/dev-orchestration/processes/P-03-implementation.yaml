            to comment
      done: the issue carries the comment once
    branch-name:
      system: a text file
      do: name the branch taktus/issue-N, where N is the issue's number
      expertise: none
      credentials: []
      done: the branch name is written down
    read-branch:
      system: the repository's hosting service
      do: >
        look for a branch of that name. If none exists, it is free. If one exists and is not
        the one being continued (its head commit's trailer Taktus-Idempotency-Key names
        another run, or it has none), stop before any work: look at the branch, delete or
        rename it, give the claim back as the last three steps say, and hand the task over
        again
      expertise: finding a branch and reading a commit's message in the hosting service
      credentials:
        - parameter: REPOSITORY_TOKEN
          where: >
            the operator's secret store, under the parameter REPOSITORY_TOKEN described in
            CREDENTIALS.md; or the person's own account on the hosting service with read access
      done: the branch is known to be free, or the process stops with the branch named
    wait-for-main:
      system: the repository's hosting service, its pipeline view
      do: >
        look at the newest run of the workflow ci on main's head commit; while it is still
