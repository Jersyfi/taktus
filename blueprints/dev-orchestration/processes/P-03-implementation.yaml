      done: main's verdict is success or there is none, or the process stops naming the failed run
    implement:
      system: a clone of the repository with its toolchain installed (make install)
      do: >
        on a branch from main, make the change the issue asks for, so that every condition
        under How it is verified holds, within Where the boundary lies, and following the
        repository's own rules for a change. Run its checks: make check, and the tests of each
        test file the change adds or changes. Write no secret value into any file. Change no
        file of the repository's pipeline workflows. Give a record added under docs/decisions/
        the next free number of its kind. Then write the pull request description in the
        shape of the repository's pull request template, its headings copied exactly, without
