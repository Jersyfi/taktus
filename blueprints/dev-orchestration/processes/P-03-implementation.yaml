        - parameter: CODING_AGENT_API_KEY
          where: >
            the operator's secret store, under the parameter CODING_AGENT_API_KEY described in
            CREDENTIALS.md (the name the run was started with); needed only when the person
            has a coding agent make the change. A change made by hand needs none, only a clone
      done: >
        the change is in the clone, its checks pass, the description is written and the
        generated section is kept
    read-register:
      system: the repository's hosting service, or a clone of the repository at main
      do: list the records under docs/decisions on main
      expertise: browsing a directory of a branch in the repository's hosting service
      credentials:
        - parameter: REPOSITORY_TOKEN
          where: >
            the operator's secret store, under the parameter REPOSITORY_TOKEN described in
            CREDENTIALS.md; or the person's own account on the hosting service with read access
      done: the names of the records on main are listed
    read-register-open:
      system: the repository's hosting service, or a clone of the repository at main
      do: list the records in the directory of open records on main
      expertise: browsing a directory of a branch in the repository's hosting service
      credentials:
        - parameter: REPOSITORY_TOKEN
          where: >
            the operator's secret store, under the parameter REPOSITORY_TOKEN described in
