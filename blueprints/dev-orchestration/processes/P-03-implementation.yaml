      expertise: the repository's ready standard and its section on tasks handed to Taktus
      credentials: []
      done: every condition holds, or the process stops with every failed condition noted
    claim:
      system: the repository's hosting service
      do: add the label in-progress to the issue; if it is already there, add nothing
      expertise: setting a label on an issue
      credentials:
        - parameter: REPOSITORY_TOKEN
          where: >
