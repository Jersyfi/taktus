# P-03 Implementation — an issue that is ready becomes a pull request.
#
# The third process of the dev-orchestration blueprint (blueprint.yaml, README.md), as a
# bundle that runs. A coding worker implements the issue in a clone of the repository; the run
# — not the worker — puts the change on a branch through the repository connector, waits for
# the pipeline, takes the pipeline's verdict, and opens the pull request. Nothing here writes
# to the base branch: the pull request is opened, the pipeline decides, a person merges.
#
#     uv run taktusctl run --process blueprints/dev-orchestration/processes/P-03-implementation.yaml \
#         --input issue=11 --input records_path=docs/decisions/open \
#         --input repository_url=https://host/owner/name.git \
#         --input repository_host=host --input coding_credential=CODING_AGENT_API_KEY \
#         --input "closing_section=$(<the repository's generator>)"
#
# Ready means the backlog's ready standard (docs/process/README.md, DEC-0051), evaluated by the
# rule `ready` — the same code a session's `make backlog` runs — over the issue, the repository's
# open issues and the open records under `records_path` on the base branch. An issue that meets
# it is claimed with the label `in-progress` before anything is implemented, so that a session
# or another run skips it.
#
# Inputs: `issue`, the issue's number; `records_path`, the directory of the base branch that
# holds the open decision and needs records; `repository_url`, where the worker clones from;
# `repository_host`, the one host the worker may reach (the clone's); `coding_credential`, the
# name of the credential the coding worker's authentication needs (its README);
# `closing_section`, the section the repository generates for the end of every pull request
# description, verbatim with its heading, or empty when it generates none. The connector
# configured for `repository.*` and the worker configured for `code.*` are what the
# capabilities resolve to; no product is named here.
#
# Every step an integration serves — a connector call, a wait on a connector, the worker, the
# model — names a person as its fallback for when that integration is unavailable (issue #90).
# The engine does not switch to the person: the step fails or is refused, and the run escalates
# or halts there. A person then does the step, or continues the process, by hand, following
# "By hand — the takeover test of these processes" in the blueprint's README.md. The removal
# test (S-01) reads the declaration and says *changed* for the integration, not *broke*.

id: p03-implementation
version: "4"
name: P-03 Implementation
autonomy:
  level: 4
  reason: >
    nothing writes to a protected branch, the pipeline's verdict is the gate and never the
    worker's opinion, a person merges, and every outward effect is reversible until the merge.
    The fourth condition is the deployment's, not the bundle's: the worker runs in isolation
    with exactly the hosts and credentials the frame names where the execution kind provides
    it — `container` and `cluster` do, `process` and `endpoint` do not, and with those two the
    isolation is whoever started the worker's (DEC-0022)
author: the repository
reason: the third process of the dev-orchestration blueprint, runnable

# No trigger yet. The blueprint's `issue.ready` is the event `issue.labelled` with the filter
# `label: ready` and the condition `capacity.available` (contracts/events/v1 §2). A run started
# by an event has nobody to ask, so its trigger must give every input, and `closing_section`
# cannot be given by a trigger: it is generated from the base branch. Once the worker
# generates it inside the run (DEC-0037, issue #77), the input goes and the trigger returns:
#
#   - event: issue.labelled
#     filter: { label: ready }
#     condition: capacity.available
#     inputs: { records_path: docs/decisions/open, ... }
#     from_event: { issue: issue }
#
# Until then P-03 starts by hand, as above (ADR-0048, NTC-0103).
triggers: []

inputs:
  issue:
    description: the number of the issue to implement
    example: 11
  records_path:
    description: >
      the directory of the base branch that holds the open decision and needs records, one
      file each, named by its identifier (NEED-NNNN-…, DEC-NNNN-…); a record named under
      "Blocked by" is open while its file is there
    example: docs/decisions/open
  repository_url:
    description: where the coding worker clones the repository from
    example: https://repo.example/owner/name.git
  repository_host:
    description: the one host the worker may reach — the clone's
    example: repo.example
  coding_credential:
    description: the name of the credential the coding worker's authentication needs
    example: CODING_AGENT_API_KEY
  # A copy of what the repository generates is a rule, never a model's output (issue #34).
  # The run cannot generate it: the block is derived from files of the repository by the
  # repository's own code, and a template composes, it does not compute. So whoever starts the
  # run generates it from the base branch and hands it in, the way a person pastes the output
  # of the repository's command into a description they open by hand.
  closing_section:
    description: >
      the section the repository generates for the end of every pull request description,
      verbatim with its heading, from the base branch; empty when the repository generates none
    example: "## Generated\n\nNothing is open."

# The worker's estimate is admitted against the currency and the quota; its tokens are counted
# per step, its money at the end (ADR-0005, amendment). Connector calls count in requests.
limits:
  currency: { usd: 5.0 }
  quota: { units: 200 }

steps:
  - id: read-issue
    method: rule
    reason: the issue is read verbatim from the system of record
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    fallback:
      when: the connector serving repository.issues is unavailable
      to: human
    work:
      rule: connector
      operation: repository.issues.read
      input:
        number: { $input: issue }
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }

  - id: read-comments
    method: rule
    reason: the discussion is context for the worker
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    fallback:
      when: the connector serving repository.comments is unavailable
      to: human
    depends_on: [read-issue]
    work:
      rule: connector
      operation: repository.comments.list
      input:
        number: { $input: issue }
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }

  - id: context
    method: rule
    reason: the issue and its comments as one text, for the check and for the worker
    rejected:
      - method: llm
        why: a fixed composition needs no model
    exactness: sourced
    depends_on: [read-issue, read-comments]
    work:
      rule: template
      text: |
        # ${title}

        ${body}

        ## Discussion (JSON)

        ${comments}
      values:
        title: { $from: read-issue, $select: output.title }
        body: { $from: read-issue, $select: output.body }
        comments: { $from: read-comments, $select: output.comments }

  - id: read-open-issues
    method: rule
    reason: >
      an issue named under "Blocked by" blocks while it is open; which are open is read from
      the system of record, every page, and a reading that stopped short fails
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    fallback:
      when: the connector serving repository.issues is unavailable
      to: human
    depends_on: [read-issue]
    work:
      rule: connector
      operation: repository.issues.list
      input:
        state: open
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }
      expect:
        - { select: complete, equals: true }

  - id: read-open-records
    method: rule
    reason: >
      a decision or needs record named under "Blocked by" blocks while its file is in the
      directory of open records on the base branch — where a session's `make backlog` looks
      too; the directory is read, not a copy of it
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    fallback:
      when: the connector serving repository.files is unavailable
      to: human
    depends_on: [read-issue]
    work:
      rule: connector
      operation: repository.files.list
      input:
        path: { $input: records_path }
        ref: main
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }

  - id: admit
    method: rule
    reason: >
      ready means the backlog's ready standard — the three sections, a component, a milestone,
      one priority label, the label `ready`, nothing open under "Blocked by" — and open, not a
      pull request, not claimed: the rule `ready`, the same code a session's `make backlog`
      runs, over the fields just read; a refusal names every reason. The run's budget is
      checked by admission control before every step, not here
    rejected:
      - method: llm
        why: a fixed set of conditions needs no judgement, and a judgement could be wrong
    exactness: exact
    depends_on: [read-issue, read-open-issues, read-open-records]
    work:
      rule: ready
      expect: ready
      issue: { $from: read-issue, $select: output }
      open_issues: { $from: read-open-issues, $select: output.issues }
      open_records: { $from: read-open-records, $select: output.entries }

  - id: claim
    method: rule
    reason: >
      the issue is claimed with the label `in-progress` before anything is implemented, so
      that a session or another run reading the backlog skips it; a repeat finds the label
      and adds nothing
    rejected:
      - method: worker
        why: nothing here needs a sandbox or tools
    exactness: sourced
    fallback:
      when: the connector serving repository.labels is unavailable
      to: human
    depends_on: [admit]
    work:
      rule: connector
      operation: repository.labels.set
      input:
        number: { $input: issue }
        labels: [in-progress]
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }

  - id: implement
    method: worker
    reason: >
      changing code so that what the issue says is verified holds is multi-step work with
      tools in an isolated workspace, which is what a worker offers; the worker proposes, the pipeline decides
    rejected:
      - method: llm
        why: a single completion cannot read a repository, run its tests and revise
      - method: rule
        why: the core executes no code itself; that is the adapter obligation
    exactness: tolerant
    fallback:
      when: >
        the coding worker — the worker serving code.read, code.edit, code.test and
        shell.sandboxed — is unavailable, or the assignment fails, is stopped twice, or the
        pipeline is red
      to: human
    requires: [code.read, code.edit, code.test, shell.sandboxed]
    depends_on: [claim, context]
    work:
      task:
        goal: >
          implement the issue given in the inputs — its title, text and discussion — so that
          what its section "What must be achieved" states is achieved, within its section
          "Where the boundary lies"
        acceptance:
          - every condition of the issue's section "How it is verified" holds
          # DEC-0021, answered: a pull request Taktus opens carries what every change of that
          # repository must carry, like any other; which changes need a status update is the
          # repository's own rule, and this criterion names no rule.
          - >
            the repository's own rules for a change are met: whatever its contribution
            documentation requires of every change, which the repository states and the
            workspace carries
          - >
            the repository's own checks are run in the workspace and pass. Where one cannot be
            run there — it needs the network, or a tool the workspace does not have — the
            summary names it and says why; no check is passed over in silence
          - no secret value is written into any file
          - >
            the change is small and touches what the issue names, and what the rules above
            require of any change
          # The description of a pull request Taktus opens is the summary this assignment ends
          # with, so the shape the repository asks of a description is asked of the summary.
          # The section the repository generates is not asked of it: the run appends that
          # section itself, by a template, after the summary (issue #34). An automatic start
          # will take it from the worker, which runs the generator after its change (DEC-0037).
          - >
            the summary this assignment ends with is the body of the pull request that will
            carry the change: what it delivers, and what a reviewer must know. Where the
            repository prescribes a shape for a pull request description — a template, or a
            section one of its checks reads — the summary is written in that shape, with the
            same headings at the same level and every required section present and truthful.
            One section is left out: the one whose content the repository generates, which the
            repository puts last. The run appends it after the summary, from the repository's
            own generator, so the summary neither writes nor copies it
        inputs:
          issue: { $input: issue }
          title: { $from: read-issue, $select: output.title }
          context: { $from: context }
      max_steps: 40
      workspace:
        kind: git
        location: { $input: repository_url }
      allowed_hosts:
        - { $input: repository_host }
      credentials:
        - { name: { $input: coding_credential }, injected_as: env }

  - id: branch-name
    method: rule
    reason: the branch is named by the issue, deterministically
    rejected: []
    exactness: exact
    depends_on: [admit]
    work:
      rule: template
      text: taktus/issue-${issue}
      values:
        issue: { $input: issue }

  - id: create-branch
    method: rule
    reason: >
      the worker's change goes onto a branch through the connector — the run writes outward,
      never the worker — as one commit that carries the idempotency key; the effect leaves
      the system
    rejected:
      - method: worker
        why: a worker that pushes has a credential to the repository and writes outward past the ledger
    exactness: sourced
    fallback:
      when: the connector serving repository.branches is unavailable
      to: human
    depends_on: [implement, branch-name]
    work:
      rule: connector
      operation: repository.branches.create
      input:
        name: { $from: branch-name }
        base: main
        message: { $from: read-issue, $select: output.title }
        files: { $from: implement, $artifact: changeset, $select: files }
        deleted: { $from: implement, $artifact: changeset, $select: deleted }
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }

  - id: wait-for-pipeline
    method: wait
    reason: the pipeline runs on its own time; the run waits for its verdict, polling the state
    rejected: []
    fallback:
      when: the connector serving repository.pipelines is unavailable
      to: human
    depends_on: [create-branch]
    work:
      until:
        operation: repository.pipelines.status
        input:
          ref: { $from: branch-name }
        credentials:
          - { name: REPOSITORY_TOKEN, injected_as: env }
        select: state
        expect: [success, failure]
        poll_seconds: 30
        timeout_seconds: 2400

  - id: read-pipeline
    method: rule
    reason: >
      the pipeline's verdict, read once more so that the check below has a result to hold; the
      reading expects success and fails its own step otherwise, so that a resume after the
      pipeline was re-run reads it again instead of judging the old reading (issue #31)
    rejected: []
    exactness: sourced
    fallback:
      when: the connector serving repository.pipelines is unavailable
      to: human
    depends_on: [wait-for-pipeline]
    work:
      rule: connector
      operation: repository.pipelines.status
      input:
        ref: { $from: branch-name }
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }
      expect:
        - { select: state, equals: success }

  - id: verify
    method: rule
    reason: >
      whether the change is acceptable is the pipeline's verdict, never the worker's opinion of
      its own work: a check over the state the pipeline reported
    rejected:
      - method: worker
        why: a variable method never produces an exact result (ADR-0014)
      - method: llm
        why: a judgement of test output is not a verdict; the pipeline's conclusion is
    exactness: exact
    depends_on: [read-pipeline]
    work:
      rule: check
      conditions:
        - value: { $from: read-pipeline, $select: output.state }
          equals: success

  - id: pull-request-title
    method: rule
    reason: the title names the issue, deterministically
    rejected: []
    exactness: exact
    depends_on: [verify]
    work:
      rule: template
      text: "${title} (#${issue})"
      values:
        title: { $from: read-issue, $select: output.title }
        issue: { $input: issue }

  - id: pull-request-body
    method: rule
    reason: >
      the body links the issue, carries the worker's own summary of what it did, and ends with
      the section the repository generates, copied verbatim from the run's input
    rejected:
      - method: llm
        why: a fixed composition needs no model; the summary is the worker's
      - method: worker
        why: >
          a copy of a generated block is a rule; in the first live run, four of the five
          refused descriptions failed on deterministic parts asked of the coding worker
          (DEC-0025)
    exactness: sourced
    depends_on: [verify]
    work:
      rule: template
      # What Taktus says about itself comes first, not last: a repository whose checks read the
      # description read its *last* section, and that section is the one the repository
      # generates, appended here after the summary (DEC-0025, issue #34).
      text: |
        Closes #${issue}.

        *Opened by Taktus, process P-03 Implementation: the change was made by a coding worker
        in an isolated workspace, put on this branch by the run, and the pipeline's verdict was
        read before this pull request was opened. A person merges. A run raises no decision
        request — a process has no way to — so the section below is `None`, and a question this
        change turns out to raise is raised by the person who reviews it.*

        ## Decisions required

        None

        ## What this delivers

        ${summary}

        ${closing}
      values:
        issue: { $input: issue }
        summary: { $from: implement, $artifact: summary }
        closing: { $input: closing_section }

  - id: open-pr
    method: rule
    reason: opening a pull request is an API call; a repeat after a restart finds the one opened
    rejected: []
    exactness: sourced
    fallback:
      when: the connector serving repository.pullrequests is unavailable
      to: human
    depends_on: [pull-request-title, pull-request-body]
    work:
      rule: connector
      operation: repository.pullrequests.open
      input:
        head: { $from: branch-name }
        base: main
        title: { $from: pull-request-title }
        body: { $from: pull-request-body }
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }

  - id: label
    method: rule
    reason: the pull request is marked as Taktus's, so that a reader sees who opened it
    rejected: []
    exactness: sourced
    fallback:
      when: the connector serving repository.labels is unavailable
      to: human
    depends_on: [open-pr]
    work:
      rule: connector
      operation: repository.labels.set
      input:
        number: { $from: open-pr, $select: output.number }
        labels: [taktus]
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }
