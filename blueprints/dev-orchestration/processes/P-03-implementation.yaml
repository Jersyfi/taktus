      done: every new record's number is reserved, or the list was empty
    create-branch:
      system: the clone of the repository
      do: >
        commit the change with the issue's title as the message and push it as the branch
        taktus/issue-N, which was found free; never push over a branch not looked at
      expertise: committing and pushing a branch
      credentials:
        - parameter: REPOSITORY_TOKEN
          where: >
            the operator's secret store, under the parameter REPOSITORY_TOKEN described in
            CREDENTIALS.md; or the person's own account on the hosting service with the right
            to push a branch
      done: the branch is on the repository with the change
    wait-for-pipeline:
      system: the repository's hosting service, its pipeline view
      do: >
        wait until the pipeline for the pushed branch has a verdict, looking about once a
        minute, for at most forty minutes
      expertise: reading the state of a pipeline run in the hosting service
      credentials:
        - parameter: REPOSITORY_TOKEN
          where: >
            the operator's secret store, under the parameter REPOSITORY_TOKEN described in
            CREDENTIALS.md; or the person's own account on the hosting service with read access
      done: the branch's pipeline has finished
    read-pipeline:
      system: the repository's hosting service, its pipeline view
      do: read the verdict of the branch's pipeline
      expertise: reading the state of a pipeline run in the hosting service
      credentials:
        - parameter: REPOSITORY_TOKEN
          where: >
            the operator's secret store, under the parameter REPOSITORY_TOKEN described in
            CREDENTIALS.md; or the person's own account on the hosting service with read access
      done: the verdict is noted
    verify:
      system: the verdict just read
      do: >
        the change is acceptable only if the verdict is success; otherwise go back to the
        change, fix it and push again
      expertise: none
      credentials: []
      done: the verdict is success
    pull-request-title:
      system: a text file
      do: >
        write the title as type(scope): the issue's title (#N). The type comes from a label
