# B-10.03 Incoming invoice — the first process of the invoice-to-payment blueprint (UC-04): an
# incoming electronic invoice read, matched against what was ordered or contracted, its amounts
# computed again and held `exact`, a booking proposed into the organisation's own accounting
# system, and the payment released by a person (UC-03 B-10.03 and B-6.06, ADR-0169).
#
# The invoice is a document of the organisation's inbox folder, read as the business terms of
# EN 16931 through `documents.invoices` (the documents connector). What was ordered is read from
# the accounting system through `accounting.orders`. The `invoice` rule computes every amount
# again in decimal arithmetic and matches the invoice against the order; any difference halts
# the step and goes to a person, who sees each difference. No model touches an amount.
#
# Taktus keeps no books. The booking is a proposal through `accounting.bookings`, which a person
# of the organisation posts in the accounting system. The payment is handed to the system's
# payment run through `payment.release`, which the shipped legal anchor names: before that step
# the run halts at every level, and a person decides (ADR-0042). The system pays the account it
# holds for the supplier, never one the invoice names; the rule has checked that the two agree.
#
# Not to be used for a tenant before its legal-anchor catalogue is reviewed for its
# jurisdiction by a tax adviser, the review recorded with its date (DEC-0029).
#
# Daily, by its trigger, for every document of the inbox that names an order. By hand, for one
# document:
#
#     uv run taktusctl run --process blueprints/invoice-to-payment/processes/B-10.03-incoming-invoice.yaml \
#         --input document=<the document's file name in the inbox>
#
# A tenant may cap the booking and the payment for all its processes by a risk class with a
# level (`taktusctl anchors set`, ADR-0170). Switching this process off
# (`taktusctl deactivate --process b-10-03-incoming-invoice`) changes nothing in the books.

id: b-10-03-incoming-invoice
version: "3"
name: B-10.03 Incoming invoice
autonomy:
  level: 3
  reason: >
    reading the invoice and the order and computing every amount need nobody: the reads change
    nothing, and the amounts are a rule's, recomputed in decimal and matched against the order,
    any difference going to a person. What leaves the system is held lower: each booking
    proposal is confirmed by a person (the action accounting.bookings at level 2), and the
    payment release is a legal anchor at every level
  toward_next: >
    level 4 would let Taktus heal a failed read on its own; it needs the documents and the
    accounting connectors at verified for the tenant's own systems, and a quarter of runs whose
    incidents a person checked against the accounting system (UC-7.1)
  actions:
    accounting.bookings:
      level: 2
      reason: >
        a booking proposal reaches the organisation's books; a person confirms each until the
        proposals are shown not to need it
      toward_next: >
        the tenant's conditions for a raise, counted for this action alone: twenty decisions
        over four weeks with a rate of correction and rejection below five percent over seven
        and over twenty-eight days (ADR-0110, NTC-0215)
  history: 20
author: the repository
reason: an incoming invoice checked and proposed for booking without a person reading it, and paid only on a person's release (UC-03 B-10.03, UC-04)

# The inbox is collected daily (UC-04 §4, B-6.06's incoming half, ADR-0188): every document
# that names an order — or is no invoice, which a person then sees — starts one run, on the
# first day it is listed and never again. A document that names no order is the classification's,
# B-10.03-unreferenced-invoice.yaml.
triggers:
  - schedule: daily
    each:
      input: document
      operation: documents.invoices.list
      arguments: { referenced: true, limit: 1000 }
      select: documents
      field: document
      once: true

inputs:
  document:
    description: the incoming invoice's file name in the organisation's inbox folder
    example: invoice-ubl.xml

# A read is one request, the order one, each write two.
limits:
  quota: { units: 10 }

steps:
  - id: read-invoice
    method: rule
    reason: the document is read as its EN 16931 business terms, each amount as the document's decimal text
    rejected:
      - method: llm
        why: a structured invoice is read field by field; a model would only add a chance of a wrong field
    exactness: sourced
    checks:   # a sourced result declares its check (ADR-0233)
      - { kind: source_shape, subject: "what documents.invoices.read answered", columns: [digest, order_reference] }
    fallback:
      when: the connector serving documents.invoices is unavailable, or the document is no invoice it reads
      to: human
      role: owner
    work:
      checking: { select: output }
      rule: connector
      operation: documents.invoices.read
      input:
        document: { $input: document }
      credentials:
        - { name: DOCUMENTS_TOKEN, injected_as: env }

  - id: read-order
    method: rule
    reason: what was ordered or contracted under the invoice's reference is read from the accounting system as it holds it
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    checks:   # a sourced result declares its check (ADR-0233)
      - { kind: source_shape, subject: "what accounting.orders.read answered", columns: [account, cost_centre, currency, lines, net_invoiced, net_total, reference, supplier] }
    fallback:
      when: the invoice names no order the accounting system holds, or its connector is unavailable
      to: human
      role: owner
    depends_on: [read-invoice]
    work:
      checking: { select: output }
      rule: connector
      operation: accounting.orders.read
      input:
        reference: { $from: read-invoice, $select: output.order_reference }
      credentials:
        - { name: ACCOUNTING_TOKEN, injected_as: env }

  - id: check
    method: rule
    reason: >
      every amount is computed again by the calculation rules of EN 16931, in decimal, and the
      invoice is matched against the order; the same readings always give the same result, and
      any difference halts the step and names itself
    rejected:
      - method: llm
        why: an amount held exact may not come from a language model (CLAUDE.md §4)
      - method: statistics
        why: the check is fixed arithmetic over one document, not a statistic of a series
    exactness: exact
    # The rule itself compares every amount the invoice states with what its parts give, and the
    # invoice with its order. The checks then hold the result to two things outside the rule: the
    # net and the tax it computed sum to the total with tax the document states, read again at
    # the moment of the check; and the rule gives the same result again over the same readings.
    checks:
      - kind: reconciliation
        subject: the net and the tax to book
        total: the total with tax the invoice states
        source: documents.invoices
      - { kind: recomputation, subject: "the amounts to book and to pay" }   # recomputation: DEC-0173
    fallback:
      when: an amount does not hold, or the invoice differs from its order
      to: human
      role: owner
    depends_on: [read-invoice, read-order]
    work:
      rule: invoice
      invoice: { $from: read-invoice, $select: output }
      order: { $from: read-order, $select: output }
      checking:
        select: amounts
        reads:
          documents.invoices:
            operation: documents.invoices.read
            input:
              document: { $input: document }
            select: totals.with_tax
            credentials:
              - { name: DOCUMENTS_TOKEN, injected_as: env }

  - id: propose-booking
    method: rule
    reason: the checked amounts are handed to the accounting system as a booking proposal, marked so that a repeat proposes nothing twice
    rejected:
      - method: worker
        why: a proposal is one call of a declared operation; a worker would add an actor where none is needed
    exactness: sourced
    checks:   # a sourced result declares its check (ADR-0233)
      - { kind: source_shape, subject: "what accounting.bookings.propose answered", columns: [id] }
    fallback:
      when: the connector serving accounting.bookings is unavailable or refuses the proposal
      to: human
      role: owner
    depends_on: [check]
    work:
      checking: { select: output }
      rule: connector
      operation: accounting.bookings.propose
      input:
        document: { $from: check, $select: document }
        digest: { $from: read-invoice, $select: output.digest }
        order: { $from: check, $select: order }
        supplier: { $from: check, $select: supplier }
        currency: { $from: check, $select: currency }
        issue_date: { $from: check, $select: issue_date }
        due_date: { $from: check, $select: due_date }
        account: { $from: check, $select: account }
        cost_centre: { $from: check, $select: cost_centre }
        net: { $from: check, $select: net }
        tax: { $from: check, $select: tax }
        gross: { $from: check, $select: gross }
        taxes: { $from: check, $select: taxes }
      credentials:
        - { name: ACCOUNTING_TOKEN, injected_as: env }

  - id: release-payment
    method: rule
    reason: >
      a payment a person released is handed to the accounting system's payment run, its amount
      the rule's; the step is under the legal anchor of a payment release and waits for a
      person's decision at every level
    rejected:
      - method: worker
        why: a release is one call of a declared operation, and its decision is a person's, not a worker's
    exactness: sourced
    checks:   # a sourced result declares its check (ADR-0233)
      - { kind: source_shape, subject: "what payment.release.submit answered", columns: [id, status] }
    fallback:
      when: the connector serving payment.release is unavailable or refuses the payment
      to: human
      role: owner
    depends_on: [propose-booking]
    work:
      checking: { select: output }
      rule: connector
      operation: payment.release.submit
      input:
        document: { $from: check, $select: document }
        supplier: { $from: check, $select: supplier }
        currency: { $from: check, $select: currency }
        amount: { $from: check, $select: payable }
        due_date: { $from: check, $select: due_date }
        booking: { $from: propose-booking, $select: output.id }
      credentials:
        - { name: ACCOUNTING_TOKEN, injected_as: env }

takeover:
  sequence: >
    It runs once for each incoming electronic invoice in the organisation's inbox folder. By
    hand, a person of the accounting function starts it for one invoice. Read the invoice, read
    the order or contract it names, compute every amount again and match the invoice against the
    order, enter the booking, and release the payment. Any difference stops the process: ask the
    supplier, do not pay. The payment is always released by a person, and only to the account the
    accounting system holds for the supplier.
  steps:
    read-invoice:
      system: the organisation's inbox folder for incoming invoices
      do: >
        open the invoice whose file name the run was started with and read its business terms:
        seller and their tax identifier, the order reference, the account to be paid, the
        dates, each line with price and quantity, each tax category with its rate, and the
        totals, every amount exactly as the document writes it
      expertise: >
        reading a structured electronic invoice by the business terms of the European standard
        for electronic invoicing, in either of its two syntaxes
      credentials:
        - parameter: DOCUMENTS_TOKEN
          where: >
            the operator's secret store, under the parameter DOCUMENTS_TOKEN described in
            CREDENTIALS.md; a person may instead use their own access to the inbox folder
      done: every business term the later steps need is noted from the invoice
    read-order:
      system: the organisation's accounting system
      do: >
        find the order or contract under the invoice's order reference and read what was
        ordered, what was received, what is still open, the supplier and the account the system
        holds for them, the booking account and the cost centre. If the system holds no such
        order, stop and ask the person responsible for the purchase
      expertise: finding an order in the accounting system
      credentials:
        - parameter: ACCOUNTING_TOKEN
          where: >
            the operator's secret store, under the parameter ACCOUNTING_TOKEN described in
            CREDENTIALS.md; a person may instead use their own account in the accounting system,
            if it may read orders
      done: the order is read, or the process stopped because none was found
    check:
      system: a calculator or a spreadsheet, and the invoice in the inbox folder
      do: >
        check the seller's tax identifier and the account to be paid against what the
        accounting system holds; check each line's price and quantity against the order. Add
        the lines' net amounts, compute each tax category's tax at its rate rounded to the cent,
        and check every total the invoice states. Open the invoice again and check that the net
        and the tax sum to its total with tax. Work in exact decimal amounts. Any difference:
        stop, ask the supplier, do not pay
      expertise: >
        the calculation rules of the European standard for electronic invoicing, value added
        tax by category and rate, and rounding to the cent
      credentials:
        - parameter: DOCUMENTS_TOKEN
          where: >
            the operator's secret store, under the parameter DOCUMENTS_TOKEN described in
            CREDENTIALS.md; a person may instead use their own access to the inbox folder
      done: every amount holds and the invoice agrees with its order, or the process stopped
    propose-booking:
      system: the organisation's accounting system
      do: >
        enter the booking with the checked amounts: the supplier, the invoice, net, tax per
        category and gross, the dates, the order's booking account and cost centre. Check first
        that this invoice is not booked already, so that nothing is booked twice. The booking is
        posted by a person of the organisation
      expertise: booking an incoming invoice in the accounting system
      credentials:
        - parameter: ACCOUNTING_TOKEN
          where: >
            the operator's secret store, under the parameter ACCOUNTING_TOKEN described in
            CREDENTIALS.md; a person may instead use their own account in the accounting system,
            if it may enter bookings
      done: the invoice is booked once with the checked amounts
    release-payment:
      system: the payment run of the organisation's accounting system
      do: >
        a person entitled to release payments decides; released, the payable amount is put
        into the payment run by the due date, to the account the accounting system holds for the
        supplier, never to an account the invoice alone names
      expertise: >
        the organisation's rules for releasing payments, and its payment run
      credentials:
        - parameter: ACCOUNTING_TOKEN
          where: >
            the operator's secret store, under the parameter ACCOUNTING_TOKEN described in
            CREDENTIALS.md; a person releasing by hand uses their own account in the accounting
            system, with the right to release payments
      done: the payment is in the payment run with the checked amount, or it was not released
