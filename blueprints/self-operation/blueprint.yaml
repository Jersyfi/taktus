# Blueprint: self-operation
# The processes Taktus runs for itself, on itself: the checks of its own claims, and its own
# documentation beyond the repository. The first is the removal test. The guides followed (S-05,
# UC-13.6), then maturation (S-06, ADR-0086), and the load measurement's probe (S-04,
# ADR-0223), a change in dialogue (S-07) and a process from a description (S-08). The takeover
# test and the restore drill have no bundle by design (README.md).

apiVersion: taktus.eu/process-bundle/v1
kind: Blueprint
metadata:
  id: self-operation
  name: Self-operation
  domain: operations
  maturity: experimental       # draft | experimental | verified | reference
  version: "1"                 # a later version is offered to an instance, never applied (ADR-0263)

# Capabilities, never product names. The orchestrator.* capabilities are served by the
# loopback connector, through which an instance reaches itself.
requires:
  connectors:
    - capability: orchestrator.integrations
    - capability: orchestrator.removal
    - capability: orchestrator.maturity
    - capability: orchestrator.guides
    - capability: orchestrator.maturation
    - capability: orchestrator.changes
    - capability: repository.files
    - capability: knowledge.pages

# What stays with a person regardless of the autonomy level. Taktus does not put a version of
# itself into production (CLAUDE.md §2 D); a maturation proposal and a proposed change are
# applied by a person, never by the process that proposed them (S-06, S-07).
anchors:
  strategic:
    - release.any
    - maturation.apply
    - process.commission
  legal: []

# What the domain's value balance keeps (UC-9.3). No figure assesses a person (principle 14).
value_criteria:
  cost: [ ai_consumption, compute ]
  benefit: [ defects_prevented, claims_checked, documentation_current ]

processes:
  - id: S-01
    name: Removal test
    bundle: processes/S-01-removal-test.yaml
    autonomy:
      level: 3
      reason: every step reads the instance's own state or checks it by rule; nothing leaves the system; a person watches the weekly report
      toward_next: a month of weekly verdicts, started by the scheduler from the trigger, that a person checked against the rehearsal runs
    triggers:   # one run per integration the instance lists (ADR-0035)
      - schedule: weekly
        each: { input: integration, operation: orchestrator.integrations.list, select: integrations, field: integration }
    steps:
      - { id: describe,        method: rule, exactness: sourced }
      - { id: admit,           method: rule, exactness: exact }
      - { id: exercise,        method: rule, exactness: sourced }   # withhold, run, restore
      - { id: describe-after,  method: rule, exactness: sourced }
      - { id: verify-restored, method: rule, exactness: exact }
      - { id: verdict,         method: rule, exactness: exact }
      - { id: record,          method: rule, exactness: sourced }
      - { id: report,          method: rule, exactness: sourced }
    slo: { freshness: 7d }
  - id: S-04
    name: Load probe
    bundle: processes/S-04-load-probe.yaml
    autonomy:
      level: 3
      reason: three rules over constants; nothing is read from outside the instance and nothing leaves it
      toward_next: none is needed; the probe is a measurement's load, started by a person (taktusctl load measure)
    steps:
      - { id: start,  method: rule, exactness: exact }
      - { id: middle, method: rule, exactness: exact }
      - { id: end,    method: rule, exactness: exact }
  - id: S-05
    name: Guides
    bundle: processes/S-05-guides.yaml
    autonomy:
      level: 3
      reason: every value is the repository's text rendered and measured by rule; a page is written only where it holds what Taktus last wrote; a person's edit is kept and reported
      toward_next: a month of daily runs whose pages a person sampled against the repository, and whose reported edits reached the person responsible
    triggers:   # every day, 00:00 UTC (ADR-0035)
      - schedule: daily
    steps:
      - { id: read-manifest, method: rule, exactness: sourced }
      - { id: sources,       method: rule, exactness: exact }
      - { id: read-sources,  method: rule, exactness: sourced }   # every source at one commit (ADR-0066)
      - { id: render,        method: rule, exactness: exact }
      - { id: read-held,     method: rule, exactness: sourced }
      - { id: measure,       method: rule, exactness: exact }
      - { id: publish,       method: rule, exactness: sourced }
      - { id: report-edits,  method: rule, exactness: sourced }
      - { id: report,        method: rule, exactness: sourced }
    slo: { freshness: 1d }
  - id: S-06
    name: Maturation
    bundle: processes/S-06-maturation.yaml
    autonomy:
      level: 3
      reason: every step reads the instance's own records or applies the rules of ADR-0084; a proposal is a decision request a person answers; nothing is applied
      toward_next: a quarter of weekly runs whose proposals a person checked against the training and trial runs and found sound
    triggers:   # every Monday, 00:00 UTC (ADR-0035), with the budget each training and trial may use
      - schedule: weekly
    steps:
      - { id: measure, method: rule, exactness: sourced }
      - { id: propose,         method: rule, exactness: sourced }   # trains and tries in runs of their own (ADR-0084)
      - { id: nothing-applied, method: rule, exactness: exact }     # a proposal is never a change
      - { id: report,          method: rule, exactness: sourced }
    slo: { freshness: 7d }
  - id: S-07
    name: Change in dialogue
    bundle: processes/S-07-change-in-dialogue.yaml
    autonomy:
      level: 3
      reason: the model's proposed bundle leaves its step only through registration's validation; a proposal is a record the person reads; nothing is registered, and commissioning is the person's act
      toward_next: a quarter of proposals whose differences their requesters found to be what they asked for, without a rewrite by hand
    triggers: []   # started by a person's request, from the web app or the chat (ADR-0091 §6)
    steps:
      - { id: read,    method: rule, exactness: sourced }
      - { id: propose, method: llm,  exactness: tolerant }   # the model proposes the changed bundle
      - { id: keep,    method: rule, exactness: exact }      # validated as registration would; nothing registered
  - id: S-08
    name: Process from a description
    autonomy:
      level: 3
      reason: the model's proposed bundle leaves its step only through registration's validation; a proposal is a record the person reads; nothing is registered, and commissioning is the person's act
      toward_next: a quarter of proposals commissioned without a rewrite by hand
    triggers: []   # started by a person's description, from the web app or the chat (ADR-0251)
    steps:
      - { id: propose, method: llm,  exactness: tolerant }   # the model proposes the new bundle
      - { id: keep,    method: rule, exactness: exact }      # validated as registration would; nothing registered

