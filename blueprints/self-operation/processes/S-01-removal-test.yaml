# S-01 Removal test — one integration is withheld, the processes that use it are exercised,
# and what happened is recorded: did anything break, or did only quality and cost change?
#
# The first process Taktus operates for itself, and the check of the product's own central
# claim (CLAUDE.md §6, ADR-0003): every integration can be removed without breaking a process.
# A test that runs once proves nothing; this one is triggered weekly, once per configured
# integration: the scheduler of an instance that runs the daemon starts it from the trigger
# below. tools/removal_test.sh runs the same by hand, and for the weekly CI job.
#
#     uv run taktusctl run --process blueprints/self-operation/processes/S-01-removal-test.yaml \
#         --input integration=worker.endpoint
#
# Every reference to the instance goes through a capability, never a direct call: the
# capabilities `orchestrator.*` are served by the loopback connector, through which Taktus
# reaches itself (docs/architecture/contracts.md §4). Its operations stay inside Taktus and
# write no egress entry. The README beside this file says how a person runs the same test by
# hand, which is the takeover test of ADR-0013 B for this process.

id: s01-removal-test
version: "4"
name: S-01 Removal test
autonomy:
  level: 3
  reason: >
    every step is a read of the instance's own state or a rule over what was read, nothing
    leaves the system, and the verdict is reproducible from the ledger; a person watches the
    weekly report and samples the rehearsals
  toward_next: >
    a quality history — a month of weekly runs, started by the scheduler from the bundle's
    trigger, whose verdicts a person checked against the rehearsal runs in the ledger and
    found right; then Taktus proposes level 4 with that evidence (anchors.taktus.md M3.9)
author: the repository
reason: the removal test as a process that runs weekly, not a script that ran once

# Weekly, Mondays 00:00 UTC: the elected scheduler starts one run per integration the instance
# lists, each with that integration as its input (ADR-0035).
triggers:
  - schedule: weekly
    each:
      input: integration
      operation: orchestrator.integrations.list
      select: integrations
      field: integration

inputs:
  integration:
    description: the adapter identifier of the integration to withhold, as the ledger names it
    example: worker.endpoint

# Every step is one call of the loopback connector, counted as a unit of quota; a wide margin.
limits:
  quota: { units: 20 }

steps:
  - id: describe
    method: rule
    reason: >
      what the integration serves, its alternatives and the processes that use it are read
      from the instance's configuration
    rejected:
      - method: llm
        why: a read of configuration needs no judgement
    exactness: sourced
    checks:   # a sourced result declares its check (ADR-0233)
      - { kind: source_shape, subject: "what orchestrator.integrations.describe answered", columns: [family, integration] }
    work:
      checking: { select: output }
      rule: connector
      operation: orchestrator.integrations.describe
      input:
        integration: { $input: integration }

  - id: admit
    method: rule
    reason: >
      the integration must be configured and of a known family before anything is withheld;
      a machine check over what was read
    rejected:
      - method: llm
        why: a fixed condition needs no model, and a judgement could be wrong
    exactness: exact
    checks:   # recomputation: DEC-0173
      - { kind: recomputation, subject: the verdict whether the integration may be tested }
    depends_on: [describe]
    work:
      rule: check
      conditions:
        - value: { $from: describe, $select: output.integration }
          equals: { $input: integration }
        - value: { $from: describe, $select: output.family }
          matches: "^(worker|connector|model|persistence)$"

  # Remove, run, restore. An instance's configuration is its environment and does not change
  # while it runs, so the three are one operation: the instance rehearses every process that
  # uses the integration through the same engine over the same stores with the integration
  # left out, and the unchanged configuration is the restored state. A rehearsal sends nothing
  # out: every outward connector operation answers with the recorded response of its last real
  # call (ADR-0030), and every ledger entry of a rehearsal run says it is one. By hand, the
  # three are three steps (README.md).
  - id: exercise
    method: rule
    reason: >
      withholding an adapter, running the processes that use it and comparing where each run
      came to is observation and a fixed rule over the observations (the catalog component's
      removal rules); the verdict is reproducible from the ledger
    rejected:
      - method: llm
        why: whether something broke must be answered the same way every time; a judgement would not
      - method: worker
        why: nothing here needs a sandbox; the instance exercises itself
    exactness: sourced
    checks:   # a sourced result declares its check (ADR-0233)
      - { kind: source_shape, subject: "what orchestrator.removal.exercise answered", columns: [configuration, family, integration, processes, verdict] }
    depends_on: [admit]
    work:
      checking: { select: output }
      rule: connector
      operation: orchestrator.removal.exercise
      input:
        integration: { $input: integration }

  - id: describe-after
    method: rule
    reason: the configuration is read again after the exercise, so that the restore is shown, not assumed
    rejected:
      - method: llm
        why: a read of configuration needs no judgement
    exactness: sourced
    checks:   # a sourced result declares its check (ADR-0233)
      - { kind: source_shape, subject: "what orchestrator.integrations.describe answered", columns: [integration, serves] }
    depends_on: [exercise]
    work:
      checking: { select: output }
      rule: connector
      operation: orchestrator.integrations.describe
      input:
        integration: { $input: integration }

  - id: verify-restored
    method: rule
    reason: the integration is configured again and serves what it served; a machine check
    rejected:
      - method: llm
        why: a comparison of two reads needs no model
    exactness: exact
    checks:   # recomputation: DEC-0173
      - { kind: recomputation, subject: the verdict that the configuration was restored }
    depends_on: [describe-after]
    work:
      rule: check
      conditions:
        - value: { $from: describe-after, $select: output.integration }
          equals: { $input: integration }
        - value: { $from: describe-after, $select: output.serves }
          not_matches: "^\\[\\]$"

  - id: verdict
    method: rule
    reason: >
      the result carries exactly one of four verdicts — broke, changed, untested, exception —
      and this step is the value that counts, checked, never judged
    rejected:
      - method: llm
        why: the verdict is a token the rules produced; a model would only restate it, or misstate it
    exactness: exact
    checks:   # recomputation: DEC-0173
      - { kind: recomputation, subject: the removal test's verdict }
    depends_on: [exercise, verify-restored]
    work:
      rule: check
      conditions:
        - value: { $from: exercise, $select: output.verdict }
          matches: "^(broke|changed|untested|exception)$"
        - value: { $from: exercise, $select: output.integration }
          equals: { $input: integration }

  - id: record
    method: rule
    reason: >
      the result is written to the adapter's maturity and to the ledger as removal.tested, in
      one transaction, by the catalog component
    rejected:
      - method: worker
        why: a write inside the instance needs no sandbox
    exactness: sourced
    checks:   # a sourced result declares its check (ADR-0233)
      - { kind: source_shape, subject: "what orchestrator.maturity.record answered", columns: [content_digest, ledger_seq, maturity, missing] }
    depends_on: [verdict]
    work:
      checking: { select: output }
      rule: connector
      operation: orchestrator.maturity.record
      input:
        result: { $from: exercise, $select: output }

  - id: report
    method: rule
    reason: one line a person reads, composed from the values above; nothing new is said in it
    rejected:
      - method: llm
        why: a narrative is not needed for one line; the values speak
    exactness: sourced
    checks:   # a sourced result declares its check (ADR-0233)
      - { kind: bounds, subject: the composed text, pattern: "Ledger entry removal\\.tested seq" }
    depends_on: [record]
    work:
      rule: template
      text: |
        Removal test of ${integration} (${family}): ${verdict}.
        Taken under: ${configuration}.
        Processes exercised: ${processes}.
        Maturity now ${maturity}; still missing for verified: ${missing}.
        Ledger entry removal.tested seq ${seq}, digest ${digest}.

        ${statement}
      values:
        integration: { $input: integration }
        family: { $from: exercise, $select: output.family }
        verdict: { $from: exercise, $select: output.verdict }
        configuration: { $from: exercise, $select: output.configuration }
        processes: { $from: exercise, $select: output.processes }
        maturity: { $from: record, $select: output.maturity }
        missing: { $from: record, $select: output.missing }
        seq: { $from: record, $select: output.ledger_seq }
        digest: { $from: record, $select: output.content_digest }
        statement: { $run: exactness }

# How a person runs this process without Taktus (ADR-0013 B, ADR-0180): the sequence, and for
# every step the system to act in, what to do there, the expertise it needs, each credential by
# its parameter and where an authorised person finds it, and how to tell that it is done. The
# section "By hand" of README.md beside this directory says the same, step by step.
takeover:
  sequence: >
    The test runs once a week, on Monday, once for every integration the instance is configured
    with; whoever operates the instance starts it, one integration at a time. The steps run in
    order: describe what the integration serves and who uses it, check that it may be tested,
    take it out and run the processes that use it with and without it, put it back and read the
    configuration again, check that it serves what it served, settle on one of the four
    verdicts, record the verdict, and write one line about it. A process that writes outward is
    never run by hand, because running it would write twice; its verdict rests on which other
    adapter or which person would take over its steps.
  steps:
    describe:
      system: the instance's configuration and the registered process bundles
      do: >
        note which capabilities the integration serves: for a worker, the capabilities it
        declares at its capabilities endpoint; for a connector, its declaration; for the model,
        the purposes the configuration gives it. Note which other configured adapter serves the
        same. List the registered process bundles whose steps require one of those capabilities,
        call one of its operations, or ask the model for one of its purposes.
      expertise: >
        reading the instance's configuration and a process bundle; knowing the four families of
        integration, worker, connector, model and the database
      credentials: []
      done: >
        the capabilities served, the alternatives and the processes that use them are written
        down
    admit:
      system: the notes from the step before
      do: >
        check that the integration is configured, and that it is a worker, a connector, the model
        or the database. If either is not so, stop: the integration cannot be tested.
      expertise: none
      credentials: []
      done: both conditions hold, or the test stops here with the reason
    exercise:
      system: the instance's configuration and a shell with the instance's command-line tool
      do: >
        take the integration out of the configuration: unset the worker's address, remove the
        connector's entry, or unset the model's endpoint. For every process from the first step
        that does not write outward, run it once with the original configuration and once with
        the reduced one, with its declared example inputs, and note for each run its final
        state, the step it ended at and its consumption. Then decide for each process, step by
        step: another configured adapter serves the step, or the step's fallback names a person;
        if neither, the process broke. If the reduced run reached the same point as the
        original, or stopped exactly at a step a person takes over, the process changed. Put
        the configuration back as it was.
      expertise: >
        changing the instance's configuration and restarting it; running a process from the
        command line; reading a step's requirements and fallback in a bundle
      credentials: []
      done: >
        every process that uses the integration has a finding, broke or changed, with its two
        runs kept, and the configuration is as it was before
    describe-after:
      system: the instance's configuration
      do: read again what the integration serves, as in the first step
      expertise: reading the instance's configuration
      credentials: []
      done: what the integration serves now is written down
    verify-restored:
      system: the notes of the first step and of the step before
      do: >
        check that the integration is configured again and that it serves at least one
        capability; compare the two readings
      expertise: none
      credentials: []
      done: >
        the integration is there and serves what it served, or the test stops with the
        difference
    verdict:
      system: the findings of the exercise
      do: >
        choose exactly one verdict. Broke, if any process broke. Untested, if no registered
        process uses the integration. Exception, if the integration is the database, which cannot
        be removed by design and is tested by the restore drill instead. Changed, otherwise.
      expertise: the meaning of the four verdicts, as the blueprint's README states them
      credentials: []
      done: one of broke, changed, untested or exception is written down for the integration
    record:
      system: the register of adapter maturity, or the notes of the operating documentation
      do: >
        write the verdict, the date, what the integration served and its version, the processes
        exercised and the identifiers of their runs into the register of adapter maturity, and
        keep the two runs' output as the evidence
      expertise: where the instance's operating documentation keeps the adapters' maturity
      credentials: []
      done: the verdict stands in the register with its date and its evidence
    report:
      system: the place the operator reads the weekly report
      do: >
        write one line: the integration and its family, the verdict, what it was taken under,
        the processes exercised, and its maturity now with what is still missing for verified
      expertise: none
      credentials: []
      done: the line is written where the weekly report is read
