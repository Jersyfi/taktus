  # The processes of UC-03 that have no bundle here (stages.yaml names them; ADR-0191 §4). Each
  # states where it is served — `served_by`, the bundles that carry it, empty where the instance
  # itself does it for every process — or that it is not built, and why.
  # Nothing is proposed for them; `tests/governance/test_stages.py` holds every process a stage
  # names to a bundle or to one of these.
  - { id: B-2.05, name: B-2.05 Comparing models, served_by: [], autonomy: { level: 2, reason: "the model trial of UC-8.14, run by the instance for every process that asks for a purpose when a model is introduced, proposed or changed; no bundle of its own (ADR-0149, ADR-0200, NTC-0266)" } }
  - { id: B-3.03, name: B-3.03 Sending automatically, served_by: [b-3-02], autonomy: { level: 2, reason: "B-3.02's level per class of request, which the frame of UC-7.6 holds; part of B-3.02 (ADR-0215, NTC-0263)" } }
  - { id: B-3.12, name: B-3.12 Response limit, served_by: [b-3-02], autonomy: { level: 2, reason: "B-3.02's deadline, the response limit a rule of the tool keeps (UC-4.17); part of B-3.02 (NTC-0263)" } }
  - { id: B-4.01, name: B-4.01 Evaluation on change, served_by: [b-3-02], autonomy: { level: 2, reason: "B-3.02's evaluation cases, run as a gate on a change (UC-4.18); part of B-3.02 (NTC-0263)" } }
  - { id: B-4.02, name: B-4.02 Drift run, served_by: [b-3-02], autonomy: { level: 2, reason: "B-3.02's evaluation cases, run every week without a change (UC-4.18); part of B-3.02 (NTC-0263)" } }
  - { id: B-4.03, name: B-4.03 Correction rate, served_by: [], autonomy: { level: 1, reason: "UC-7.5's count of B-3.02's corrections per process and action, which the instance keeps for every process; no bundle (NTC-0263)" } }
  - { id: B-4.04, name: B-4.04 Growing the evaluation set, served_by: [b-3-02], autonomy: { level: 2, reason: "B-3.02's evaluation cases grown from corrected drafts (UC-4.18); part of B-3.02 (NTC-0263)" } }
  - { id: B-4.05, name: B-4.05 Scoring in dimensions, served_by: [b-3-02], autonomy: { level: 2, reason: "B-3.02's scoring of every draft in yes-or-no gates decided by rule; part of B-3.02 (ADR-0217)" } }
  - { id: B-4.06, name: B-4.06 Independent check, served_by: [b-3-02], autonomy: { level: 2, reason: "B-3.02's check step, which may only send or reject (UC-7.6); part of B-3.02 (NTC-0263)" } }
  - { id: B-4.07, name: B-4.07 Duties under the AI Act, not_built: true, autonomy: { level: 2, reason: "not built: the label is the frame's (UC-7.6), and the policy on AI literacy is a document of the business" } }
  - { id: B-6.05, name: B-6.05 Dunning business customers, not_built: true, autonomy: { level: 2, reason: "not built: an overdue invoice of a business customer is the business's bookkeeping, which no open interface reaches" } }
  - { id: B-7.02, name: B-7.02 Refining an issue, served_by: [p02-refinement], autonomy: { level: 2, reason: "the dev-orchestration blueprint's P-02, instantiated with the tenant's repository (UC-01)" } }
  - { id: B-7.03, name: B-7.03 Implementing an issue, served_by: [p03-implementation], autonomy: { level: 2, reason: "the dev-orchestration blueprint's P-03, instantiated with the tenant's repository (UC-01)" } }
  - { id: B-9.05, name: B-9.05 Data quality, not_built: true, autonomy: { level: 2, reason: "not built: the master data are in the business's own systems, whose schema only the business knows; a correction script over them is the business's (DEC-0225)" } }
  - { id: B-9.08, name: B-9.08 Store optimisation, not_built: true, autonomy: { level: 2, reason: "not built: no app store publishes keyword rankings or competitors on a brand term through an interface" } }
  - { id: B-10.03, name: B-10.03 Incoming invoices, served_by: [b-10-03-incoming-invoice, b-10-03-unreferenced-invoice], autonomy: { level: 2, reason: "the invoice-to-payment blueprint's two processes over incoming invoices (UC-04, ADR-0169, ADR-0188)" } }
  - { id: B-10.05, name: B-10.05 Privacy policy and terms, not_built: true, autonomy: { level: 2, reason: "not built: the privacy policy, the terms and the record of processing are documents of the business, which it does not hand to the project (DEC-0225)" } }
  - { id: B-10.06, name: B-10.06 Insurance and contracts, not_built: true, autonomy: { level: 2, reason: "not built: the business's insurance policies and contracts are its own documents (DEC-0225)" } }
  - { id: B-10.07, name: B-10.07 Keeping the guardrails, not_built: true, autonomy: { level: 2, reason: "not built as a process: a change of a guardrail is proposed through the instance's raise and limits (UC-7.1, ADR-0005), and its versioned text is the business's" } }
