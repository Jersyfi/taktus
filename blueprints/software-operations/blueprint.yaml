# Blueprint: software operations
# The operation of a small software business, introduced in stages (UC-03,
# docs/usecases/AF-03-software-operations.md). A template, not a corset: an instance keeps the
# processes it needs, answers which of its tools serves each capability, names its owner, and
# starts every process at level 1 or 2 (ADR-0263). The stages are stages.yaml; the anchors a
# tenant configures are anchors.json.

apiVersion: taktus.eu/process-bundle/v1
kind: Blueprint
metadata:
  id: software-operations
  name: Software operations
  domain: operations
  maturity: experimental       # draft | experimental | verified | reference
  version: "1"                 # a later version is offered to an instance, never applied (ADR-0263)

# Capabilities, never product names. Mapping to an adapter is configuration. Every capability
# an operation of a bundle below calls is named here, or the blueprint is not admitted.
requires:
  connectors:
    - capability: accounts.customers
    - capability: accounting.invoices
    - capability: accounts.requests
    - capability: analytics.reports
    - capability: audit.events
    - capability: billing.costs
    - capability: calendar.events
    - capability: chat.threads
    - capability: check.http
    - capability: crm.contacts
    - capability: deployment.sites
    - capability: deployment.workloads
    - capability: directory.accounts
    - capability: entitlements.customers
    - capability: entitlements.grants
    - capability: errors.issues
    - capability: expiry.certificates
    - capability: expiry.credentials
    - capability: expiry.domains
    - capability: feedback.posts
    - capability: helpcentre.articles
    - capability: helpdesk.tickets
    - capability: logs.query
    - capability: mail.messages
    - capability: mentions.search
    - capability: metrics.series
    - capability: models.catalogue
    - capability: models.costs
    - capability: newsletter.broadcasts
    - capability: orchestrator.spend
    - capability: packages.licences
    - capability: payments.customers
    - capability: payments.events
    - capability: payments.failures
    - capability: payments.invoices
    - capability: payments.subscriptions
    - capability: repository.advisories
    - capability: repository.branches
    - capability: repository.comments
    - capability: repository.files
    - capability: repository.issues
    - capability: repository.labels
    - capability: repository.pipelines
    - capability: repository.pullrequests
    - capability: repository.ratelimit
    - capability: repository.runners
    - capability: secrets.metadata
    - capability: stores.beta
    - capability: stores.releases
    - capability: stores.reviews
    - capability: tasks.items
    - capability: warehouse.queries
    - capability: website.posts
  workers:
    - capability: code.edit
    - capability: browser.check
  models:
    - purpose: analysis
    - purpose: check
    - purpose: release
    - purpose: review
    - purpose: support
    - purpose: triage

# What stays with a person at every stage (UC-03 §6). Not legally reviewed for any
# jurisdiction (DEC-0029).
anchors:
  strategic:
    - staff_and_partnerships
    - limits_and_levels
    - promises
    - mass_sending
  legal:
    - moving_money
    - legally_binding_act

# What the domain's value balance keeps (UC-9.3). No figure assesses a person (principle 14).
value_criteria:
  cost: [ ai_consumption, compute, infrastructure, rework ]
  benefit: [ working_time_saved, incidents_prevented, revenue_kept, response_time ]

# Each process names its bundle, which states its usual level and the reason for it. Two
# bundles of one process are alternatives: an instance keeps one (B-8.04, B-8.05).
processes:
  - { id: B-1.01, name: B-1.01 Daily cost, bundle: processes/B-1.01-daily-cost.yaml }
  - { id: B-1.02, name: B-1.02 Run times, bundle: processes/B-1.02-run-times.yaml }
  - { id: B-1.03, name: B-1.03 Runaway guard, bundle: processes/B-1.03-runaway.yaml }
