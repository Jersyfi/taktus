# B-1.01 Daily cost — the cost watcher of UC-03 §4.1: the day's cloud cost read from the
# provider's billing, judged against the median of the four weeks before it, the service behind
# a jump named, and an incident raised when it left its corridor (UC-6.13, ADR-0109, ADR-0151).
#
# The reading is the provider's own figures, read through the capability `billing.costs` (the
# cloud billing connector, ADR-0150). The figures are computed by a `statistics` step in
# decimal arithmetic: the day's total, the median of the totals before it, each service's own
# median and change, and the service that rose most. They are `exact`: no model touches them,
# and the same reading always gives the same figures (CLAUDE.md §4).
#
# The judgement is the tenant's corridor, not this process. A person of the tenant configures
# it once, on the step `measure` and its `ratio`: the day's total over the median of the 28
# days before it, both from the provider's own history, so it judges from the first run:
#
#     uv run taktusctl signal configure cost.cloud_daily --process b-1-01-daily-cost \
#         --step measure --select ratio --bounds fixed --direction above \
#         --yellow 1.3 --red 1.6 --fresh 26h \
#         --role <role> --case <where a cost deviation is worked>
#
# A corridor on `total` with `--bounds median` judges the day against earlier runs instead,
# once there are enough of them.
#
# A red value raises an incident of kind `signal.red` and a report to the role at once; a yellow
# one waits for the daily report (ADR-0109 §4, §5). The service behind the jump stands in the
# result of `measure`, under `driver`, which the run's page shows. Raising a budget and
# throttling a service stay with a person (UC-03 §4.1).
#
# By hand, with the reading of another range:
#
#     uv run taktusctl run --process blueprints/software-operations/processes/B-1.01-daily-cost.yaml \
#         --input days=29
#
# A model provider's costs are watched the same way by `B-2.01-model-cost.yaml`, which reads
# `models.costs.daily`: its reading has the same shape, and the same statistic measures it.
#
# Switching this process off (`taktusctl deactivate --process b-1-01-daily-cost`) changes
# nothing at the provider: it only reads.

id: b-1-01-daily-cost
version: "1"
name: B-1.01 Daily cost
autonomy:
  level: 3
  reason: >
    the process only reads the provider's billing and computes figures by a fixed statistic;
    nothing leaves the system; the judgement is the tenant's corridor, a rule, and a red value
    reaches a person at once as an incident
  toward_next: >
    four weeks of daily runs whose incidents a person checked against the provider's own cost
    explorer and found right, with no missed run; then Taktus proposes level 4 with that
    evidence (UC-7.1)
author: the repository
reason: the day's cloud cost watched every day without a person reading the bill (UC-03 B-1.01)

# Every day, 00:00 UTC, through the elected scheduler (ADR-0035). The newest day read is
# yesterday, which the provider may still be closing; a day not yet closed only ever reads
# lower, so it can hide a jump for a day but never invent one.
triggers:
  - schedule: daily
    inputs:
      days: 29

inputs:
  days:
    description: >
      how many days are read, ending yesterday: the day judged and the days before it whose
      median it is judged against
    example: 29

# One reading is one request to the provider, which bills it; a long range may take a few pages.
limits:
  quota: { units: 5 }

steps:
  - id: read-costs
    method: rule
    reason: the provider's billing is read verbatim, each amount as the decimal text it gave
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    fallback:
      when: the connector serving billing.costs is unavailable
      to: human
      role: owner
    work:
      rule: connector
      operation: billing.costs.daily
      input:
        days: { $input: days }
      credentials:
        - { name: BILLING_KEY, injected_as: env }
      expect:
        - { select: complete, matches: "^true$" }

  - id: measure
    method: statistics
    reason: >
      the day's total, the median of the days before it and each service's change are fixed
      arithmetic over the reading, in decimal; the same reading always gives the same figures,
      and the check is to compute them again
    rejected:
      - method: llm
        why: a figure held exact may not come from a language model (CLAUDE.md §4)
      - method: rule
        why: a median over a window is a statistic of a series, not a fixed rule over one value
    exactness: exact
    checks:   # provisional: DEC-0173
      - { kind: recomputation, subject: "the day's total, the median and each service's change" }
    depends_on: [read-costs]
    work:
      statistic: deviation
      days: { $from: read-costs, $select: output.days }
      window: 28
      minimum: 7
