# B-1.08 Backups — UC-03 §4.1: whether the business's backups ran, and whether its last restore
# drill succeeded, read daily from its metrics store through the capability `metrics.series`;
# a backup or a drill too old is judged against its corridor (UC-4.16, UC-6.13, ADR-0198).
#
# The business's backup job and its monthly restore drill report the moment of their last
# success, as their scheduler is watched. The drill restores into a test environment and
# compares samples; a drill whose samples differ reports no success, so its age grows. Two
# queries are the tenant's, each answering an age in seconds per job, for example
# `time() - backup_last_success_timestamp_seconds`. The rule `filter` takes the oldest of each;
# a value the store could not give as a number is left out, never read as zero (`exact`).
#
# Two signals judge it, each a corridor of the tenant's with fixed thresholds in seconds:
#
#     uv run taktusctl signal configure backup.age --process b-1-08 \
#         --step oldest-backup --select first.values.0.value --bounds fixed --direction above \
#         --yellow 93600 --red 180000 --fresh 2d \
#         --role <role> --case <where a backup is worked>
#     uv run taktusctl signal configure backup.restore_drill_age --process b-1-08 \
#         --step oldest-drill --select first.values.0.value --bounds fixed --direction above \
#         --yellow 2764800 --red 3456000 --fresh 2d \
#         --role <role> --case <where a backup is worked>
#
# A backup older than 26 hours is yellow, older than 50 red; a drill older than 32 days yellow,
# older than 40 red.
#
# Not built here: the restore and the comparison of samples themselves, which are acts on the
# business's systems with no generic interface; they are the drill job's. A restore in an
# emergency stays with a person (UC-03 §4.1).
#
# By hand:
#
#     uv run taktusctl run --process blueprints/software-operations/processes/B-1.08-backups.yaml \
#         --input 'backups=time() - backup_last_success_timestamp_seconds' \
#         --input 'drills=time() - restore_drill_last_success_timestamp_seconds'
#
# Switching it off (`taktusctl deactivate --process b-1-08`) changes nothing at the store.

id: b-1-08
version: "2"
name: B-1.08 Backups
autonomy:
  level: 1
  reason: >
    the process only reads the metrics store and takes the oldest backup and drill by a fixed
    rule; nothing leaves the system, so at level 1 every step runs and none acts; a red value
    reaches a person at once as an incident; it starts at level 1, observing, as UC-03 starts
    every process at level 1 or 2 when its stage opens
  toward_next: >
    stage 1 of the tenant's plan open, and two months of runs whose findings a person checked
    against the backups and found right; then Taktus proposes level 2, and level 3 after it,
    its target in UC-03 (UC-7.1, UC-9.6)
author: the repository
reason: a backup that stopped or a restore drill that failed found the next morning without a person looking (UC-03 B-1.08)

triggers:
  - schedule: "0 6 * * *"
    inputs:
      backups: time() - backup_last_success_timestamp_seconds
      drills: time() - restore_drill_last_success_timestamp_seconds

inputs:
  backups:
    description: the tenant's query for the age of each job's last successful backup, in seconds
    example: time() - backup_last_success_timestamp_seconds
  drills:
    description: >
      the tenant's query for the age of each job's last restore drill whose samples matched, in
      seconds
    example: time() - restore_drill_last_success_timestamp_seconds

limits:
  quota: { units: 4 }

steps:
  - id: read-backups
    method: rule
    reason: the store's figures are read verbatim, each value as the store gave it
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    checks:   # a sourced result declares its check (ADR-0233)
      - { kind: source_shape, subject: "what metrics.series.query answered", columns: [complete, series] }
    fallback:
      when: the connector serving metrics.series is unavailable
      to: human
      role: owner
    work:
      checking: { select: output }
      rule: connector
      operation: metrics.series.query
      input:
        query: { $input: backups }
      credentials:
        - { name: METRICS_TOKEN, injected_as: env }
      expect:
        - { select: complete, equals: true, says: "the store answered more series than were read" }

  - id: oldest-backup
    method: rule
    reason: >
      the oldest backup is a fixed ordering of the store's own figures; a value the store could
      not give as a number is left out, never read as zero
    rejected:
      - method: llm
        why: a figure held exact may not come from a language model (CLAUDE.md §4)
    exactness: exact
    checks:   # recomputation: DEC-0173
      - { kind: recomputation, subject: the job whose last backup is oldest }
    depends_on: [read-backups]
    work:
      rule: filter
      items: { $from: read-backups, $select: output.series }
      all:
        - { field: values.0.value, at_least: 0 }
      order: values.0.value
      descending: true
      limit: 1

  - id: read-drills
    method: rule
    reason: >
      the store's figures are read verbatim, each value as the store gave it; after the
      backups, so that one run of the process is one graph and asks the store once at a time
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    checks:   # a sourced result declares its check (ADR-0233)
      - { kind: source_shape, subject: "what metrics.series.query answered", columns: [complete, series] }
    fallback:
      when: the connector serving metrics.series is unavailable
      to: human
      role: owner
    depends_on: [read-backups]
    work:
      checking: { select: output }
      rule: connector
      operation: metrics.series.query
      input:
        query: { $input: drills }
      credentials:
        - { name: METRICS_TOKEN, injected_as: env }
      expect:
        - { select: complete, equals: true, says: "the store answered more series than were read" }

  - id: oldest-drill
    method: rule
    reason: >
      the oldest successful restore drill is a fixed ordering of the store's own figures; a
      value the store could not give as a number is left out, never read as zero
    rejected:
      - method: llm
        why: a figure held exact may not come from a language model (CLAUDE.md §4)
    exactness: exact
    checks:   # recomputation: DEC-0173
      - { kind: recomputation, subject: the job whose last restore drill is oldest }
    depends_on: [read-drills]
    work:
      rule: filter
      items: { $from: read-drills, $select: output.series }
      all:
        - { field: values.0.value, at_least: 0 }
      order: values.0.value
      descending: true
      limit: 1

# How a person runs this process without Taktus (ADR-0013 B, ADR-0180): the sequence, and for
# every step the system to act in, what to do there, the expertise it needs, each credential by
# its parameter and where an authorised person finds it, and how to tell that it is done.
takeover:
  sequence: >
    The process runs every day at 06:00 UTC; whoever is responsible for the business's backups
    starts it. The steps run in order: read the age of each job's last successful backup from
    the metrics store and take the oldest, then read the age of each job's last restore drill
    whose samples matched and take the oldest. A backup older than 26 hours is yellow and older
    than 50 hours red; a drill older than 32 days is yellow and older than 40 days red, as the
    bundle proposes for the tenant's corridor. A red value goes at once to the role responsible.
    The drill itself is the drill job's, and a restore in an emergency stays with a person.
  steps:
    read-backups:
      system: the business's metrics store, in its query view
      do: >
        run the backup query the run was started with, by default the time now minus each job's
        last successful backup, in seconds. Export the answer as a table with one row per job
        and its age exactly as the store gives it. Make sure the store answered every series.
      expertise: running a query in the metrics store's query language and reading its series
      credentials:
        - parameter: METRICS_TOKEN
          where: >
            the operator's secret store, under the parameter Metrics token of the requesting
            identity described in CREDENTIALS.md; a person may instead sign in to the store
            with their own account that may read it
      done: the table holds every backup job with the age of its last success
    oldest-backup:
      system: a spreadsheet, on the exported table of backups
      do: >
        leave out every row whose value is not a number or is below zero; never read a missing
        value as zero. Sort by age, largest first, and take the first: that job's backup is the
        oldest. Compare its age with 93600 seconds, 26 hours, for yellow and 180000 seconds,
        50 hours, for red.
      expertise: sorting a table and converting seconds into hours
      credentials: []
      done: the job with the oldest backup and its age are written down and judged
    read-drills:
      system: the business's metrics store, in its query view
      do: >
        after the backups, run the drill query the run was started with, by default the time
        now minus each job's last restore drill whose samples matched, in seconds. Export the
        answer as a table with one row per job and its age exactly as the store gives it. Make
        sure the store answered every series.
      expertise: running a query in the metrics store's query language and reading its series
      credentials:
        - parameter: METRICS_TOKEN
          where: >
            the operator's secret store, under the parameter Metrics token of the requesting
            identity described in CREDENTIALS.md; a person may instead sign in to the store
            with their own account that may read it
      done: the table holds every drill job with the age of its last matching drill
    oldest-drill:
      system: a spreadsheet, on the exported table of drills
      do: >
        leave out every row whose value is not a number or is below zero; never read a missing
        value as zero. Sort by age, largest first, and take the first: that job's drill is the
        oldest. Compare its age with 2764800 seconds, 32 days, for yellow and 3456000 seconds,
        40 days, for red. Report a red backup or drill at once to the role responsible.
      expertise: sorting a table and converting seconds into days
      credentials: []
      done: the job with the oldest drill and its age are written down, and any red value reported
