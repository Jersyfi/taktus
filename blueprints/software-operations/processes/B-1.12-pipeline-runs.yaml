# B-1.12 Pipeline infrastructure — UC-03 §4.1: a pipeline run that hangs is counted every hour,
# so that the daily report names it and a person restarts or cancels it (UC-6.13). Pool sizes
# and runner types stay with a person.
#
# Every hour the runs still queued and the runs in progress are read through the capability
# `repository.pipelines`, each with its whole minutes since it was created (ADR-0193 §3). A
# rule keeps a queued run waiting for more than half an hour — no runner took it — and a run
# in progress for more than two hours. The tenant's corridor on either count
# (`pipeline.queued_too_long`, `pipeline.running_too_long`) reports a deviation with a link to
# the run, whose result lists each run with its address at the service.
#
# A lost run is restarted (ADR-0201): the run in progress longest past two hours is cancelled
# and, a minute later, its failed jobs are rerun, each once a person confirmed it at level 2.
# The rerun names the attempt the cancel read, so a repeat reruns nothing. The self-hosted
# runners are read through `repository.runners`, and those offline counted for the tenant's
# corridor (`pipeline.runners_offline`).
#
# The pipeline's weekly cost (ADR-0310): once a week the run is also given `pipeline_group`,
# and reads the last seven days of the cloud's billing export through `billing.costs` — the
# capability B-1.01 reads — by the grouping the run names (`service` unless `cost_group_by`
# says `account` or `region`). The statistic `total` sums each group over the week in decimal,
# and a fixed rule keeps the group the tenant's pattern names: the service its build machines
# or runners are billed under. Its amount is the figure `pipeline-cost`, on which the tenant's
# corridor (`pipeline.weekly_cost`) reports a rise. The hourly checks run in that run too; an
# hourly run reads no costs.
#
# Not built: removing a runner — the pool's size stays with a person — and the cost of the
# minutes the repository service's own runners use, which the service bills to its account
# outside any cloud's billing export, and which no capability reads. The thresholds are this
# version's.
#
# By hand:
#
#     uv run taktusctl run --process blueprints/software-operations/processes/B-1.12-pipeline-runs.yaml
#
# Switching it off (`taktusctl deactivate --process b-1-12`) changes nothing at the service.

id: b-1-12
version: "4"
name: B-1.12 Pipeline infrastructure
autonomy:
  level: 2
  reason: >
    the runs and runners are read and counted by a fixed rule; cancelling and rerunning a lost
    run changes the service, so at level 2 a person confirms each; the judgement is the
    tenant's corridor, and a red value reaches a person as an incident
  toward_next: >
    four weeks of restarts a person confirmed without changing one, and stage 1 of the tenant's
    plan open; then Taktus proposes level 3, and level 4 after it, its target in UC-03; pool
    sizes and runner types stay with a person (UC-7.1, UC-9.6)
author: the repository
reason: a pipeline run that hangs is named without a person watching the pipeline (UC-03 B-1.12)

triggers:
  - schedule: hourly
  - schedule: "0 7 * * 1"
    inputs:
      pipeline_group: "^Cloud Build$"
      cost_group_by: service

inputs:
  pipeline_group:
    description: >
      a pattern for the billing export's group the pipeline is billed under, for example the
      build service or the project of the runners; given, the run reads the week's costs
    example: "^Cloud Build$"
    required: false
  cost_group_by:
    description: how the billing export groups the costs the pattern is matched in, service, account or region
    example: service
    required: false

# The pipeline's runs, the runners, a cancel and a rerun, and once a week the costs.
limits:
  quota: { units: 25 }

steps:
  - id: read-queued
    method: rule
    reason: the queued runs are read verbatim, each with its minutes since it was created
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    checks:   # a sourced result declares its check (ADR-0233)
      - { kind: source_shape, subject: "what repository.pipelines.list answered", columns: [runs] }
    fallback:
      when: the connector serving repository.pipelines is unavailable
      to: human
      role: owner
    work:
      checking: { select: output }
      rule: connector
      operation: repository.pipelines.list
      input:
        status: queued
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }

  - id: read-running
    method: rule
    reason: the runs in progress are read verbatim, each with its minutes since it was created
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    checks:   # a sourced result declares its check (ADR-0233)
      - { kind: source_shape, subject: "what repository.pipelines.list answered", columns: [runs] }
    fallback:
      when: the connector serving repository.pipelines is unavailable
      to: human
      role: owner
    depends_on: [read-queued]
    work:
      checking: { select: output }
      rule: connector
      operation: repository.pipelines.list
      input:
        status: in_progress
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }

  - id: queued-too-long
    method: rule
    reason: a run no runner took for half an hour is a threshold over the service's own timestamp
    rejected:
      - method: llm
        why: a threshold over a count needs no judgement
    exactness: exact
    checks:   # recomputation: DEC-0173
      - { kind: recomputation, subject: the runs queued too long }
    depends_on: [read-queued]
    work:
      rule: filter
      items: { $from: read-queued, $select: output.runs }
      all:
        - { field: age_minutes, at_least: 30 }
      order: age_minutes
      descending: true

  - id: running-too-long
    method: rule
    reason: a run in progress for two hours is a threshold over the service's own timestamp
    rejected:
      - method: llm
        why: a threshold over a count needs no judgement
    exactness: exact
    checks:   # recomputation: DEC-0173
      - { kind: recomputation, subject: the runs in progress too long }
    depends_on: [read-running]
    work:
      rule: filter
      items: { $from: read-running, $select: output.runs }
      all:
        - { field: age_minutes, at_least: 120 }
      order: age_minutes
      descending: true

  - id: cancel-lost
    method: rule
    reason: cancelling the run in progress longest is one API call; it changes the service, so at level 2 a person confirms it first
    rejected:
      - method: worker
        why: nothing here needs a sandbox or tools
    exactness: sourced
    checks:   # a sourced result declares its check (ADR-0233)
      - { kind: source_shape, subject: "what repository.pipelines.cancel answered", columns: [attempt] }
    fallback:
      when: the connector serving repository.pipelines is unavailable
      to: human
      role: owner
    depends_on: [running-too-long]
    work:
      checking: { select: output }
      when:
        - { value: { $from: running-too-long, $select: count }, not_matches: "^0$" }
      rule: connector
      operation: repository.pipelines.cancel
      input:
        run: { $from: running-too-long, $select: first.id }
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }

  - id: settle
    method: wait
    reason: the service completes a cancelled run after it accepted the cancel; a rerun before that is refused
    rejected: []
    depends_on: [cancel-lost, running-too-long]
    work:
      when:
        - { value: { $from: running-too-long, $select: count }, not_matches: "^0$" }
      seconds: 60

  - id: rerun-lost
    method: rule
    reason: rerunning the cancelled run's failed jobs is one API call, once for the attempt the cancel read; at level 2 a person confirms it first
    rejected:
      - method: worker
        why: nothing here needs a sandbox or tools
    exactness: sourced
    checks:   # a sourced result declares its check (ADR-0233)
      - { kind: source_shape, subject: "what repository.pipelines.rerun answered", columns: [attempt, conclusion, id, name, rerun, status, url] }
    fallback:
      when: the connector serving repository.pipelines is unavailable, or the run was not completed in time
      to: human
      role: owner
    depends_on: [settle, cancel-lost, running-too-long]
    work:
      checking: { select: output }
      when:
        - { value: { $from: running-too-long, $select: count }, not_matches: "^0$" }
      rule: connector
      operation: repository.pipelines.rerun
      input:
        run: { $from: running-too-long, $select: first.id }
        attempt: { $from: cancel-lost, $select: output.attempt }
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }

  - id: read-runners
    method: rule
    reason: the self-hosted runners are read verbatim, each with whether it is online
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    checks:   # a sourced result declares its check (ADR-0233)
      - { kind: source_shape, subject: "what repository.runners.list answered", columns: [runners] }
    fallback:
      when: the connector serving repository.runners is unavailable
      to: human
      role: owner
    depends_on: [read-queued]
    work:
      checking: { select: output }
      rule: connector
      operation: repository.runners.list
      input: {}
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }

  - id: runners-offline
    method: rule
    reason: a runner that is not online is a field of the service's own reading
    rejected:
      - method: llm
        why: a selection by a field needs no judgement
    exactness: exact
    checks:   # recomputation: DEC-0173
      - { kind: recomputation, subject: the runners offline }
    depends_on: [read-runners]
    work:
      rule: filter
      items: { $from: read-runners, $select: output.runners }
      all:
        - { field: status, not_matches: "^\"?online" }
      order: name

  - id: read-costs
    method: rule
    reason: the cloud's billing export is read verbatim, each amount as the decimal text it gave
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    checks:   # a sourced result declares its check (ADR-0233)
      - { kind: source_shape, subject: "what billing.costs.daily answered", columns: [complete, days] }
    fallback:
      when: the connector serving billing.costs is unavailable
      to: human
      role: owner
    depends_on: [read-queued]
    work:
      checking: { select: output }
      when:
        - { value: { $input: pipeline_group, $otherwise: "" }, not_matches: "^$" }
      rule: connector
      operation: billing.costs.daily
      input:
        days: 7
        group_by: { $input: cost_group_by, $otherwise: service }
      credentials:
        - { name: BILLING_KEY, injected_as: env }
      expect:
        - { select: complete, matches: "^true$" }

  - id: week
    method: statistics
    reason: each group's cost over the week is a sum of the export's own amounts, in decimal; the same reading always gives the same sums
    rejected:
      - method: llm
        why: a figure held exact may not come from a language model (CLAUDE.md §4)
      - method: rule
        why: a sum over a series is a statistic of the series, which the rules do not compute
    exactness: exact
    checks:   # recomputation: DEC-0173
      - { kind: recomputation, subject: each group's cost over the week }
    depends_on: [read-costs]
    work:
      when:
        - { value: { $input: pipeline_group, $otherwise: "" }, not_matches: "^$" }
      statistic: total
      days: { $from: read-costs, $select: output.days }

  - id: pipeline-cost
    method: rule
    reason: the pipeline's cost is the group the tenant's pattern names, kept by a fixed rule from the week's sums
    rejected:
      - method: llm
        why: a selection by a name needs no judgement
    exactness: exact
    checks:   # recomputation: DEC-0173
      - { kind: recomputation, subject: the pipeline's cost over the week }
    depends_on: [week]
    work:
      when:
        - { value: { $input: pipeline_group, $otherwise: "" }, not_matches: "^$" }
      rule: filter
      items: { $from: week, $select: groups }
      all:
        - { field: group, matches: { $input: pipeline_group, $otherwise: "^$" } }
      order: value
      descending: true

# How a person runs this process without Taktus (ADR-0013 B, ADR-0180): the sequence, and for
# every step the system to act in, what to do there, the expertise it needs, each credential by
# its parameter and where an authorised person finds it, and how to tell that it is done.
takeover:
  sequence: >
    The process runs every hour; whoever looks after the business's pipelines starts it. The
    steps run in order: list the pipeline runs still queued, then the runs in progress; keep
    each queued run waiting for 30 minutes or more, because no runner took it, and each run in
    progress for 120 minutes or more. The counts are judged by the tenant's corridor and named
    in the daily report, each run with its link. Once a person agreed, cancel the run in
    progress longest, wait a minute, and rerun its failed jobs. List the self-hosted runners and
    count those offline. Once a week, also read the last seven days of the cloud's billing
    export and sum the cost of the service the pipeline is billed under. The pool sizes and the
    runner types stay with a person.
  steps:
    read-queued:
      system: the repository hosting service, in the repository's pipeline runs
      do: >
        list every run whose status is queued, and note for each its link and the whole minutes
        since it was created.
      expertise: finding pipeline runs by status in the repository hosting service
      credentials:
        - parameter: REPOSITORY_TOKEN
          where: >
            the operator's secret store, under the parameter Repository access token of the
            requesting identity described in CREDENTIALS.md; a person may instead sign in with
            their own account that may read the repository's pipelines
      done: every queued run is noted with its age in minutes
    read-running:
      system: the repository hosting service, in the repository's pipeline runs
      do: >
        list every run whose status is in progress, and note for each its link and the whole
        minutes since it was created.
      expertise: finding pipeline runs by status in the repository hosting service
      credentials:
        - parameter: REPOSITORY_TOKEN
          where: >
            the operator's secret store, under the parameter Repository access token of the
            requesting identity described in CREDENTIALS.md; a person may instead sign in with
            their own account that may read the repository's pipelines
      done: every run in progress is noted with its age in minutes
    queued-too-long:
      system: the list of queued runs
      do: >
        keep the runs queued for 30 minutes or more and sort them by age, oldest first. Their
        number is the count of runs queued too long.
      expertise: none
      credentials: []
      done: the runs queued too long and their count are written down
    running-too-long:
      system: the list of runs in progress
      do: >
        keep the runs in progress for 120 minutes or more and sort them by age, oldest first.
        Their number is the count of runs in progress too long. Name each kept run, with its
        link, to the role that decides whether to restart or cancel it.
      expertise: none
      credentials: []
      done: the runs in progress too long and their count are written down and passed on
    cancel-lost:
      system: the repository hosting service, the run's page
      do: >
        only where a run is in progress too long, and once the person responsible agreed: cancel
        the one in progress longest, and note its attempt number
      expertise: cancelling a pipeline run in the repository hosting service
      credentials:
        - parameter: REPOSITORY_TOKEN
          where: >
            the operator's secret store, under the parameter Repository access token of the
            requesting identity described in CREDENTIALS.md
      done: the run is cancelled, or none was in progress too long
    settle:
      system: none
      do: wait one minute, until the service shows the run as completed
      expertise: none
      credentials: []
      done: the run shows as completed
    rerun-lost:
      system: the repository hosting service, the run's page
      do: >
        once the person responsible agreed: rerun the failed jobs of the cancelled run, unless
        its attempt number is already higher than the one noted, which means it was rerun
      expertise: rerunning a pipeline run's failed jobs in the repository hosting service
      credentials:
        - parameter: REPOSITORY_TOKEN
          where: >
            the operator's secret store, under the parameter Repository access token of the
            requesting identity described in CREDENTIALS.md
      done: the run's failed jobs run again, or none was in progress too long
    read-runners:
      system: the repository hosting service, the repository's self-hosted runners
      do: list every runner with whether it is online and whether it is busy
      expertise: reading the runners in the repository hosting service's settings
      credentials:
        - parameter: REPOSITORY_TOKEN
          where: >
            the operator's secret store, under the parameter Repository access token of the
            requesting identity described in CREDENTIALS.md
      done: every runner is listed
    runners-offline:
      system: the list of runners
      do: keep the runners that are not online, sort them by name and count them
      expertise: none
      credentials: []
      done: the runners offline are listed and counted
    read-costs:
      system: the cloud provider's billing console or its cost report
      do: >
        only in the weekly run: read the cost of every service for each of the last seven days,
        grouped as the run names, and export them as a table with one row per day and group,
        each amount exactly as the provider gives it
      expertise: finding the daily cost by service in the cloud provider's billing
      credentials:
        - parameter: BILLING_KEY
          where: >
            the operator's secret store, under the parameter Cloud billing key of the requesting
            identity described in CREDENTIALS.md; a person reading the console signs in with
            their own account that may read the billing
      done: the table holds every day of the week with every group's cost
    week:
      system: a spreadsheet, on the exported table
      do: sum each group's cost over the seven days, in decimal, rounding nothing
      expertise: summing in a spreadsheet
      credentials: []
      done: each group's cost over the week is written down
    pipeline-cost:
      system: the week's sums
      do: >
        keep the group whose name the run's pattern names, the one the pipeline is billed
        under, and compare its cost with the tenant's corridor for the pipeline's weekly cost
      expertise: none
      credentials: []
      done: the pipeline's cost over the week is written down and judged
