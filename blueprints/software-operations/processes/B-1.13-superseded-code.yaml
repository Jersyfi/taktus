# B-1.13 Superseded code — UC-03 §4.1: when a deprecated endpoint reaches its date, the calls it
# still receives are read from the logs and a removal is filed as an issue that shows them, so
# that the implementation process opens the removal pull request (UC-01 P-03, UC-4.17). The
# merge stays with a person.
#
# The calls are read through `logs.query` (ADR-0202) by the tenant's `calls_filter`, in its log
# store's own language, over the last `since_minutes` (default a week). A rule counts them. The
# issue names the endpoint, the count, whether the store answered every entry, and the newest
# call's moment and source, and states the goal in the words P-03's coding worker is given:
# remove the endpoint and its code, keep the pipeline green. Its label is the one under which
# the tenant's P-03 takes an issue. A removal already filed is not filed again: the issue carries
# the endpoint's mark.
#
# The trigger is the endpoint's date: the tenant's version starts it on that day, or B-10.01's
# deadline calendar names it and a person starts it from the issue B-10.01 filed. No schedule is
# part of this version.
#
# By hand:
#
#     uv run taktusctl run --process blueprints/software-operations/processes/B-1.13-superseded-code.yaml \
#         --input endpoint=/v1/orders --input 'calls_filter={app="api"} |= "/v1/orders"' \
#         --input label=ready
#
# Switching it off (`taktusctl deactivate --process b-1-13`) changes nothing in the repository.

id: b-1-13
version: "1"
name: B-1.13 Superseded code
autonomy:
  level: 2
  reason: >
    the calls are counted by a fixed rule over the log store's own entries; filing the issue
    leaves the system, so a person confirms it, as every process of UC-03 starts at level 1 or 2
    when its stage opens
  toward_next: >
    three removals a person confirmed without changing the issue, and stage 1 of the tenant's
    plan open; then Taktus proposes level 3, its target in UC-03; the merge stays with a person
    at every level (UC-7.1, UC-9.6)
author: the repository
reason: a deprecated endpoint's removal is prepared with its remaining calls without a person searching the logs (UC-03 B-1.13)

inputs:
  endpoint:
    description: the deprecated endpoint, as the business's code and its documentation name it
    example: /v1/orders
  calls_filter:
    description: the tenant's filter for a call to the endpoint, in its log store's own query language
    example: '{app="api"} |= "/v1/orders"'
  since_minutes:
    description: how far back the calls are read, in minutes
    example: 10080
    required: false
  label:
    description: the label under which the tenant's implementation process takes an issue
    example: ready

limits:
  quota: { units: 30 }

steps:
  - id: read-calls
    method: rule
    reason: the log store's entries for calls to the endpoint are read verbatim, by the tenant's own filter
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    fallback:
      when: the connector serving logs.query is unavailable
      to: human
      role: owner
    work:
      rule: connector
      operation: logs.query.entries
      input:
        filter: { $input: calls_filter }
        since_minutes: { $input: since_minutes, $otherwise: 10080 }
        limit: 1000
      credentials:
        - { name: LOGS_TOKEN, injected_as: env }

  - id: remaining
    method: rule
    reason: >
      the remaining calls are a count of the store's own entries; an answer the store cut short
      is said so by its `complete`, never completed by an estimate
    rejected:
      - method: llm
        why: a count needs no judgement, and a figure held exact may not come from a model (CLAUDE.md §4)
    exactness: exact
    checks:   # recomputation: DEC-0173
      - { kind: recomputation, subject: the calls the endpoint still received }
    depends_on: [read-calls]
    work:
      rule: filter
      items: { $from: read-calls, $select: output.entries }
      all:
        - { field: timestamp, matches: "." }

  - id: read-filed
    method: rule
    reason: the open issues are read verbatim, so that a removal already filed is not filed twice
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    fallback:
      when: the connector serving repository.issues is unavailable
      to: human
      role: owner
    work:
      rule: connector
      operation: repository.issues.list
      input:
        state: open
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }
      expect:
        - { select: complete, equals: true, says: "the open issues were not all read" }

  - id: unfiled
    method: rule
    reason: whether the removal is filed already is the endpoint's mark in an open issue, a fixed rule
    rejected:
      - method: llm
        why: finding a fixed text needs no judgement
    exactness: exact
    checks:   # recomputation: DEC-0173
      - { kind: recomputation, subject: whether the removal is filed already }
    depends_on: [read-filed, remaining]
    work:
      rule: filter
      items:
        - { endpoint: { $input: endpoint } }
      all:
        - { field: endpoint, matches: "." }
      excluding: { $from: read-filed, $select: output.issues }
      within: body
      marker: "removal:${endpoint}"

  - id: compose
    method: rule
    reason: the issue's text is the endpoint and the store's count between fixed words, the goal stated for the implementation process
    rejected:
      - method: llm
        why: a fixed composition needs no model
    exactness: sourced
    depends_on: [unfiled, remaining, read-calls]
    work:
      when:
        - { value: { $from: unfiled, $select: count }, not_matches: "^0$" }
      rule: template
      text: |
        Remove the deprecated endpoint `${endpoint}`.

        Its date has come. The log store holds ${count} calls to it since ${since} (every entry
        read: ${complete}). The newest: ${newest}.

        Goal: remove the endpoint, the code only it reaches, and its tests and documentation;
        change nothing else, and keep the pipeline green. The pull request names the remaining
        calls above, so that whoever merges it knows who still calls. The merge stays with a
        person.

        Filed by Taktus, process B-1.13 Superseded code, once a person confirmed it.

        removal:${endpoint}
      values:
        endpoint: { $input: endpoint }
        count: { $from: remaining, $select: count }
        since: { $from: read-calls, $select: output.start }
        complete: { $from: read-calls, $select: output.complete }
        newest: { $from: remaining, $select: first }

  - id: title
    method: rule
    reason: the issue's title is the endpoint between fixed words
    rejected:
      - method: llm
        why: a fixed composition needs no model
    exactness: sourced
    depends_on: [unfiled]
    work:
      when:
        - { value: { $from: unfiled, $select: count }, not_matches: "^0$" }
      rule: template
      text: "Remove the deprecated endpoint ${endpoint}"
      values:
        endpoint: { $input: endpoint }

  - id: file
    method: rule
    reason: opening the issue is an API call; the effect leaves the system, so at level 2 a person confirms it first
    rejected:
      - method: worker
        why: nothing here needs a sandbox or tools
    exactness: sourced
    fallback:
      when: the connector serving repository.issues is unavailable
      to: human
      role: owner
    depends_on: [compose, title]
    work:
      when:
        - { value: { $from: unfiled, $select: count }, not_matches: "^0$" }
      rule: connector
      operation: repository.issues.create
      input:
        title: { $from: title }
        body: { $from: compose }
        labels: [{ $input: label }]
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }

# How a person runs this process without Taktus (ADR-0013 B, ADR-0180): the sequence, and for
# every step the system to act in, what to do there, the expertise it needs, each credential by
# its parameter and where an authorised person finds it, and how to tell that it is done.
takeover:
  sequence: >
    The process runs on the day a deprecated endpoint is to be removed; whoever owns the
    endpoint starts it. The steps run in order: search the log store for the calls the endpoint
    received in the last week, count them, check the open issues for a removal already filed,
    write the issue's text and title, and open the issue with the implementation label once a
    person confirmed it. The removal pull request is opened on that issue; its merge stays with a
    person.
  steps:
    read-calls:
      system: the business's log store, in its query view
      do: >
        search with the tenant's filter for calls to the endpoint over the last week, by default
        10080 minutes, at most a thousand entries, and note whether the store said there are
        more.
      expertise: querying the log store in its own query language
      credentials:
        - parameter: LOGS_TOKEN
          where: >
            the operator's secret store, under the parameter Logs token of the requesting
            identity described in CREDENTIALS.md; a person may instead sign in to the log store
            with their own account that may read it
      done: the calls of the window are listed
    remaining:
      system: the list of calls
      do: count the calls, and note the newest one's moment and source
      expertise: none
      credentials: []
      done: the remaining calls are counted
    read-filed:
      system: the repository hosting service, in the repository's issue list
      do: >
        list every open issue and keep their texts at hand, so that a removal already filed is
        recognised by its line removal:<endpoint>.
      expertise: searching issues in the repository hosting service
      credentials:
        - parameter: REPOSITORY_TOKEN
          where: >
            the operator's secret store, under the parameter Repository access token of the
            requesting identity described in CREDENTIALS.md
      done: every open issue has been read
    unfiled:
      system: the open issues
      do: look for the line removal:<endpoint>; where an open issue carries it, stop here
      expertise: none
      credentials: []
      done: it is known whether the removal is filed already
    compose:
      system: a text editor
      do: >
        write the issue's text: the endpoint, the count of remaining calls and the window, the
        newest call, the goal — remove the endpoint and only its code, keep the pipeline green —
        and the line removal:<endpoint> at the end.
      expertise: none
      credentials: []
      done: the text is written, or the removal was filed already
    title:
      system: a text editor
      do: write the title Remove the deprecated endpoint <endpoint>
      expertise: none
      credentials: []
      done: the title is written, or the removal was filed already
    file:
      system: the repository hosting service
      do: >
        once the person responsible agreed, open the issue with that title and text and the
        label under which the implementation process takes an issue.
      expertise: opening an issue in the repository hosting service
      credentials:
        - parameter: REPOSITORY_TOKEN
          where: >
            the operator's secret store, under the parameter Repository access token of the
            requesting identity described in CREDENTIALS.md
      done: the issue is open, or the removal was filed already
