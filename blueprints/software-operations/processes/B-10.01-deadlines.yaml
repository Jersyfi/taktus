# B-10.01 Deadline calendar — UC-03 §4.10: the business's tax, contract, notice and renewal
# deadlines, kept in its calendar, become issues in the repository service with their lead
# time, once each, through the capabilities `calendar.events` and `repository.issues`
# (UC-4.17, ADR-0197).
#
# Every morning the calendar's entries of the next `lead` days are read, events by their start
# and to-dos by their due, repeating ones expanded where their rule is plain; and the open
# issues of the repository. The rule `filter` leaves out each entry an open issue already
# carries the mark of (`deadline:<uid>@<moment>`) and takes the one due first. One issue per
# run: the next run takes the next deadline. The selection is `exact`.
#
# The issue is filed only after a person confirmed it, at level 2. An entry the connector could
# not read — a rule with a `BY` part, an unknown zone — is never filed; it stands in the reading
# under `unread`, which a person sees in the run.
#
# The calendar's path and the lead time are this version's inputs; a tenant names its own.
#
# Not built here: a task list other than the repository's issues (B-5.01 has no capability).
# Acting on the deadline stays with a person (UC-03 §4.10).
#
# By hand:
#
#     uv run taktusctl run --process blueprints/software-operations/processes/B-10.01-deadlines.yaml \
#         --input calendar=/calendars/deadlines.ics --input lead=30
#
# Switching it off (`taktusctl deactivate --process b-10-01`) changes nothing at the calendar or
# the repository: what it filed stays filed.

id: b-10-01
version: "1"
name: B-10.01 Deadline calendar
autonomy:
  level: 2
  reason: >
    the deadline is selected by a fixed rule over the calendar's own reading; filing the issue
    leaves the system, so a person confirms it, as every process of UC-03 starts at level 1 or 2
    when its stage opens
  toward_next: >
    stage 1 of the tenant's plan open, and four weeks of issues a person confirmed without
    changing the selection; then Taktus proposes level 3, its target in UC-03, for filing
    (UC-7.1, UC-9.6)
author: the repository
reason: every deadline in the business's calendar reaches a task list with its lead time, without a person copying it (UC-03 B-10.01)

triggers:
  - schedule: "0 7 * * *"
    inputs:
      calendar: /calendars/deadlines.ics
      lead: 30

inputs:
  calendar:
    description: the path of the calendar of deadlines on the server the connector is configured for
    example: /calendars/deadlines.ics
  lead:
    description: the lead time, in days before a deadline, at which it becomes an issue
    example: 30

limits:
  quota: { units: 40 }

steps:
  - id: read-calendar
    method: rule
    reason: the calendar's entries are read as the calendar holds them; nothing to judge
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    fallback:
      when: the connector serving calendar.events is unavailable
      to: human
      role: owner
    work:
      rule: connector
      operation: calendar.events.list
      input:
        path: { $input: calendar }
        days: { $input: lead }
        limit: 500
      credentials:
        - { name: CALENDAR_TOKEN, injected_as: env }
      expect:
        - { select: complete, equals: true, says: "the calendar answered more entries than were read" }

  - id: read-filed
    method: rule
    reason: the open issues are read verbatim, so that a deadline already filed is not filed twice
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    fallback:
      when: the connector serving repository.issues is unavailable
      to: human
      role: owner
    work:
      rule: connector
      operation: repository.issues.list
      input:
        state: open
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }
      expect:
        - { select: complete, equals: true, says: "the open issues were not all read" }

  - id: select
    method: rule
    reason: >
      which deadline is filed is a fixed rule over the calendar's reading: one an open issue
      carries the mark of is left out, and the one due first is taken
    rejected:
      - method: llm
        why: a date and a mark need no judgement, and a model's pick could differ between two runs
    exactness: exact
    checks:   # recomputation: DEC-0173
      - { kind: recomputation, subject: the deadline selected from the two readings }
    depends_on: [read-calendar, read-filed]
    work:
      rule: filter
      items: { $from: read-calendar, $select: output.entries }
      excluding: { $from: read-filed, $select: output.issues }
      within: body
      marker: "deadline:${key}"
      order: at
      limit: 1

  - id: title
    method: rule
    reason: the issue's title is the deadline's moment and its summary between fixed words
    rejected:
      - method: llm
        why: a fixed composition needs no model
    exactness: sourced
    depends_on: [select]
    work:
      when:
        - { value: { $from: select, $select: count }, not_matches: "^0$" }
      rule: template
      text: "Deadline ${at}: ${summary}"
      values:
        at: { $from: select, $select: first.at }
        summary: { $from: select, $select: first.summary }

  - id: compose
    method: rule
    reason: the issue's text is the calendar's entry between fixed words, with the mark that keeps it from being filed twice
    rejected:
      - method: llm
        why: a fixed composition needs no model
    exactness: sourced
    depends_on: [select]
    work:
      when:
        - { value: { $from: select, $select: count }, not_matches: "^0$" }
      rule: template
      text: |
        A deadline from the business's calendar falls within its lead time: ${summary}

        - due: ${at} (UTC)
        - kind: ${kind}, categories: ${categories}
        - repeats: ${repeats}
        - in the calendar: ${uid}

        ${description}

        Filed by Taktus, process B-10.01 Deadline calendar, once a person confirmed it. Acting
        on the deadline stays with a person.

        deadline:${key}
      values:
        summary: { $from: select, $select: first.summary }
        at: { $from: select, $select: first.at }
        kind: { $from: select, $select: first.kind }
        categories: { $from: select, $select: first.categories }
        repeats: { $from: select, $select: first.repeats }
        uid: { $from: select, $select: first.uid }
        description: { $from: select, $select: first.description }
        key: { $from: select, $select: first.key }

  - id: file
    method: rule
    reason: opening the issue is an API call; the effect leaves the system, so at level 2 a person confirms it first
    rejected:
      - method: worker
        why: nothing here needs a sandbox or tools
    exactness: sourced
    fallback:
      when: the connector serving repository.issues is unavailable
      to: human
      role: owner
    depends_on: [select, title, compose]
    work:
      when:
        - { value: { $from: select, $select: count }, not_matches: "^0$" }
      rule: connector
      operation: repository.issues.create
      input:
        title: { $from: title }
        body: { $from: compose }
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }
