# B-2.01 Model cost — the use half of UC-03 B-2.01: what the organisation spent at a model
# provider each day, read from the provider's own cost report, judged against the median of the
# four weeks before it, the model and kind of usage behind a jump named, and an incident raised
# when it left its corridor (UC-6.13, ADR-0109, ADR-0151).
#
# The reading is the provider's own figures, read through the capability `models.costs` (a
# model costs connector, ADR-0150). The figures are computed by a `statistics` step in decimal
# arithmetic: the day's total, the median of the totals before it, each line item's own median
# and change, and the line item that rose most. They are `exact`: no model touches them, and
# the same reading always gives the same figures (CLAUDE.md §4). It is the cost watcher of
# B-1.01, reading a model provider instead of a cloud bill.
#
# Not built here: the other half of B-2.01, the credit left and the days until it runs out.
# The providers' cost APIs give what was spent, not what is left; a balance would have to come
# from elsewhere, and none is read yet.
#
# The judgement is the tenant's corridor, not this process. A person of the tenant configures
# it once, on the step `measure` and its `ratio`: the day's total over the median of the 28
# days before it, both from the provider's own history, so it judges from the first run:
#
#     uv run taktusctl signal configure cost.models_daily --process b-2-01 \
#         --step measure --select ratio --bounds fixed --direction above \
#         --yellow 1.5 --red 2.0 --fresh 26h \
#         --role <role> --case <where a cost deviation is worked>
#
# A red value raises an incident of kind `signal.red` and a report to the role at once; a yellow
# one waits for the daily report (ADR-0109 §4, §5). The line item behind the jump stands in the
# result of `measure`, under `driver`. Topping up the credit and changing a budget stay with a
# person (UC-03 B-2.01, B-2.02).
#
# By hand:
#
#     uv run taktusctl run --process blueprints/software-operations/processes/B-2.01-model-cost.yaml \
#         --input days=29
#
# Switching this process off (`taktusctl deactivate --process b-2-01`) changes
# nothing at the provider: it only reads.

id: b-2-01
version: "3"
name: B-2.01 Model cost
autonomy:
  level: 2
  reason: >
    the process only reads the provider's cost report and computes figures by a fixed
    statistic; nothing leaves the system; the judgement is the tenant's corridor, a rule, and a
    red value reaches a person at once as an incident; UC-03 sets B-2.01's target at level 2
  toward_next: >
    UC-03 keeps B-2.01 at level 2; a higher level is a decision of the tenant, with four weeks
    of daily runs whose incidents a person checked against the provider's console (UC-7.1)
author: the repository
reason: a model provider's daily spend watched without a person reading its console (UC-03 B-2.01)

# Every day, 00:00 UTC, through the elected scheduler (ADR-0035). The newest day read is
# yesterday; a day the provider is still counting only ever reads lower, so it can hide a jump
# for a day but never invent one.
triggers:
  - schedule: daily
    inputs:
      days: 29

inputs:
  days:
    description: >
      how many days are read, ending yesterday: the day judged and the days before it whose
      median it is judged against
    example: 29

# One reading is one request to the provider, or a few pages for a long range.
limits:
  quota: { units: 5 }

steps:
  - id: read-costs
    method: rule
    reason: the provider's cost report is read verbatim, each amount as exact decimal text
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    checks:   # a sourced result declares its check (ADR-0233)
      - { kind: source_shape, subject: "what models.costs.daily answered", columns: [complete, days] }
    fallback:
      when: the connector serving models.costs is unavailable
      to: human
      role: owner
    work:
      checking: { select: output }
      rule: connector
      operation: models.costs.daily
      input:
        days: { $input: days }
      credentials:
        - { name: MODEL_COSTS_TOKEN, injected_as: env }
      expect:
        - { select: complete, matches: "^true$" }

  - id: measure
    method: statistics
    reason: >
      the day's total, the median of the days before it and each line item's change are fixed
      arithmetic over the reading, in decimal; the same reading always gives the same figures,
      and the check is to compute them again
    rejected:
      - method: llm
        why: a figure held exact may not come from a language model (CLAUDE.md §4)
      - method: rule
        why: a median over a window is a statistic of a series, not a fixed rule over one value
    exactness: exact
    checks:   # recomputation: DEC-0173
      - { kind: recomputation, subject: "the day's total, the median and each line item's change" }
    depends_on: [read-costs]
    work:
      statistic: deviation
      days: { $from: read-costs, $select: output.days }
      window: 28
      minimum: 7

# How a person runs this process without Taktus (ADR-0013 B, ADR-0180): the sequence, and for
# every step the system to act in, what to do there, the expertise it needs, each credential by
# its parameter and where an authorised person finds it, and how to tell that it is done.
takeover:
  sequence: >
    The process runs once a day, at midnight UTC; whoever watches the organisation's spend at the
    model provider starts it. The steps run in order: read the daily costs of the last days,
    ending yesterday, from the model provider's cost report, then compute yesterday's total
    against the median of the 28 days before it and find the line item, a model and a kind of
    usage, that rose most. Whether the ratio is a deviation is the tenant's corridor: above the
    yellow bound the finding waits for the daily report, above the red bound it goes at once to
    the role responsible. Topping up the credit and changing a budget stay with a person.
  steps:
    read-costs:
      system: the model provider's console or its cost report
      do: >
        read the cost of every line item for each day of the range, as many days as the run was
        started with, ending yesterday, and export them as a table with one row per day and line
        item; keep every amount exactly as the provider gives it. Make sure the range is
        complete: no day is missing.
      expertise: finding the daily cost by model and usage in the model provider's console
      credentials:
        - parameter: MODEL_COSTS_TOKEN
          where: >
            the operator's secret store, under the parameter Model costs key of the requesting
            identity described in CREDENTIALS.md; a person reading the console signs in with
            their own account that may read the organisation's costs
      done: the table holds every day of the range with every line item's cost
    measure:
      system: a spreadsheet, on the exported table
      do: >
        sum yesterday's costs into the day's total; take the median of the daily totals of the
        28 days before it, and at least 7 of them must exist; divide the day's total by that
        median to get the ratio. Do the same for every line item, and name the line item whose
        cost rose most as the driver. Compute in decimal and round nothing before the end.
        Compare the ratio with the tenant's yellow and red bounds.
      expertise: summing and taking a median in a spreadsheet; the tenant's corridor for the ratio
      credentials: []
      done: >
        the day's total, the median, the ratio and the driver are written down, and a ratio above
        the red bound has been reported to the role responsible
