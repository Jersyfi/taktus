# B-3.04 "Paid but not unlocked" — UC-03 §4.3: for a customer's request about payment or
# access, the payment at the payment provider is matched against the entitlement in the
# product, the cause named, and a clear case repaired (UC-7.1 action class, UC-7.7).
#
# The run serves one customer's case: every read and the repair carry the customer as the
# step's scope, and a connector answers that customer's data only (ADR-0130). The customer is
# named by the payment provider's identifier, which a support message does not carry: the
# tenant's intake, or the person who reads the request, gives it as the input `customer`.
#
# Started by a change of a subscription (version 3, ADR-0337): where the payment provider or the
# in-app subscription service sends its webhook to the intake, every `subscription.changed`
# starts a run for its customer, so that a purchase not unlocked is found when it happens, not
# when the customer writes. The repair still waits for a person at level 2. A business on more
# than one provider names, in its own version, the connector each provider's run reads (ADR-0311).
#
# The subscriptions of the customer are read through `payments.customers`, those still paid —
# `active` or `trialing` — kept by the rule `filter`, and the customer's entitlements read
# through `entitlements.customers` (the manifest `connectors/entitlements.manifest.json`,
# ADR-0199 §2). The rule `match` pairs each paid item with the entitlement of its product and
# compares the seats. Its result names the cause: `left_only` is paid and not unlocked,
# `right_only` unlocked and not paid, `differing` the wrong number of seats.
#
# A clear case — exactly one mismatch, and it is a paid product without its entitlement — is
# repaired: the entitlement is granted with the seats paid for. At level 2 a person confirms
# the grant first. Every other mismatch is left for a person with the cause the match named. A
# refund stays with a person at every level (UC-03 §6, the anchor `anc-money`).
#
# By hand:
#
#     uv run taktusctl run --process blueprints/software-operations/processes/B-3.04-paid-not-unlocked.yaml \
#         --input customer=cus_...
#
# Switching it off (`taktusctl deactivate --process b-3-04`) changes nothing: what it granted
# stays granted.

id: b-3-04
version: "3"
name: B-3.04 Paid but not unlocked
autonomy:
  level: 2
  reason: >
    the cause is found by a fixed rule over the two systems' own readings; the repair grants
    access in the product and leaves the system, so a person confirms it, as every process of
    UC-03 starts at level 1 or 2 when its stage opens
  toward_next: >
    four weeks of repairs a person confirmed without changing them, and stage 2 of the
    tenant's plan open; then Taktus proposes level 3 for the grant, its target in UC-03
    (UC-7.1, UC-7.5, UC-9.6)
author: the repository
reason: a customer who paid and cannot use what they paid for is unlocked without a person comparing two systems (UC-03 B-3.04)

triggers:
  - event: subscription.changed
    from_event: { customer: customer }

inputs:
  customer:
    description: the customer's identifier at the payment provider, as the product keeps it
    example: cus_fake4

limits:
  quota: { units: 12 }

steps:
  - id: subscriptions
    method: rule
    reason: the customer's subscriptions are read as the payment provider holds them; nothing to judge
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    checks:   # a sourced result declares its check (ADR-0233)
      - { kind: source_shape, subject: "what payments.customers.subscriptions answered", columns: [complete, subscriptions] }
    fallback:
      when: the connector serving payments.customers is unavailable
      to: human
      role: owner
    work:
      checking: { select: output }
      scope: { subject: { $input: customer } }
      rule: connector
      operation: payments.customers.subscriptions
      input:
        customer: { $input: customer }
      credentials:
        - { name: PAYMENTS_TOKEN, injected_as: env }
      expect:
        - { select: complete, equals: true, says: "the customer's subscriptions were not all read" }

  - id: paid
    method: rule
    reason: which subscriptions are still paid is the provider's status, kept by a fixed rule
    rejected:
      - method: llm
        why: a status is a field, not a judgement
    exactness: exact
    checks:   # recomputation: DEC-0173
      - { kind: recomputation, subject: the subscriptions still paid }
    depends_on: [subscriptions]
    work:
      rule: filter
      items: { $from: subscriptions, $select: output.subscriptions }
      any:
        - { field: status, equals: active }
        - { field: status, equals: trialing }

  - id: entitlements
    method: rule
    reason: the customer's entitlements are read as the product holds them; nothing to judge
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    checks:   # a sourced result declares its check (ADR-0233)
      - { kind: source_shape, subject: "what entitlements.customers.list answered", columns: [complete, entitlements] }
    fallback:
      when: the connector serving entitlements.customers is unavailable
      to: human
      role: owner
    work:
      checking: { select: output }
      scope: { subject: { $input: customer } }
      rule: connector
      operation: entitlements.customers.list
      input:
        customer: { $input: customer }
      credentials:
        - { name: ENTITLEMENTS_TOKEN, injected_as: env }
      expect:
        - { select: complete, equals: true, says: "the customer's entitlements were not all read" }

  - id: match
    method: rule
    reason: >
      whether a paid product is unlocked is equality of the product and the seats on both
      sides; the cause is which side an unpaired entry stands on, never a guess
    rejected:
      - method: llm
        why: a model could name a cause the readings do not show; the match is exact (UC-03 B-3.04)
    exactness: exact
    checks:   # recomputation: DEC-0173
      - { kind: recomputation, subject: the mismatches of the customer's payments and entitlements }
    depends_on: [paid, entitlements]
    work:
      rule: match
      left:
        items: { $from: paid, $select: items }
        key: [customer, items.product]
        each: items
      right:
        items: { $from: entitlements, $select: output.entitlements }
        key: [customer, product]
      compare:
        - { left: items.quantity, right: quantity }

  - id: repair
    method: rule
    reason: >
      granting the entitlement is an API call of the product; it is made only in the clear case
      the match named, with the product and the seats the payment shows, and at level 2 after a
      person confirmed it
    rejected:
      - method: llm
        why: what is granted is what was paid for, a field of the reading
      - method: worker
        why: nothing here needs a sandbox or tools
    exactness: sourced
    checks:   # a sourced result declares its check (ADR-0233)
      - { kind: source_shape, subject: "what entitlements.customers.grant answered", columns: [customer, id, product, quantity, replayed] }
    fallback:
      when: the connector serving entitlements.customers is unavailable
      to: human
      role: owner
    depends_on: [match]
    work:
      checking: { select: output }
      when:
        - { value: { $from: match, $select: mismatches }, equals: 1 }
        - { value: { $from: match, $select: first.kind }, equals: left_only }
      scope: { subject: { $input: customer } }
      rule: connector
      operation: entitlements.customers.grant
      input:
        customer: { $input: customer }
        product: { $from: match, $select: first.entry.items.product }
        quantity: { $from: match, $select: first.entry.items.quantity }
      credentials:
        - { name: ENTITLEMENTS_TOKEN, injected_as: env }

takeover:
  sequence: >
    The process runs once for one customer's request about a payment or about access they paid
    for; the person who reads the request starts it with the customer's identifier at the
    payment provider. The steps run in order: read the customer's subscriptions at the payment
    provider, keep those still paid, read the customer's entitlements in the product, pair each
    paid product with its entitlement and compare the seats, and grant the missing entitlement
    when the case is clear. A clear case is exactly one mismatch, and it is a product paid for
    and not unlocked. Every other mismatch goes to the owner with its cause. A refund always
    stays with a person.
  steps:
    subscriptions:
      system: the payment provider's dashboard
      do: >
        open the customer by the identifier the run was started with, and list every one of its
        subscriptions with its status and, for each item, the product and the quantity. Make sure
        the list is complete
      expertise: finding a customer's subscriptions in the payment provider's dashboard
      credentials:
        - parameter: PAYMENTS_TOKEN
          where: >
            the operator's secret store, under the parameter Payment provider key of the
            requesting identity described in CREDENTIALS.md; a person reading the dashboard
            signs in with their own account that may read customers and subscriptions
      done: every subscription of the customer is listed with its status, products and quantities
    paid:
      system: the list of subscriptions
      do: >
        keep only the subscriptions whose status is active or trialing; strike out every other
        one, such as cancelled, unpaid or past due
      expertise: none
      credentials: []
      done: the list holds only the subscriptions still paid
    entitlements:
      system: the product's administration, where a customer's access is granted
      do: >
        open the same customer and list every entitlement it holds, with the product and the
        number of seats. Make sure the list is complete
      expertise: finding a customer's entitlements in the product's administration
      credentials:
        - parameter: ENTITLEMENTS_TOKEN
          where: >
            the operator's secret store, under the parameter Product entitlements token of the
            requesting identity described in CREDENTIALS.md; a person signs in to the
            administration with their own account that may read entitlements
      done: every entitlement of the customer is listed with its product and seats
    match:
      system: the two lists, side by side
      do: >
        pair every item of a paid subscription with the entitlement of the same product. Write
        down each item that does not pair or differs, with its cause: paid and not unlocked (a
        paid product with no entitlement), unlocked and not paid (an entitlement with no paid
        product), or a different number of seats on the two sides. Count the mismatches
      expertise: none
      credentials: []
      done: every mismatch is written down with its cause, and their number is counted
    repair:
      system: the product's administration
      do: >
        only when there is exactly one mismatch and it is a product paid for and not unlocked,
        grant the customer the entitlement for that product with the number of seats paid for.
        At level 2 the owner confirms the grant first. Grant nothing in any other case; hand
        the case to the owner with the causes written down. Never refund
      expertise: granting a customer an entitlement in the product's administration
      credentials:
        - parameter: ENTITLEMENTS_TOKEN
          where: >
            the operator's secret store, under the parameter Product entitlements token of the
            requesting identity described in CREDENTIALS.md; a person signs in with their own
            account that may grant entitlements
      done: >
        the customer holds the entitlement with the seats paid for, or the case is with the
        owner with its causes
