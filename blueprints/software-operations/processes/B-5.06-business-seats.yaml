# B-5.06 Business customers' seats — UC-03 §4.5: the seats a business customer pays for are
# checked against the seats the product grants it, when a customer is new, its seats change or
# its contract ends. Seats are `exact`.
#
# The run serves one customer's case, as B-3.04 does: its subscriptions are read through
# `payments.customers`, those still paid kept, its entitlements read through
# `entitlements.customers` (the manifest `connectors/entitlements.manifest.json`, ADR-0199 §2),
# and the rule `match` pairs each paid product with its entitlement and compares the seats.
# Every product paid and not granted, granted and not paid, or granted with another number of
# seats than paid for is a mismatch.
#
# The judgement is the tenant's corridor on the step `match` and its `mismatches`; one is red:
#
#     uv run taktusctl signal configure payments.seat_mismatches --process b-5-06 \
#         --step match --select mismatches --bounds fixed --direction above \
#         --yellow 0.25 --red 0.5 --fresh 8d \
#         --role <role> --case <where a business customer's seats are worked>
#
# The renewal is prepared from the same reading. A paid subscription's period ends at
# `current_period_end`, which every payment provider connector answers (ADR-0206). The rule
# `filter` keeps the paid subscriptions whose period ends at or before `renew_before`, a moment
# in seconds since the epoch, ordered by that end, each with `cancel_at_period_end`: whether it
# ends there rather than renews. No rule reads the clock, and a rule that did would not give
# the same result twice; so the moment is an input — the start of the run plus the lead time
# the tenant keeps, given by the trigger of a contract's end or by the person who starts it.
# Without it nothing is selected. Each one selected reaches the responsible role as an
# incident through the tenant's corridor on the step `renewals` and its `count`:
#
#     uv run taktusctl signal configure payments.renewals_due --process b-5-06 \
#         --step renewals --select count --bounds fixed --direction above \
#         --yellow 0.25 --red 0.5 --fresh 8d \
#         --role <role> --case <where a business customer's contract is worked>
#
# Preparing it ends there: the run names the subscription, its products, its seats and the end
# of its period, and the person renews, changes or ends the contract. The contract and the
# price stay with a person (UC-03 §6).
#
# The tenant starts it from its own event of a new customer, a changed seat count or a
# contract's end, as a trigger of its own version, or by hand. Setting up access is B-3.04's
# repair.
#
# By hand:
#
#     uv run taktusctl run --process blueprints/software-operations/processes/B-5.06-business-seats.yaml \
#         --input customer=cus_... --input renew_before=<seconds since the epoch>
#
# Switching it off (`taktusctl deactivate --process b-5-06`) changes nothing: it only reads.

id: b-5-06
version: "3"
name: B-5.06 Business customers' seats
autonomy:
  level: 1
  reason: >
    the process only reads both systems and matches the seats by a fixed rule; nothing leaves
    the system, so at level 1 every step runs and none acts; a mismatch reaches a person as an
    incident; it starts at level 1, observing, as UC-03 starts every process at level 1 or 2
    when its stage opens
  toward_next: >
    stage 1 of the tenant's plan open, and four weeks of runs whose incidents a person checked
    against both systems and found right; then Taktus proposes level 2, and level 3 after it,
    its target in UC-03 (UC-7.1, UC-9.6)
author: the repository
reason: the seats a business customer pays for are the seats it can use, checked whenever they change (UC-03 B-5.06)

inputs:
  customer:
    description: the business customer's identifier at the payment provider, as the product keeps it
    example: cus_fake1
  renew_before:
    description: >
      the moment, in seconds since the epoch, up to which a paid period's end is prepared for
      renewal: the start of the run plus the lead time the tenant keeps, for example 30 days;
      without it no renewal is prepared
    example: 1790000003
    required: false

limits:
  quota: { units: 8 }

steps:
  - id: subscriptions
    method: rule
    reason: the customer's subscriptions are read as the payment provider holds them; nothing to judge
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    checks:   # a sourced result declares its check (ADR-0233)
      - { kind: source_shape, subject: "what payments.customers.subscriptions answered", columns: [complete, subscriptions] }
    fallback:
      when: the connector serving payments.customers is unavailable
      to: human
      role: owner
    work:
      checking: { select: output }
      scope: { subject: { $input: customer } }
      rule: connector
      operation: payments.customers.subscriptions
      input:
        customer: { $input: customer }
      credentials:
        - { name: PAYMENTS_TOKEN, injected_as: env }
      expect:
        - { select: complete, equals: true, says: "the customer's subscriptions were not all read" }

  - id: paid
    method: rule
    reason: which subscriptions are still paid is the provider's status, kept by a fixed rule
    rejected:
      - method: llm
        why: a status is a field, not a judgement
    exactness: exact
    checks:   # recomputation: DEC-0173
      - { kind: recomputation, subject: the subscriptions still paid }
    depends_on: [subscriptions]
    work:
      rule: filter
      items: { $from: subscriptions, $select: output.subscriptions }
      any:
        - { field: status, equals: active }
        - { field: status, equals: trialing }

  - id: renewals
    method: rule
    reason: >
      whether a paid period ends by the moment the run was asked about is a comparison of two
      numbers the reading holds, a fixed rule
    rejected:
      - method: llm
        why: a date compared is a fixed rule; a model could misread a number
      - method: statistics
        why: nothing is estimated; a period ends by the moment or it does not
    exactness: exact
    checks:   # recomputation: DEC-0173
      - { kind: recomputation, subject: the paid subscriptions whose period ends by the moment asked }
    depends_on: [paid]
    work:
      rule: filter
      items: { $from: paid, $select: items }
      all:
        - { field: current_period_end, at_most: { $input: renew_before, $otherwise: 0 } }
      order: current_period_end

  - id: entitlements
    method: rule
    reason: the customer's entitlements are read as the product holds them; nothing to judge
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    checks:   # a sourced result declares its check (ADR-0233)
      - { kind: source_shape, subject: "what entitlements.customers.list answered", columns: [complete, entitlements] }
    fallback:
      when: the connector serving entitlements.customers is unavailable
      to: human
      role: owner
    work:
      checking: { select: output }
      scope: { subject: { $input: customer } }
      rule: connector
      operation: entitlements.customers.list
      input:
        customer: { $input: customer }
      credentials:
        - { name: ENTITLEMENTS_TOKEN, injected_as: env }
      expect:
        - { select: complete, equals: true, says: "the customer's entitlements were not all read" }

  - id: match
    method: rule
    reason: >
      the seats paid for and the seats granted are two numbers of one product, equal or not;
      a fixed rule pairs and compares them
    rejected:
      - method: llm
        why: seats are exact (UC-03 B-5.06); a model could miscount
    exactness: exact
    checks:   # recomputation: DEC-0173
      - { kind: recomputation, subject: the seats paid for and granted that differ }
    depends_on: [paid, entitlements]
    work:
      rule: match
      left:
        items: { $from: paid, $select: items }
        key: [customer, items.product]
        each: items
      right:
        items: { $from: entitlements, $select: output.entitlements }
        key: [customer, product]
      compare:
        - { left: items.quantity, right: quantity }

takeover:
  sequence: >
    The process runs once for one business customer, when the customer is new, its seats
    change or its contract ends; the person who looks after business customers starts it with
    the customer's identifier at the payment provider. The steps run in order: read the
    customer's subscriptions at the payment provider, keep those still paid, read the
    customer's entitlements in the product, and pair each paid product with its entitlement and
    compare the seats; beside it, keep the paid subscriptions whose period ends by the moment
    the run was given, for their renewal. Every mismatch is red and goes to the role the tenant
    named, and so is every renewal due. The process changes nothing; the contract and the price
    stay with a person.
  steps:
    subscriptions:
      system: the payment provider's dashboard
      do: >
        open the customer by the identifier the run was started with, and list every one of its
        subscriptions with its status and, for each item, the product and the quantity of seats.
        Make sure the list is complete
      expertise: finding a customer's subscriptions in the payment provider's dashboard
      credentials:
        - parameter: PAYMENTS_TOKEN
          where: >
            the operator's secret store, under the parameter Payment provider key of the
            requesting identity described in CREDENTIALS.md; a person reading the dashboard
            signs in with their own account that may read customers and subscriptions
      done: every subscription of the customer is listed with its status, products and seats
    paid:
      system: the list of subscriptions
      do: keep only the subscriptions whose status is active or trialing; strike out every other one
      expertise: none
      credentials: []
      done: the list holds only the subscriptions still paid
    renewals:
      system: the list of paid subscriptions
      do: >
        only when the run was given a moment for renewals: keep the subscriptions whose paid
        period ends at or before that moment, ordered by the end of the period, and note for
        each whether it is set to end there instead of renewing. Each one kept is a renewal to
        prepare: report it, with its products, seats and the end of its period, to the role
        the tenant named, where a business customer's contract is worked. Renewing, changing
        or ending the contract, and its price, stay with that person
      expertise: none
      credentials: []
      done: >
        the subscriptions whose period ends by the moment are listed and reported, or no
        moment was given and none is listed
    entitlements:
      system: the product's administration, where a customer's access is granted
      do: >
        open the same customer and list every entitlement it holds, with the product and the
        number of seats granted. Make sure the list is complete
      expertise: finding a customer's entitlements in the product's administration
      credentials:
        - parameter: ENTITLEMENTS_TOKEN
          where: >
            the operator's secret store, under the parameter Product entitlements token of the
            requesting identity described in CREDENTIALS.md; a person signs in with their own
            account that may read entitlements
      done: every entitlement of the customer is listed with its product and seats
    match:
      system: the two lists, side by side
      do: >
        pair every item of a paid subscription with the entitlement of the same product, and
        compare the seats exactly. Write down every product paid and not granted, granted and
        not paid, or granted with another number of seats than paid for, and count them. One
        mismatch or more is red: report them to the role the tenant named, where a business
        customer's seats are worked
      expertise: none
      credentials: []
      done: the mismatches are written down and counted, and any mismatch has been reported
