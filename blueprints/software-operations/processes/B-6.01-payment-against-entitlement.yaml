# B-6.01 Payment against entitlement — UC-03 §4.6: every active payment at the payment provider
# is matched against the product's entitlements; every mismatch is an incident (UC-6.8).
#
# Every morning the active subscriptions are read through the capability
# `payments.subscriptions`, and the entitlements in force through `entitlements.grants`. The
# rule `match` pairs each item of a subscription with the entitlement of the same customer and
# product (ADR-0199). What is paid and not granted, granted and not paid, and every entry that
# cannot be paired with certainty, is a mismatch. The match is `exact`: the same readings give
# the same mismatches, and no model judges them.
#
# The entitlements are the product's own records, and no open standard describes them. The
# tenant serves them with the vendor connector, over its product's MCP server, under the
# manifest `connectors/entitlements.manifest.json` of this blueprint: what each operation must
# answer is stated there (ADR-0199 §2). A tenant whose product keeps the customer under another
# identifier than the payment provider's adapts the key in a version of its own.
#
# The judgement is the tenant's corridor on the step `match` and its `mismatches`. A person of
# the tenant configures it once, so that one mismatch is red and an incident at once:
#
#     uv run taktusctl signal configure payments.entitlement_mismatches --process b-6-01 \
#         --step match --select mismatches --bounds fixed --direction above \
#         --yellow 0.25 --red 0.5 --fresh 26h \
#         --role <role> --case <where a mismatch is worked>
#
# Several payment providers (ADR-0329, ADR-0311): a business that takes payments at more than
# one provider — a card processor, a wallet, an in-app subscription service — names each
# provider's configured connector: `provider`, and where it has them, `second` and `third`. Each
# is read by a step of its own, and the rule `match` joins every provider's subscriptions
# before it pairs them with the entitlements, so that an entitlement paid at another provider is
# never named granted and not paid. A provider the run does not name is skipped and adds
# nothing. Without `provider`, the first connector configured for the capability serves, as in
# version 2. Every provider the product grants entitlements for must be named: one left out
# makes its customers' entitlements mismatches.
#
# A refund stays with a person at every level (UC-03 §6); this process moves nothing. A
# mismatch of one customer's case is repaired by B-3.04.
#
# By hand:
#
#     uv run taktusctl run --process blueprints/software-operations/processes/B-6.01-payment-against-entitlement.yaml \
#         --input provider=connector.payments --input second=connector.wallet \
#         --input third=connector.subscriptions
#
# Switching it off (`taktusctl deactivate --process b-6-01`) changes nothing at the payment
# provider or in the product: it only reads.

id: b-6-01
version: "3"
name: B-6.01 Payment against entitlement
autonomy:
  level: 1
  reason: >
    the process only reads both lists and matches them by a fixed rule; nothing leaves the
    system, so at level 1 every step runs and none acts; the judgement is the tenant's corridor,
    and a mismatch reaches a person at once as an incident; it starts at level 1, observing, as
    UC-03 starts every process at level 1 or 2 when its stage opens
  toward_next: >
    stage 1 of the tenant's plan open, and four weeks of daily runs whose incidents a person
    checked against both systems and found right, with no missed run; then Taktus proposes
    level 2, and level 3 after it, its target in UC-03 (UC-7.1, UC-9.6)
author: the repository
reason: every payment is matched against what the customer may use, every day, without a person comparing two lists (UC-03 B-6.01)

# Every morning, through the elected scheduler (ADR-0035).
triggers:
  - schedule: "30 5 * * *"

inputs:
  provider:
    description: >
      the configured connector of the first payment provider, by the identifier the instance's
      configuration gives it; without it, the first connector configured for
      payments.subscriptions
    example: connector.payments
    required: false
  second:
    description: a second payment provider's configured connector; without it, none is read
    example: connector.wallet
    required: false
  third:
    description: a third payment provider's configured connector; without it, none is read
    example: connector.subscriptions
    required: false

limits:
  quota: { units: 120 }

steps:
  - id: payments
    method: rule
    reason: the payment provider's active subscriptions are read as it holds them; nothing to judge
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    checks:   # a sourced result declares its check (ADR-0233)
      - { kind: source_shape, subject: "what payments.subscriptions.list answered", columns: [complete, subscriptions] }
    fallback:
      when: the connector serving payments.subscriptions is unavailable
      to: human
      role: owner
    work:
      checking: { select: output }
      rule: connector
      connector: { $input: provider, $otherwise: null }
      operation: payments.subscriptions.list
      input:
        status: active
        limit: 10000
      credentials:
        - { name: PAYMENTS_TOKEN, injected_as: env }
      expect:
        - select: complete
          equals: true
          says: more subscriptions are active than one reading holds; a partial list would match falsely

  - id: payments-second
    method: rule
    reason: the second payment provider's active subscriptions are read as it holds them; nothing to judge
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    checks:   # a sourced result declares its check (ADR-0233)
      - { kind: source_shape, subject: "what payments.subscriptions.list answered", columns: [complete, subscriptions] }
    fallback:
      when: the second connector serving payments.subscriptions is unavailable
      to: human
      role: owner
    work:
      checking: { select: output }
      when:
        - { value: { $input: second, $otherwise: "" }, not_matches: "^$" }
      rule: connector
      connector: { $input: second, $otherwise: null }
      operation: payments.subscriptions.list
      input:
        status: active
        limit: 10000
      credentials:
        - { name: PAYMENTS_TOKEN, injected_as: env }
      expect:
        - select: complete
          equals: true
          says: more subscriptions are active than one reading holds; a partial list would match falsely

  - id: payments-third
    method: rule
    reason: the third payment provider's active subscriptions are read as it holds them; nothing to judge
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    checks:   # a sourced result declares its check (ADR-0233)
      - { kind: source_shape, subject: "what payments.subscriptions.list answered", columns: [complete, subscriptions] }
    fallback:
      when: the third connector serving payments.subscriptions is unavailable
      to: human
      role: owner
    work:
      checking: { select: output }
      when:
        - { value: { $input: third, $otherwise: "" }, not_matches: "^$" }
      rule: connector
      connector: { $input: third, $otherwise: null }
      operation: payments.subscriptions.list
      input:
        status: active
        limit: 10000
      credentials:
        - { name: PAYMENTS_TOKEN, injected_as: env }
      expect:
        - select: complete
          equals: true
          says: more subscriptions are active than one reading holds; a partial list would match falsely

  - id: entitlements
    method: rule
    reason: the product's entitlements in force are read as it holds them; nothing to judge
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    checks:   # a sourced result declares its check (ADR-0233)
      - { kind: source_shape, subject: "what entitlements.grants.list answered", columns: [complete, entitlements] }
    fallback:
      when: the connector serving entitlements.grants is unavailable
      to: human
      role: owner
    work:
      checking: { select: output }
      rule: connector
      operation: entitlements.grants.list
      input: {}
      credentials:
        - { name: ENTITLEMENTS_TOKEN, injected_as: env }
      expect:
        - select: complete
          equals: true
          says: the product answered only part of its entitlements; a partial list would match falsely

  - id: match
    method: rule
    reason: >
      whether a payment has its entitlement is equality of a customer and a product on both
      sides, a fixed rule over the readings, every provider's subscriptions joined first; every
      entry that does not pair is named
    rejected:
      - method: llm
        why: a model could miss or invent a pair; a match of money against access is exact
      - method: statistics
        why: nothing is estimated; every entry either pairs or does not
    exactness: exact
    checks:   # recomputation: DEC-0173
      - { kind: recomputation, subject: the mismatches between payments and entitlements }
    depends_on: [payments, payments-second, payments-third, entitlements]
    work:
      rule: match
      left:
        items: { $from: payments, $select: output.subscriptions }
        key: [customer, items.product]
        each: items
        more:
          - { reading: { $from: payments-second }, select: output.subscriptions }
          - { reading: { $from: payments-third }, select: output.subscriptions }
      right:
        items: { $from: entitlements, $select: output.entitlements }
        key: [customer, product]

takeover:
  sequence: >
    The process runs every morning at half past five UTC, on its own schedule; whoever looks
    after payments and access takes it over. The steps run in order: read every active
    subscription at each payment provider the business takes payments at, read every
    entitlement in force in the product, and pair them by customer and product, every
    provider's subscriptions together. Every entry that does not pair is a mismatch, red, and
    goes at once to the role the tenant named. The process moves nothing: a refund stays with a
    person, and one customer's mismatch is repaired by the process for a payment not unlocked.
  steps:
    payments:
      system: the payment provider's dashboard, or its export of subscriptions
      do: >
        export every active subscription, with its customer and, for each item, the product.
        Make sure the export is complete; a partial list would show false mismatches
      expertise: exporting subscriptions from the payment provider's dashboard
      credentials:
        - parameter: PAYMENTS_TOKEN
          where: >
            the operator's secret store, under the parameter Payment provider key of the
            requesting identity described in CREDENTIALS.md; a person reading the dashboard
            signs in with their own account that may read subscriptions
      done: every active subscription is in the export with its customer and products
    payments-second:
      system: the second payment provider's dashboard, or its export of subscriptions, where the business takes payments there
      do: >
        as for the first provider: export every active subscription with its customer and
        products, completely. Where the business has no second provider, skip it
      expertise: exporting subscriptions from that provider's dashboard
      credentials:
        - parameter: PAYMENTS_TOKEN
          where: >
            the operator's secret store, under the parameter Payment provider key of the
            requesting identity described in CREDENTIALS.md, in the second provider's
            connector; a person signs in to that dashboard with their own account
      done: the second provider's active subscriptions are exported, or there is none
    payments-third:
      system: the third payment provider's dashboard, or its export of subscriptions, where the business takes payments there
      do: >
        as for the first provider. Where the business has no third provider, skip it
      expertise: exporting subscriptions from that provider's dashboard
      credentials:
        - parameter: PAYMENTS_TOKEN
          where: >
            the operator's secret store, under the parameter Payment provider key of the
            requesting identity described in CREDENTIALS.md, in the third provider's
            connector; a person signs in to that dashboard with their own account
      done: the third provider's active subscriptions are exported, or there is none
    entitlements:
      system: the product's administration, or its export of entitlements
      do: >
        export every entitlement in force, with its customer and product. Make sure the export
        is complete; a partial list would show false mismatches
      expertise: exporting entitlements from the product's administration
      credentials:
        - parameter: ENTITLEMENTS_TOKEN
          where: >
            the operator's secret store, under the parameter Product entitlements token of the
            requesting identity described in CREDENTIALS.md; a person signs in with their own
            account that may read entitlements
      done: every entitlement in force is in the export with its customer and product
    match:
      system: a spreadsheet, on the two exports
      do: >
        put the exports of every provider into one table, then pair every item of an active
        subscription with the entitlement of the same customer and product. Write down every item paid and not granted, every entitlement granted and not
        paid, and every entry that cannot be paired with certainty, and count them. One mismatch
        or more is red: report them at once to the role the tenant named, where a mismatch is
        worked
      expertise: matching two tables by two columns in a spreadsheet
      credentials: []
      done: the mismatches are written down and counted, and any mismatch has been reported
