# B-7.07 Friction in the product — UC-03 §4.7: the product's flows clicked through in a browser,
# friction found, and one improvement made as a pull request a person merges. The flows are
# checked by the browser worker (`browser.check`, ADR-0218); P-03's coding worker is given the
# reports and another goal than an issue (UC-01 P-03): one improvement where a flow did not
# hold, was slow or wrote errors. A change to a protected path is written only after a person
# decided it (ADR-0194). The merge stays with a person at every level (UC-03 §6).
#
# The flows are the tenant's: a list of checks, each a URL, the steps a person takes there and
# the texts the page then shows (`workers/browser/README.md`); this version names an example.
#
# Switching it off (`taktusctl deactivate --process b-7-07`) leaves open pull requests as they are.
id: b-7-07
version: "1"
name: B-7.07 Friction in the product
autonomy:
  level: 2
  reason: >
    the flows are only read; the change is a coding worker's, and it leaves the system as a branch and a pull request;
    at level 2 a person confirms every step that writes, as every process of UC-03 starts at
    level 1 or 2 when its stage opens; the merge stays with a person at every level
  toward_next: >
    four weeks of pull requests of this process a person merged without changing them, and
    stage 4 of the tenant's plan open; then Taktus proposes level 3 (UC-7.1, UC-9.6). The merge
    stays with a person at every level (UC-03 §6)
author: the repository
reason: the product's flows clicked through every week, and one friction removed as a pull request a person merges (UC-03 B-7.07)

triggers:
  - schedule: "0 5 * * 4"
    inputs:
      repository_url: https://git.example/acme/product.git
      repository_host: git.example
      coding_credential: CODING_TOKEN
      app_host: app.example
      flows: [{ name: sign-in, url: "https://app.example/login", expect: [Sign in] }]

inputs:
  repository_url:
    description: where the coding worker clones the repository from
    example: https://git.example/acme/product.git
  repository_host:
    description: the clone's host, which the worker may reach
    example: git.example
  coding_credential:
    description: the name of the credential the coding worker's authentication needs
    example: CODING_TOKEN
  app_host:
    description: the host of the web application whose flows are checked
    example: app.example
  flows:
    description: >
      the flows to click through, as checks of the browser worker: a URL, the steps a person
      takes there, the texts the page then shows
    example: [{ name: sign-in, url: "https://app.example/login", steps: [{ click: "#start" }], expect: [Welcome] }]

limits:
  quota: { units: 300 }
  currency: { usd: 6.0 }

steps:
  - id: explore
    method: worker
    reason: >
      clicking through a flow of a web application and reading what it shows is work in a
      browser, which a worker offers; what it finds is a report, not a verdict
    rejected:
      - method: rule
        why: an HTTP check runs no script, types into no field and follows no click
      - method: llm
        why: a single completion cannot drive a browser
    exactness: tolerant
    fallback:
      when: the worker serving browser.check is unavailable, or the assignment fails
      to: human
      role: owner
    requires: [browser.check]
    work:
      task:
        goal: check every flow given in the inputs in the browser and report what each showed
        acceptance:
          - a report per flow, and one that gathers them
        inputs:
          checks: { $input: flows }
      max_steps: 40
      allowed_hosts:
        - { $input: app_host }

  - id: implement
    method: worker
    reason: >
      changing code in a repository so that its own checks still pass is multi-step work with
      tools in an isolated clone, which is what a worker offers; the worker proposes, the
      pipeline decides, and a person merges
    rejected:
      - method: llm
        why: a single completion cannot read a repository, run its checks and revise
      - method: rule
        why: the core executes no code itself; that is the adapter obligation
    exactness: tolerant
    fallback:
      when: the coding worker is unavailable, or the assignment fails or is stopped
      to: human
      role: owner
    requires: [code.read, code.edit, code.test, shell.sandboxed]
    depends_on: [explore]
    work:
      task:
        goal: >
          the reports in the inputs are what a browser saw clicking through the product's flows. Find the one friction there whose removal helps the product's users most — a flow that did not hold, a step that could not be done, an error the page wrote, a text that misleads — and make one improvement in the code that removes it
        acceptance:
          - >
            the change removes one friction a report shows; the summary names the flow, what the report showed and how the change removes it
          - >
            the change is small and touches only what that friction needs
          - >
            where no report shows a friction, nothing is changed and the summary says so
          - the repository's own checks pass in the workspace; one that cannot run there is named in the summary with why
          - no test, no pipeline definition, no security rule and no feature flag is changed to make a check pass; where only such a change would, the summary names it and says why
          - no secret value is written into any file
          - >
            the summary this assignment ends with is the description of the pull request that
            will carry the change: what it changes, why, and what a reviewer must check
        inputs:
          reports: { $from: explore, $artifact: report }
      max_steps: 60
      workspace:
        kind: git
        location: { $input: repository_url }
        ref: main
      allowed_hosts:
        - { $input: repository_host }
      credentials:
        - { name: { $input: coding_credential }, injected_as: env }

  - id: protected
    method: rule
    reason: >
      whether the change touches a protected path is a fixed pattern over the changeset's paths
      (UC-03 §6, ADR-0194)
    rejected:
      - method: llm
        why: a pattern over paths needs no model, and the rule that keeps cheating to green with a person must not vary
    exactness: exact
    checks:   # recomputation: DEC-0173
      - { kind: recomputation, subject: the protected paths the change touches }
    depends_on: [implement]
    work:
      rule: filter
      items: { $from: implement, $artifact: changeset, $select: files }
      any:
        - field: path
          matches: "(^|/)(tests?|spec|specs|__tests__|e2e)/|(^|/)[^/]*(_test|\\.test|\\.spec)\\.[a-z]+$|^\\.github/|^\\.gitlab-ci|(^|/)CODEOWNERS$|(?i:security|feature.?flags?|acceptance)"

  - id: branch-name
    method: rule
    reason: the branch is named by the kind of task and the run, deterministically
    rejected: []
    exactness: exact
    checks:   # recomputation: DEC-0173
      - { kind: recomputation, subject: the branch name }
    depends_on: [implement]
    work:
      rule: template
      text: taktus/friction-${run}
      values:
        run: { $run: id }

  - id: create-branch
    method: rule
    reason: >
      the worker's change goes onto a new branch through the connector, on the commit the worker
      cloned; the run writes outward, never the worker; at level 2 a person confirms it
    rejected:
      - method: worker
        why: a worker that pushes has a credential to the repository and writes outward past the ledger
    exactness: sourced
    fallback:
      when: the connector serving repository.branches is unavailable, or the branch exists
      to: human
      role: owner
    depends_on: [implement, branch-name, protected]
    work:
      when:
        - { value: { $from: protected, $select: count }, matches: "^0$" }
      rule: connector
      operation: repository.branches.create
      input:
        name: { $from: branch-name }
        base: { $from: implement, $artifact: changeset, $select: source }
        message: "fix: one friction in a flow of the product"
        files: { $from: implement, $artifact: changeset, $select: files }
        deleted: { $from: implement, $artifact: changeset, $select: deleted }
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }

  - id: create-branch-protected
    method: rule
    reason: >
      a change that touches a protected path is written only after a person decided it: the
      step asks at every level, and a decline writes nothing (UC-03 §6, ADR-0194)
    rejected:
      - method: worker
        why: a worker that pushes has a credential to the repository and writes outward past the ledger
    exactness: sourced
    fallback:
      when: the connector serving repository.branches is unavailable, or the branch exists
      to: human
      role: owner
    depends_on: [implement, branch-name, protected]
    work:
      when:
        - { value: { $from: protected, $select: count }, matches: "^[1-9]" }
      ask:
        question: "Write a change that touches a protected path onto ${branch}?"
        situation: >
          The coding worker's change changes ${count} protected path(s), the first ${path}: a
          test, the pipeline, a security rule or a feature flag.
        proposal: the change is written onto a new branch as the worker proposed it
        values:
          branch: { $from: branch-name }
          count: { $from: protected, $select: count }
          path: { $from: protected, $select: first.path }
      rule: connector
      operation: repository.branches.create
      input:
        name: { $from: branch-name }
        base: { $from: implement, $artifact: changeset, $select: source }
        message: "fix: one friction in a flow of the product"
        files: { $from: implement, $artifact: changeset, $select: files }
        deleted: { $from: implement, $artifact: changeset, $select: deleted }
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }

  - id: wait-for-pipeline
    method: wait
    reason: the pipeline runs on its own time; the run waits for its verdict, polling the state
    rejected: []
    fallback:
      when: the connector serving repository.pipelines is unavailable
      to: human
      role: owner
    depends_on: [create-branch, create-branch-protected]
    work:
      until:
        operation: repository.pipelines.status
        input:
          ref: { $from: branch-name }
        credentials:
          - { name: REPOSITORY_TOKEN, injected_as: env }
        select: state
        expect: [success, failure]
        poll_seconds: 60
        timeout_seconds: 2400

  - id: read-pipeline
    method: rule
    reason: >
      whether the change is acceptable is the pipeline's verdict, never the worker's opinion of
      its own work; the reading expects success and fails its step otherwise
    rejected:
      - method: llm
        why: a judgement of test output is not a verdict; the pipeline's conclusion is
    exactness: sourced
    fallback:
      when: the connector serving repository.pipelines is unavailable, or the pipeline is red
      to: human
      role: owner
    depends_on: [wait-for-pipeline]
    work:
      rule: connector
      operation: repository.pipelines.status
      input:
        ref: { $from: branch-name }
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }
      expect:
        - { select: state, equals: success }

  - id: open-pr
    method: rule
    reason: >
      opening a pull request is an API call; a repeat after a restart finds the one opened; the
      merge stays with a person at every level
    rejected: []
    exactness: sourced
    fallback:
      when: the connector serving repository.pullrequests is unavailable
      to: human
      role: owner
    depends_on: [read-pipeline]
    work:
      rule: connector
      operation: repository.pullrequests.open
      input:
        head: { $from: branch-name }
        base: main
        title: "fix: one friction in a flow of the product"
        body: { $from: implement, $artifact: summary }
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }

  - id: label
    method: rule
    reason: the pull request is marked as Taktus's, so that a reader sees who opened it
    rejected: []
    exactness: sourced
    fallback:
      when: the connector serving repository.labels is unavailable
      to: human
      role: owner
    depends_on: [open-pr]
    work:
      rule: connector
      operation: repository.labels.set
      input:
        number: { $from: open-pr, $select: output.number }
        labels: [taktus]
      credentials:
        - { name: REPOSITORY_TOKEN, injected_as: env }

takeover:
  sequence: >
    The process runs once a week, on Thursday at 05:00 UTC; whoever looks after the product
    starts it. A person clicks through each of the product's flows in a browser and notes what
    each showed, then makes one improvement in the code that removes the friction that helps the
    users most. The change goes onto a new branch; once the pipeline is green a pull request is
    opened, which a person reviews and merges.
  steps:
    explore:
      system: a browser, in a fresh private window
      do: >
        open each flow's page, take its steps and note whether the page then shows the texts
        it should, whether a step could not be done, and what errors the browser's console wrote
      expertise: using the product as a customer does
      credentials: []
      done: a note per flow says what it showed
    implement:
      system: a clone of the repository's main branch, with the notes of the flows
      do: >
        choose the one friction the notes show whose removal helps the users most, and make
        one small improvement in the code that removes it. Run the repository's own checks, and
        write a description naming the flow, what it showed and how the change helps
      expertise: the product's code and its users' flows
      credentials:
        - parameter: CODING_TOKEN
          where: >
            the operator's secret store, under the coding worker's parameter described in
            CREDENTIALS.md; a person works in their own clone instead
      done: one improvement is made in the clone, the checks pass, and its description is written
    protected:
      system: the changeset, in the clone
      do: >
        list the files the change touches. A change to a test, the pipeline's definition, a
        security rule, a feature flag or the code owners file is written only once the owner
        decided it
      expertise: reading a changeset
      credentials: []
      done: the protected paths the change touches are written down, or none
    branch-name:
      system: a note
      do: name the branch taktus/friction- followed by a name of the day, so that no other branch has it
      expertise: none
      credentials: []
      done: the branch name is written down
    create-branch:
      system: the repository, in its web interface or with git
      do: >
        when the change touches no protected path, push it as one commit onto a new branch of
        that name, made from the commit the change was made on
      expertise: pushing a branch with git
      credentials:
        - parameter: REPOSITORY_TOKEN
          where: >
            the operator's secret store, under the parameter Repository token of the requesting
            identity described in CREDENTIALS.md; a person may push with their own account
      done: the branch exists with the change as its one commit
    create-branch-protected:
      system: the repository, in its web interface or with git
      do: >
        when the change touches a protected path, ask the owner first; push it as above only
        once the owner agreed, and push nothing when the owner declined
      expertise: pushing a branch with git
      credentials:
        - parameter: REPOSITORY_TOKEN
          where: >
            the operator's secret store, under the parameter Repository token of the requesting
            identity described in CREDENTIALS.md
      done: the branch exists, or the owner declined and nothing was pushed
    wait-for-pipeline:
      system: the repository's pipeline view
      do: wait until the pipeline of the branch has ended, success or failure, at most forty minutes
      expertise: reading the repository's pipeline
      credentials:
        - parameter: REPOSITORY_TOKEN
          where: >
            the operator's secret store, under the parameter Repository token of the requesting
            identity described in CREDENTIALS.md; a person may read it with their own account
      done: the pipeline of the branch has ended
    read-pipeline:
      system: the repository's pipeline view
      do: >
        read the pipeline's verdict on the branch. A red pipeline ends the task here: the branch
        stays for the owner, and no pull request is opened
      expertise: reading the repository's pipeline
      credentials:
        - parameter: REPOSITORY_TOKEN
          where: >
            the operator's secret store, under the parameter Repository token of the requesting
            identity described in CREDENTIALS.md; a person may read it with their own account
      done: the pipeline is green, or the task is handed to the owner with the red pipeline
    open-pr:
      system: the repository, in its web interface
      do: >
        open a pull request from the branch onto main, with the title above and the coding
        worker's summary as its description. Nobody but a person merges it
      expertise: opening a pull request
      credentials:
        - parameter: REPOSITORY_TOKEN
          where: >
            the operator's secret store, under the parameter Repository token of the requesting
            identity described in CREDENTIALS.md
      done: the pull request is open
    label:
      system: the pull request, in the repository's web interface
      do: add the label taktus
      expertise: labelling a pull request
      credentials:
        - parameter: REPOSITORY_TOKEN
          where: >
            the operator's secret store, under the parameter Repository token of the requesting
            identity described in CREDENTIALS.md
      done: the pull request carries the label taktus
