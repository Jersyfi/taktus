takeover:
  sequence: >
    A person who releases the app starts the process once the store published the release as a
    staged one. The release is raised in three stages, to the shares of users the run was started
    with. After each stage, wait a day, then read the release's crash rate with the tenant's
    query. A rate below the limit the run was started with raises the next stage. A rate at or
    above it halts the staged release at once, and no later stage runs. Resuming after a halt is
    a new start, by a person. On the store that takes no share, raising resumes its own schedule,
    a share of 1 completes it, and halting pauses it.
  steps:
    raise-1:
      system: the app's store, the staged release of the app the run was started with
      do: >
        set the staged release to the first stage's share of users, the one the run
        was started with, in the store's console; on the store that takes no share, resume its
        phased release, or complete it at a share of 1.
      expertise: managing a staged release in the store's developer console
      credentials:
        - parameter: STORES_KEY
          where: >
            the operator's secret store, under the parameter App stores key of the requesting
            identity described in CREDENTIALS.md; a person working by hand signs in to the store's
            console with their own account, which may manage the app's releases
      done: the release reaches the stage's share
    pause-1:
      system: none
      do: >
        wait a day, so that the stage carries real use. Judge nothing meanwhile.
      expertise: none
      credentials: []
      done: a day has passed since the stage was raised
    rate-1:
      system: the metrics store
      do: >
        run the tenant's query for the release's crash rate over the last day, the query
        the run was started with. Write down the number exactly as the store gives it.
      expertise: running a query in the metrics store
      credentials:
        - parameter: METRICS_TOKEN
          where: >
            the operator's secret store, under the parameter Metrics token of the requesting
            identity described in CREDENTIALS.md; a person working by hand signs in to the metrics
            store with their own account, which may run queries
      done: >
        the crash rate is written down, or it is written down that the store gave no number
    rise-1:
      system: the number written down
      do: >
        compare the crash rate with the limit the run was started with. It is a rise when the
        rate is at or above the limit. A missing number is not a rise and is not read as zero;
        write down that it is missing.
      expertise: none
      credentials: []
      done: it is written down whether the rate is a rise
    halt-1:
      system: the app's store, the staged release
      do: >
        Only if the rate after stage 1 was a rise: halt the staged release at once, without
        asking anyone first, so that no more users receive it; on the store with a phased
        release, pause it. Run no later stage. Tell the people who release the app that the
        rollout halted, with the rate and the limit.
      expertise: halting a staged release in the store's developer console
      credentials:
        - parameter: STORES_KEY
          where: >
            the operator's secret store, under the parameter App stores key of the requesting
            identity described in CREDENTIALS.md; a person working by hand signs in to the store's
            console with their own account, which may manage the app's releases
      done: the staged release is halted, or there was no rise
    raise-2:
      system: the app's store, the staged release of the app the run was started with
      do: >
        Only if the crash rate after stage 1 was below the limit: set the staged release to the second stage's share of users, the one the run
        was started with, in the store's console; on the store that takes no share, resume its
        phased release, or complete it at a share of 1.
      expertise: managing a staged release in the store's developer console
      credentials:
        - parameter: STORES_KEY
          where: >
            the operator's secret store, under the parameter App stores key of the requesting
            identity described in CREDENTIALS.md; a person working by hand signs in to the store's
            console with their own account, which may manage the app's releases
      done: the release reaches the stage's share, or the stage is skipped
    pause-2:
      system: none
      do: >
        Only if the crash rate after stage 1 was below the limit: wait a day, so that the stage carries real use. Judge nothing meanwhile.
      expertise: none
      credentials: []
      done: a day has passed since the stage was raised, or the stage is skipped
    rate-2:
      system: the metrics store
      do: >
        Only if the crash rate after stage 1 was below the limit: run the tenant's query for the release's crash rate over the last day, the query
        the run was started with. Write down the number exactly as the store gives it.
