    fallback:
      when: the connector serving stores.releases is unavailable
      to: human
      role: owner
    depends_on: [rise-1]
    work:
      checking: { select: output }
      when:
        - { value: { $from: rise-1, $select: count }, matches: "^0$" }
      rule: connector
      operation: stores.releases.raise
      input:
        platform: { $input: platform }
        app: { $input: app }
        fraction: { $input: second }
      credentials:
