# B-8.04 Staged rollout, on a serverless platform — UC-03 §4.8: a release that runs beside the
# current one as a canary revision is given a rising share of the traffic while its error rate
# stays below a limit, promoted to all traffic after the last stage, and put back by itself on a
# rise (UC-6.13, UC-7.2). Resuming after a halt stays with a person.
#
# The version of B-8.04 for a serverless platform (ADR-0312). The canary is a revision of the
# service that already carries the release, deployed beside the stable revision without traffic
# by the business's own build. Its share of the traffic is set through the capability
# `deployment.workloads` (`split`) to the three percentages the inputs name; the rest stays on
# the stable revision. After each stage the run waits ten minutes and reads the canary's error
# rate through `metrics.series`, with the tenant's query. A rate below the limit raises the next
# stage; after the third, a rule promotes the canary to all traffic. A rate at or above it puts
# all traffic back on the stable revision: the halt is the process's own, by rule, and the stages
# after it do not run. A person who resumes starts a new run.
#
# At level 2 every step waits for a person's confirmation, the halt among them; at level 3, its
# target in UC-03, the stages, the promotion and the halt run on their own. A tenant registers
# this version of b-8-04, the cluster's (`B-8.04-staged-rollout.yaml`) or the store's
# (`B-8.04-store-rollout.yaml`), whichever its release runs on; the stage counts either
# (ADR-0191).
#
# By hand:
#
#     uv run taktusctl run --process blueprints/software-operations/processes/B-8.04-traffic-canary.yaml \
#         --input service=web --input first=5 --input second=25 --input third=50 \
#         --input 'error_rate_query=sum(rate(http_errors_total{revision="canary"}[10m]))/sum(rate(http_requests_total{revision="canary"}[10m]))' \
#         --input max_error_rate=0.02
#
# Switching it off (`taktusctl deactivate --process b-8-04`) changes nothing at the platform.
#
# Named metrics (ADR-0328): each read names the metric it needs, `canary.error_rate`, and the
# connector serving `metrics.series` maps the name to its own store's query — PromQL on a
# Prometheus store or on a cloud's monitoring service — from the tenant's configuration
# (`--metrics`). A query given as an input is asked verbatim instead. Version 3
# passes its target to the name as parameters and changes nothing else.

id: b-8-04
version: "3"
name: B-8.04 Staged rollout, on a serverless platform
autonomy:
  level: 2
  reason: >
    raising the canary's share leaves the system and reaches more users at each stage, so a
    person confirms each step, as every process of UC-03 starts at level 1 or 2 when its stage
    opens
  toward_next: >
    four weeks of rollouts a person confirmed with every rise halted, and stage 3 of the tenant's
    plan open; then Taktus proposes level 3, its target in UC-03, at which the stages, the
    promotion and the halt run on their own (UC-7.1, UC-9.6)
author: the repository
reason: a release reaches all users only while its error rate holds, and is put back without a person on a rise (UC-03 B-8.04)

inputs:
  service:
    description: the service whose latest ready revision is the canary, deployed beside the stable one without traffic
    example: web
  first:
    description: the canary's share of the traffic at the first stage, in percent
    example: 5
  second:
    description: the canary's share of the traffic at the second stage, in percent
    example: 25
  third:
    description: the canary's share of the traffic at the third stage, in percent
    example: 50
  error_rate_query:
    description: the tenant's query that answers the canary's error rate over the last ten minutes, one number
    example: sum(rate(http_errors_total{revision="canary"}[10m]))/sum(rate(http_requests_total{revision="canary"}[10m]))
    required: false
  max_error_rate:
    description: the rate at or above which the rollout halts, a decimal
    example: "0.02"

limits:
  quota: { units: 60 }

steps:
  - id: share-1
    method: rule
    reason: the canary's share of the traffic is set to the stage's percentage by an API call; at level 2 a person confirms it
    rejected:
      - method: worker
        why: the platform shares the traffic itself; nothing here needs a sandbox
    exactness: sourced
    checks:   # a sourced result declares its check (ADR-0233)
      - { kind: source_shape, subject: "what deployment.workloads.split answered", columns: [name, traffic] }
    fallback:
      when: the connector serving deployment.workloads is unavailable
      to: human
      role: owner
    work:
      checking: { select: output }
      rule: connector
      operation: deployment.workloads.split
      input:
        name: { $input: service }
        percent: { $input: first }
      credentials:
        - { name: WORKLOADS_TOKEN, injected_as: env }

  - id: pause-1
    method: wait
    reason: ten minutes of traffic on the stage tell its error rate; nothing is judged meanwhile
    rejected: []
    depends_on: [share-1]
    work:
      seconds: 600

  - id: rate-1
    method: rule
    reason: the store's figure for the canary is read verbatim, as the store gave it
    rejected:
      - method: llm
        why: a read needs no language model
    exactness: sourced
    checks:   # a sourced result declares its check (ADR-0233)
      - { kind: source_shape, subject: "what metrics.series.query answered", columns: [series] }
    fallback:
      when: the connector serving metrics.series is unavailable
      to: human
      role: owner
    depends_on: [pause-1]
    work:
      checking: { select: output }
      rule: connector
      operation: metrics.series.query
      input:
        metric: canary.error_rate
        parameters: { service: { $input: service } }
        query: { $input: error_rate_query, $otherwise: "" }
      credentials:
        - { name: METRICS_TOKEN, injected_as: env }

  - id: rise-1
    method: rule
    reason: a rate at or above the limit is a threshold over the store's own figure; a value the store could not give as a number is left out, never read as zero
    rejected:
      - method: llm
        why: a figure held exact may not come from a language model (CLAUDE.md §4)
    exactness: exact
    checks:   # recomputation: DEC-0173
      - { kind: recomputation, subject: the canary's error rate at or above the limit after stage 1 }
    depends_on: [rate-1]
    work:
      rule: filter
      items: { $from: rate-1, $select: output.series }
      all:
        - { field: values.0.value, at_least: { $input: max_error_rate } }

  - id: halt-1
    method: rule
    reason: on a rise all traffic is put back on the stable revision by rule, so that no more users reach the release; resuming stays with a person
    rejected:
      - method: human
        why: a halt that waits for a person lets the rise reach users meanwhile; the rule is fixed (ADR-0023)
    exactness: sourced
    checks:   # a sourced result declares its check (ADR-0233)
      - { kind: source_shape, subject: "what deployment.workloads.split answered", columns: [name, traffic] }
    fallback:
      when: the connector serving deployment.workloads is unavailable
      to: human
      role: owner
    depends_on: [rise-1]
    work:
      checking: { select: output }
      when:
        - { value: { $from: rise-1, $select: count }, matches: "^[1-9]" }
      rule: connector
      operation: deployment.workloads.split
      input:
        name: { $input: service }
        percent: 0
      credentials:
        - { name: WORKLOADS_TOKEN, injected_as: env }


  - id: share-2
    method: rule
    reason: the canary's share of the traffic is set to the stage's percentage by an API call; at level 2 a person confirms it
    rejected:
      - method: worker
        why: the platform shares the traffic itself; nothing here needs a sandbox
    exactness: sourced
