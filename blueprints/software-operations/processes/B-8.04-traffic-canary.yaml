takeover:
  sequence: >
    A person who releases the service starts the process once the business's build deployed the
    release as a canary: the service's latest ready revision, beside the stable one, without
    traffic. The canary is given three rising shares of the traffic, the percentages the run was
    started with, the stable revision keeping the rest. After each stage, wait ten minutes, then
    read the canary's error rate with the tenant's query. A rate below the limit the run was
    started with raises the next stage, and after the third the canary takes all traffic. A rate
    at or above it sends all traffic back to the stable revision at once, and no later stage
    runs. Resuming after a halt is a new start, by a person.
  steps:
    share-1:
      system: the serverless platform, the service the run was started with
      do: >
        Set the service's traffic so that its latest ready revision, the canary, takes
        the first stage's percentage the run was started with, and the stable revision the
        rest, using the platform's own command to manage traffic. Change nothing else.
      expertise: managing a service's traffic between revisions on the serverless platform
      credentials:
        - parameter: WORKLOADS_TOKEN
          where: >
            the operator's secret store, under the parameter Workload cluster token of the
            requesting identity described in CREDENTIALS.md, which here holds the platform's
            service account key; a person working by hand uses their own access to the
            platform, which may change the service's traffic
      done: the canary takes the first stage's share of the traffic
    pause-1:
      system: none
      do: >
        Wait ten minutes, so that the stage carries real traffic. Judge nothing meanwhile.
      expertise: none
      credentials: []
      done: ten minutes have passed since the stage was raised
    rate-1:
      system: the metrics store
      do: >
        Run the tenant's query for the canary's error rate over the last ten minutes, the
        query the run was started with. Write down the number exactly as the store gives it.
      expertise: running a query in the metrics store
      credentials:
        - parameter: METRICS_TOKEN
          where: >
            the operator's secret store, under the parameter Metrics token of the requesting
            identity described in CREDENTIALS.md; a person working by hand signs in to the metrics
            store with their own account, which may run queries
      done: >
        the canary's error rate is written down, or it is written down that the store gave no
        number
    rise-1:
      system: the number written down
      do: >
        Compare the error rate with the limit the run was started with. It is a rise when
        the rate is at or above the limit. A missing number is not a rise and is not read as zero;
        write down that it is missing.
      expertise: none
      credentials: []
      done: it is written down whether the rate is a rise
    halt-1:
      system: the serverless platform, the service
      do: >
        Only if the rate after stage 1 was a rise: send all traffic back to the stable revision
        at once, without asking anyone first, so that no more users reach the release. Run no
        later stage. Tell the people who release the service that the rollout halted, with the
        rate and the limit.
      expertise: managing a service's traffic between revisions on the serverless platform
      credentials:
        - parameter: WORKLOADS_TOKEN
          where: >
            the operator's secret store, under the parameter Workload cluster token of the
            requesting identity described in CREDENTIALS.md, which here holds the platform's
            service account key; a person working by hand uses their own access to the
            platform, which may change the service's traffic
      done: the stable revision takes all traffic, or there was no rise
    share-2:
      system: the serverless platform, the service the run was started with
      do: >
        Only if the error rate after stage 1 was below the limit: set the service's traffic so that its latest ready revision, the canary, takes
        the second stage's percentage the run was started with, and the stable revision the
        rest, using the platform's own command to manage traffic. Change nothing else.
      expertise: managing a service's traffic between revisions on the serverless platform
      credentials:
        - parameter: WORKLOADS_TOKEN
          where: >
            the operator's secret store, under the parameter Workload cluster token of the
            requesting identity described in CREDENTIALS.md, which here holds the platform's
            service account key; a person working by hand uses their own access to the
            platform, which may change the service's traffic
      done: the canary takes the second stage's share of the traffic, or the stage is skipped
    pause-2:
      system: none
      do: >
        Only if the error rate after stage 1 was below the limit: wait ten minutes, so that the stage carries real traffic. Judge nothing meanwhile.
      expertise: none
      credentials: []
      done: ten minutes have passed since the stage was raised, or the stage is skipped
    rate-2:
