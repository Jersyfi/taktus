      to: human
      role: owner
    depends_on: [rise-1]
    work:
      checking: { select: output }
      when:
        - { value: { $from: rise-1, $select: count }, matches: "^0$" }
      rule: connector
      operation: deployment.workloads.split
      input:
        name: { $input: service }
