openapi: 3.1.0
info:
  title: Taktus worker contract
  version: "1.0.0"
  summary: HTTP for control, Server-Sent Events for the event stream.
  description: |
    An execution unit is connected to Taktus through this interface. Workers execute; they do
    not decide. Every body is defined in Worker.json and referenced from here, so that
    a worker written in any language validates against one definition.

    Errors use RFC 9457 problem details (application/problem+json).

    Rationale: docs/adr/ADR-0007-worker-contract.md. Prose: README.md in this directory.
servers:
  - url: http://localhost:9000
    description: A worker under conformance testing. The address is configuration.

paths:
  /v1/capabilities:
    get:
      operationId: getCapabilities
      summary: What this worker can do
      responses:
        "200":
          description: The declaration. Contains at least one consumption kind.
          content:
            application/json:
              schema:
                $ref: "./Worker.json#/$defs/Capabilities"

  /v1/estimate:
    post:
      operationId: estimate
      summary: Estimate demand before starting
      description: |
        May be rough. Must answer. `confidence: low` is a valid response; a missing endpoint is
        not. Without an estimate there is no admission control and therefore no limit
        guarantee.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./Worker.json#/$defs/EstimateRequest"
      responses:
        "200":
          description: The estimate.
          content:
            application/json:
              schema:
                $ref: "./Worker.json#/$defs/Estimate"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/assignments:
    post:
      operationId: createAssignment
      summary: Accept an assignment
      description: |
        The control plane chooses the `assignment_id`. The worker records the assignment and
        answers with its state. If the estimate does not fit the limits, or the frame cannot be
        honoured, the worker does not start: the state is `finished` with outcome `rejected`,
        and the stream carries exactly one event, `assignment.finished` with the same outcome
        and a reason. Rejection is a state of the assignment, not an HTTP error, so that the
        ledger sees it through the same stream as everything else. Once started, the limits
        are the worker's hard ceiling: a step whose expected demand would carry the running
        total across a limit does not start, and the assignment ends `stopped` at the boundary
        it is at, with its checkpoint and the `limit` that halted it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./Worker.json#/$defs/Assignment"
      responses:
        "201":
          description: Recorded. Status is `accepted`, or `finished` with outcome `rejected`.
          content:
            application/json:
              schema:
                $ref: "./Worker.json#/$defs/AssignmentState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: An assignment with this id already exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The worker is at `max_concurrent_assignments`. Try again later.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/assignments/{id}:
    parameters:
      - $ref: "#/components/parameters/AssignmentId"
    get:
      operationId: getAssignment
      summary: Current state
      responses:
        "200":
          description: The state.
          content:
            application/json:
              schema:
                $ref: "./Worker.json#/$defs/AssignmentState"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/assignments/{id}/events:
    parameters:
      - $ref: "#/components/parameters/AssignmentId"
    get:
      operationId: streamEvents
      summary: Event stream
      description: |
        Server-Sent Events. Each message carries the event's `seq` in the SSE `id` field, its
        `type` in the SSE `event` field and the JSON object in the SSE `data` field. `seq`
        starts at 1 and increases by exactly 1.

        The stream is resumable: a client that reconnects sends the last `seq` it has seen,
        either in the standard `Last-Event-ID` header or as the `after` query parameter, and
        receives every event with a greater `seq`. A worker honours both. The stream ends after
        `assignment.finished`.
      parameters:
        - name: after
          in: query
          description: Deliver events with `seq` greater than this. Equivalent to `Last-Event-ID`.
          required: false
          schema:
            type: integer
            minimum: 0
        - name: Last-Event-ID
          in: header
          description: The last `seq` received, per the SSE specification.
          required: false
          schema:
            type: string
            pattern: "^[0-9]+$"
      responses:
        "200":
          description: The stream.
          content:
            text/event-stream:
              schema:
                description: A sequence of SSE messages; each `data` field is one Event.
                $ref: "./Worker.json#/$defs/Event"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/assignments/{id}/stop:
    parameters:
      - $ref: "#/components/parameters/AssignmentId"
    post:
      operationId: stopAssignment
      summary: Request a stop at the next step boundary
      description: |
        The running step may finish, up to a ceiling. The worker then emits `step.boundary`
        and `assignment.finished` with outcome `stopped` and the checkpoint to resume from.
        A worker that aborts immediately and discards the running step violates the contract.
        Stopping an assignment that has already finished is not an error; the response is its
        final state.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "./Worker.json#/$defs/StopRequest"
      responses:
        "202":
          description: The stop is requested. Status is `stopping`, or `finished` if it already was.
          content:
            application/json:
              schema:
                $ref: "./Worker.json#/$defs/AssignmentState"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/assignments/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/AssignmentId"
    post:
      operationId: steerAssignment
      summary: Send a message, received at the next step boundary
      description: |
        Only a worker that declares `supports.steering` accepts it. The worker emits
        `message.received` once, at the next step boundary; the steps after it have the message
        as an input. A message posted again under the same `message_id` is answered 202 and
        received once. A message is an input: it never widens the frame or raises a limit. A
        worker that does not declare steering answers with a problem and changes nothing
        (check W-19, ADR-0139).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./Worker.json#/$defs/SteeringMessage"
      responses:
        "202":
          description: Accepted; `last_seq` is the stream's position when it was.
          content:
            application/json:
              schema:
                $ref: "./Worker.json#/$defs/AssignmentState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The assignment has finished; the message is not received.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/assignments/{id}/handover:
    parameters:
      - $ref: "#/components/parameters/AssignmentId"
    post:
      operationId: handOverAssignment
      summary: Hand the assignment over at the next step boundary
      description: |
        Only a worker that declares `supports.handover` accepts it. The running step may finish,
        up to a ceiling, as for a stop. After the step's boundary the worker produces one
        artifact of kind `handover.state` whose bytes are a `Handover` document, and ends with
        `assignment.finished`, outcome `stopped`, that boundary's checkpoint and `handover`
        naming the artifact. A new assignment that carries the document in `context.handover`
        continues the work anywhere. A worker that does not declare handover answers with a
        problem, and the assignment runs on (check W-20, ADR-0139).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "./Worker.json#/$defs/HandoverRequest"
      responses:
        "202":
          description: The handover is requested. Status is `stopping`, or `finished` if it already was.
          content:
            application/json:
              schema:
                $ref: "./Worker.json#/$defs/AssignmentState"
        "404":
          $ref: "#/components/responses/NotFound"

  /next:
    servers:
      - url: http://localhost:9100/relay
        description: |
          The outbound binding: a host — the control plane, or the conformance suite with
          `--listen` — serves this path at the base it gives the worker. The worker opens no
          port (README §8, ADR-0139).
    post:
      operationId: nextRelayedRequest
      summary: The next request for a worker that connects outbound
      description: |
        Answers when a request for the worker arrives, or with 204 after the host's wait of at
        most 30 seconds. The worker handles the request as if it had arrived at its endpoint
        and answers it at `/answers/{request_id}`, exactly once (check W-21). It asks again
        while it answers, so that a long event stream does not hold other requests back.
      responses:
        "200":
          description: One request of this contract.
          content:
            application/json:
              schema:
                $ref: "./Worker.json#/$defs/RelayRequest"
        "204":
          description: No request arrived within the wait. Ask again.

  /answers/{request_id}:
    servers:
      - url: http://localhost:9100/relay
        description: The outbound binding, as for `/next`.
    parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          pattern: "^rly_[A-Za-z0-9_-]{4,}$"
    post:
      operationId: answerRelayedRequest
      summary: The answer to one relayed request
      description: |
        The body is the answer's body, sent in chunks while it lasts: for the event stream, the
        stream itself. The host reads it as it arrives.
      parameters:
        - name: Relay-Status
          in: header
          required: true
          description: The answer's status code.
          schema:
            type: string
            pattern: "^[1-5][0-9]{2}$"
      requestBody:
        required: false
        content:
          "*/*":
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Received.
        "400":
          description: The answer carries no status code.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: The host never relayed a request of this id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The request was answered already.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/assignments/{id}/artifacts:
    parameters:
      - $ref: "#/components/parameters/AssignmentId"
    get:
      operationId: listArtifacts
      summary: Collect result artifacts
      description: |
        Every artifact announced by an `artifact.produced` event. Each carries a `uri` for its
        bytes; unless the worker stored them elsewhere, that is
        `/v1/assignments/{id}/artifacts/{artifact_id}` on the worker itself.
      responses:
        "200":
          description: The list, possibly empty while the assignment is running.
          content:
            application/json:
              schema:
                $ref: "./Worker.json#/$defs/ArtifactList"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/assignments/{id}/artifacts/{artifact_id}:
    parameters:
      - $ref: "#/components/parameters/AssignmentId"
      - name: artifact_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    get:
      operationId: getArtifact
      summary: Fetch one artifact's bytes
      description: |
        The default location of an artifact's content. `Content-Type` is the artifact's
        `media_type`; the body hashes to its `digest`.
      responses:
        "200":
          description: The content.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/health:
    get:
      operationId: getHealth
      summary: Readiness
      responses:
        "200":
          description: Ready to accept an assignment.
          content:
            application/json:
              schema:
                $ref: "./Worker.json#/$defs/Health"
        "503":
          description: Not ready. Same body, status `not_ready`.
          content:
            application/json:
              schema:
                $ref: "./Worker.json#/$defs/Health"

components:
  parameters:
    AssignmentId:
      name: id
      in: path
      required: true
      schema:
        $ref: "./Worker.json#/$defs/AssignmentId"

  responses:
    BadRequest:
      description: The body does not validate against Worker.json.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No assignment with this id.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      title: Problem
      description: RFC 9457 problem details. Never carries a credential or a payload.
      type: object
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
      required: [title, status]
