# Development only: the reference worker next to the control plane, for trying a bundle out
# and for verify.sh. Layered over compose.yml — never used alone:
#
#   docker compose -f deploy/docker/compose.yml -f deploy/docker/compose.reference-worker.yml up
#
# which is `make up-dev`. The worker is its own image, built from workers/script/Dockerfile,
# and the control plane reaches it by endpoint (TAKTUS_WORKER) over the project's network.
# Nothing here belongs in a deployment: an operator configures the execution unit their
# processes need (deploy/docker/README.md), and the control plane image carries no worker
# (DEC-0011).

services:
  taktus:
    environment:
      TAKTUS_WORKER: http://worker:9000

  worker:
    build:
      context: ../..
      dockerfile: workers/script/Dockerfile
    image: taktus-worker-script:local
    command: ["python3", "/app/worker.py", "--host", "0.0.0.0", "--port", "9000",
              "--state-dir", "/var/lib/taktus/unit", "--step-seconds", "0.5"]
    volumes:
      - taktus-worker-state:/var/lib/taktus/unit
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9000/v1/health', timeout=3).status == 200 else 1)"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  taktus-worker-state:
