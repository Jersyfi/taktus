# Taktus, self-hosted: two containers, the shape ADR-0002 promises. `make up` brings it up in
# one command (deploy/docker/README.md); `make down` stops it and keeps every volume.
#
#   postgres   the one mandatory dependency; its data in a named volume; not published
#   taktus     every role in one process (TAKTUS_ROLES=all); migrations applied on start;
#              health and readiness, intake and the read API on 127.0.0.1:8080
#
# Secrets are files, never values in this file: `make up` writes a random database password
# and the URL that carries it under deploy/docker/secrets/ (ignored by git), and the
# containers read them under /run/secrets. TAKTUS_DATABASE_URL_FILE names the file.
#
# A process needs an execution unit, and an execution unit is by design not Taktus (ADR-0002:
# workers are separate deployables behind the worker contract). The reference worker ships in
# the same image as an optional third service under the profile `reference-worker`, for the
# end-to-end check in deploy/docker/verify.sh and for trying a bundle out.

name: taktus

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taktus
      POSTGRES_DB: taktus
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - taktus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taktus -d taktus"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  taktus:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: taktus:local
    environment:
      TAKTUS_ROLES: ${TAKTUS_ROLES:-all}
      TAKTUS_DATABASE_URL_FILE: /run/secrets/database_url
      TAKTUS_MIGRATE_ON_START: "true"
      TAKTUS_HTTP_HOST: 0.0.0.0
      TAKTUS_HTTP_PORT: "8080"
      TAKTUS_PATH_PREFIX: ${TAKTUS_PATH_PREFIX:-/}
      TAKTUS_WORKER: ${TAKTUS_WORKER:-http://worker:9000}
      TAKTUS_STATE_DIR: /var/lib/taktus
      TAKTUS_SHUTDOWN_CEILING_SECONDS: ${TAKTUS_SHUTDOWN_CEILING_SECONDS:-300}
      TAKTUS_LOG_LEVEL: ${TAKTUS_LOG_LEVEL:-info}
    secrets:
      - database_url
    volumes:
      - taktus-state:/var/lib/taktus
    ports:
      - "127.0.0.1:${TAKTUS_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080${TAKTUS_PATH_PREFIX:-}/ready', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    # SIGTERM, then this long for the running step to reach its boundary (ADR-0005).
    stop_grace_period: ${TAKTUS_SHUTDOWN_CEILING_SECONDS:-300}s
    restart: unless-stopped

  worker:
    profiles: ["reference-worker"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: taktus:local
    command: ["python3", "workers/script/worker.py", "--host", "0.0.0.0", "--port", "9000",
              "--state-dir", "/var/lib/taktus/worker", "--step-seconds", "0.5"]
    volumes:
      - taktus-state:/var/lib/taktus
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9000/v1/health', timeout=3).status == 200 else 1)"]
      interval: 2s
      timeout: 3s
      retries: 30

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url

volumes:
  taktus-postgres:
  taktus-state:
