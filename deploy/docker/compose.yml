# Taktus, self-hosted: the deployment shape. Two containers for the control plane, the shape
# ADR-0002 promises. `make up` brings it up in one command (deploy/docker/README.md);
# `make down` stops it and keeps every volume.
#
#   postgres   the one mandatory dependency; its data in a named volume; not published
#   taktus     every role in one process (TAKTUS_ROLES=all); migrations applied on start;
#              health and readiness, intake and the read API on 127.0.0.1:8080
#   backup     the database and the stored files backed up every day into TAKTUS_BACKUP_DIRECTORY
#              (the volume taktus-backups unless it names a directory),
#              and the newest backup drilled every week (deploy/backup/, ADR-0222); it holds no
#              code of Taktus
#
# The images are built from this checkout, unless TAKTUS_IMAGE and TAKTUS_BACKUP_IMAGE name
# published ones (a release's, from the registry `.github/workflows/images.yml` pushes to):
# `make up` then pulls them and builds nothing.
#
# No worker is part of this file, and no worker code is part of the image (DEC-0011). A worker
# executes foreign code; it is a separate deployable with its own image behind the worker
# contract, and the control plane reaches it through the execution port: by endpoint
# (TAKTUS_WORKER names a worker that is already running, the default here), as a process it
# starts, or as a container it starts with limits and a network allowlist
# (TAKTUS_EXECUTION=container, deploy/docker/README.md). Only a process with a `worker` step
# needs one; a process built from rule, statistics, wait and human steps runs with none.
# compose.reference-worker.yml adds the reference worker for development and verify.sh.
#
# Secrets are files, never values in this file: `make up` writes a random database password
# and the URL that carries it under deploy/docker/secrets/ (ignored by git), and the
# containers read them under /run/secrets. TAKTUS_DATABASE_URL_FILE names the file.

name: taktus

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taktus
      POSTGRES_DB: taktus
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - taktus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taktus -d taktus"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  taktus:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: ${TAKTUS_IMAGE:-taktus:local}
    # The operator's own settings, TAKTUS_NAME=value per line, never a secret value; read when
    # the file exists (ignored by git). A variable named under `environment` below wins over it.
    env_file:
      - path: ./taktus.env
        required: false
    environment:
      TAKTUS_ROLES: ${TAKTUS_ROLES:-all}
      TAKTUS_DATABASE_URL_FILE: /run/secrets/database_url
      TAKTUS_MIGRATE_ON_START: "true"
      TAKTUS_HTTP_HOST: 0.0.0.0
      TAKTUS_HTTP_PORT: "8080"
      TAKTUS_PATH_PREFIX: ${TAKTUS_PATH_PREFIX:-/}
      # The execution unit for `worker` steps: a worker reachable at this endpoint. Empty
      # means none is configured; a run with a worker step then fails at that step and says so.
      TAKTUS_WORKER: ${TAKTUS_WORKER:-}
      TAKTUS_STATE_DIR: /var/lib/taktus
      TAKTUS_SHUTDOWN_CEILING_SECONDS: ${TAKTUS_SHUTDOWN_CEILING_SECONDS:-300}
      TAKTUS_LOG_LEVEL: ${TAKTUS_LOG_LEVEL:-info}
      # Local first (ADR-0248, UC-8.3): with no model named, every purpose is bound to the model
      # server on this machine — any server of the chat-completions dialect, at the address
      # below — and a model named in its place declares its TAKTUS_MODEL_LOCATION.
      TAKTUS_MODEL_LOCAL_FIRST: ${TAKTUS_MODEL_LOCAL_FIRST:-true}
      TAKTUS_MODEL_LOCAL_ENDPOINT: ${TAKTUS_MODEL_LOCAL_ENDPOINT:-http://host.docker.internal:11434/v1}
    extra_hosts:
      # The host as the container reaches it, on Linux as on the desktop engines.
      - "host.docker.internal:host-gateway"
    secrets:
      - database_url
    volumes:
      - taktus-state:/var/lib/taktus
    ports:
      - "127.0.0.1:${TAKTUS_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080${TAKTUS_PATH_PREFIX:-}/ready', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    # SIGTERM, then this long for the running step to reach its boundary (ADR-0005).
    stop_grace_period: ${TAKTUS_SHUTDOWN_CEILING_SECONDS:-300}s
    restart: unless-stopped

  backup:
    build:
      context: ../..
      dockerfile: deploy/backup/Dockerfile
    image: ${TAKTUS_BACKUP_IMAGE:-taktus-backup:local}
    command: ["schedule"]
    environment:
      TAKTUS_DATABASE_URL_FILE: /run/secrets/database_url
      # A directory, not an object store: put it on a disk that is not this machine's own (a
      # mounted network share, a second disk), or the backup goes down with the machine.
      TAKTUS_BACKUP_STORE_DIRECTORY: /backups
      TAKTUS_BACKUP_OBJECTS_DIRECTORY: /var/lib/taktus/objects
      TAKTUS_BACKUP_RETENTION_DAYS: ${TAKTUS_BACKUP_RETENTION_DAYS:-30}
      TAKTUS_BACKUP_RECIPIENT: ${TAKTUS_BACKUP_RECIPIENT:-}
      TAKTUS_BACKUP_EVERY_HOURS: ${TAKTUS_BACKUP_EVERY_HOURS:-24}
      TAKTUS_DRILL_EVERY_DAYS: ${TAKTUS_DRILL_EVERY_DAYS:-7}
      TAKTUS_BACKUP_WORK_DIR: /tmp
      # Each line of a round reaches `docker compose logs` when it is printed.
      PYTHONUNBUFFERED: "1"
    secrets:
      - database_url
    volumes:
      # A named volume by default. An absolute path instead puts the backups there; its owner
      # must be the user 70 the program runs as (deploy/docker/README.md, Backups).
      - ${TAKTUS_BACKUP_DIRECTORY:-taktus-backups}:/backups
      - taktus-state:/var/lib/taktus:ro
    # After the instance is ready: its migrations made the table the outcome is recorded in,
    # and its state directory holds the store of objects the backup archives.
    depends_on:
      taktus:
        condition: service_healthy
    restart: unless-stopped

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url

volumes:
  taktus-postgres:
  taktus-state:
  taktus-backups:
