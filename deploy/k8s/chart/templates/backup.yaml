{{- /*
The database's scheduled backup (ADR-0087, README §11): a CronJob from the backup image, which
dumps the database, encrypts the dump when a recipient is given, writes it to the store off the
node and deletes what is older than the retention. It reads the database URL the roles read and
the store's credential, both as mounted files; it runs as the database's own user and mounts no
service-account token. With `backup.objects`, it also archives the object store beside the dump,
from the state volume mounted read-only (#322). That volume is ReadWriteOnce, so the backup's pod
runs on the node of the control plane's pods. It reaches the name service, the database and the store, nothing else;
the database admits it.

With `backup.pointInTime.enabled`, each run takes a base backup beside the dump, and the database
archives its write-ahead log into the same store (ADR-0174); this file renders the database's
connection rules for the base backup and its egress to the store.

A run that fails leaves its Job and pod, so that its log can be read; the next run does not wait
for it. Two runs never overlap.
*/ -}}
{{- $b := .Values.backup -}}
{{- if $b.enabled }}
{{- $name := printf "%s-backup" (include "taktus.fullname" .) -}}
{{- $url := index (include "taktus.secretFiles" . | fromJsonArray) 0 -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  namespace: {{ include "taktus.controlPlaneNamespace" . }}
  labels:
    {{- include "taktus.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ required "backup.schedule is required" $b.schedule | quote }}
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ $b.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        {{- include "taktus.labels" . | nindent 8 }}
        app.kubernetes.io/component: backup
    spec:
      backoffLimit: {{ $b.backoffLimit }}
      activeDeadlineSeconds: {{ $b.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "taktus.labels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          {{- with .Values.image.pullSecret }}
          imagePullSecrets:
            - name: {{ . }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            # The postgres user of the image's Alpine variant, as the database runs.
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: {{ include "taktus.image" (dict "what" "backup.image" "image" $b.image) }}
              imagePullPolicy: IfNotPresent
              env:
                - name: HOME
                  value: /tmp
                - name: {{ $url.variable }}
                  value: {{ printf "%s/%s" $url.dir $url.key | quote }}
                {{- include "taktus.backupStoreEnv" . | nindent 16 }}
                {{- if include "taktus.pointInTime" . }}
                - name: TAKTUS_BACKUP_POINT_IN_TIME
                  value: "true"
                {{- end }}
                - name: TAKTUS_BACKUP_WORK_DIR
                  value: /work
                {{- if $b.objects }}
                - name: TAKTUS_BACKUP_OBJECTS_DIRECTORY
                  value: /var/lib/taktus/objects
                {{- end }}
              resources:
                {{- toYaml $b.resources | nindent 16 }}
              securityContext:
                {{- include "taktus.containerSecurity" . | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: work
                  mountPath: /work
                - name: {{ $url.volume }}
                  mountPath: {{ $url.dir }}
                  readOnly: true
                - name: backup-store
                  mountPath: /run/secrets/taktus/backup-store
                  readOnly: true
                {{- if $b.objects }}
                - name: state
                  mountPath: /var/lib/taktus
                  readOnly: true
                {{- end }}
          {{- if $b.objects }}
          # The state volume is ReadWriteOnce: it is mounted on the node that holds it already.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      {{- include "taktus.selector" (dict "root" . "component" "control-plane") | nindent 22 }}
          {{- end }}
          volumes:
            - name: tmp
              emptyDir: {}
            # The dump waits here before it leaves; it is as large as the database compressed.
            - name: work
              emptyDir:
                sizeLimit: {{ $b.workSize }}
            - name: {{ $url.volume }}
              secret:
                secretName: {{ $url.secret }}
                defaultMode: 0440
                items:
                  - key: {{ $url.key }}
                    path: {{ $url.key }}
            {{- if $b.objects }}
            - name: state
              persistentVolumeClaim:
                claimName: {{ include "taktus.fullname" . }}-state
                readOnly: true
            {{- end }}
            {{- include "taktus.backupStoreVolume" . | nindent 12 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ include "taktus.controlPlaneNamespace" . }}
  labels:
    {{- include "taktus.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backup
  policyTypes: [Ingress, Egress]
  egress:
    {{- include "taktus.dnsPeer" .Values.networkPolicy | nindent 4 }}
    {{- if .Values.database.deploy }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "taktus.selector" (dict "root" . "component" "database") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 5432 }
    {{- else }}
    {{- with .Values.networkPolicy.controlPlaneEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
    {{- include "taktus.backupStoreEgress" . | nindent 4 }}
{{- if include "taktus.pointInTime" . }}
---
# The database's connection rules with point-in-time recovery (ADR-0174 §1): the image's own and a
# replication connection with a password, for the base backup.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taktus.fullname" . }}-database-hba
  namespace: {{ include "taktus.controlPlaneNamespace" . }}
  labels:
    {{- include "taktus.labels" . | nindent 4 }}
data:
  pg_hba.conf: |
    {{- include "taktus.databaseHba" . | nindent 4 }}
---
# The database writes its archived log to the store: the name service and the store, nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "taktus.fullname" . }}-database-archive
  namespace: {{ include "taktus.controlPlaneNamespace" . }}
  labels:
    {{- include "taktus.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "taktus.selector" (dict "root" . "component" "database") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    {{- include "taktus.dnsPeer" .Values.networkPolicy | nindent 4 }}
    {{- include "taktus.backupStoreEgress" . | nindent 4 }}
{{- end }}
{{- end }}
