{{- /*
Two service accounts, kept apart (README §1).

Taktus's own account runs the control plane. In the execution namespace it may create jobs and
read their pods and logs, and create and delete the Secret and the Services a job lives with —
never read a Secret back (README §1, DEC-0061). Nothing else: a namespaced Role and a
RoleBinding, never a ClusterRole. Its token is mounted into the runner alone, which creates the jobs; every other pod
runs without one.

The jobs' account runs the execution units. It holds no Role — a token minted for it opens
nothing — and no token is ever mounted from it (README §1, §4).
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "taktus.serviceAccount" . }}
  namespace: {{ include "taktus.controlPlaneNamespace" . }}
  labels:
    {{- include "taktus.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.execution.serviceAccount }}
  namespace: {{ include "taktus.executionNamespace" . }}
  labels:
    {{- include "taktus.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "taktus.fullname" . }}-execution
  namespace: {{ include "taktus.executionNamespace" . }}
  labels:
    {{- include "taktus.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets", "services"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "taktus.fullname" . }}-execution
  namespace: {{ include "taktus.executionNamespace" . }}
  labels:
    {{- include "taktus.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "taktus.fullname" . }}-execution
subjects:
  - kind: ServiceAccount
    name: {{ include "taktus.serviceAccount" . }}
    namespace: {{ include "taktus.controlPlaneNamespace" . }}
