# A process that exercises the first vertical slice of the control plane.
#
# Five steps, four method kinds, one rejection: a rule prepares the work, a worker does it,
# a wait step waits, an exact rule checks the worker's result and produces the value that
# counts, and a last worker step asks for more than the budget has left and is rejected
# before it starts. Run it against the reference worker:
#
#     python3 workers/script/worker.py --port 9000 &
#     uv run taktusctl run --process examples/processes/six-times-seven.yaml
#
# The shape of this file is the process version of docs/architecture/control-plane.md §4 with
# one addition per step, `work`: what the step does when it runs. The bundle format proper
# arrives at 0.3.0 (docs/roadmap.md); until then examples/README.md is the reference.

id: six-times-seven
version: "4"
name: Six times seven, checked
autonomy:
  level: 2
  reason: >
    a worked example: every result is checked by a rule before it counts, but the example
    exists to be watched step by step, and a person confirms it by running it
  toward_next: >
    nothing is missing but the point: an example is read, not operated; a process built on
    this shape rises to level 3 once its results have been watched through reports for a while
author: the repository
reason: the worked example of the first control-plane slice

# The run's budget. Admission control checks every worker step's estimate against what is left
# of it; the last step below is written so that it does not fit.
limits:
  compute: { seconds: 2, resource_class: cpu.small }

steps:
  - id: prepare-commands
    method: rule
    reason: the commands are fixed; nothing here needs judgement
    rejected:
      - method: llm
        why: a fixed list needs no language model
    exactness: exact
    checks:   # recomputation: DEC-0173
      - { kind: recomputation, subject: the list of commands }
    work:
      rule: constant
      value:
        commands: ["expr 6 '*' 7"]

  - id: compute
    method: worker
    reason: running a command needs a sandbox and a shell, which is what a worker offers
    rejected:
      - method: rule
        why: the core executes no shell command itself; that is the adapter obligation
    exactness: tolerant
    fallback:
      when: the assignment fails or is stopped twice
      to: human
      role: owner
    requires: [shell.script]
    depends_on: [prepare-commands]
    work:
      task:
        goal: run the prepared commands and keep their output
        acceptance:
          - every command ran
          - the output of each command is an artifact
        inputs: { $from: prepare-commands }
      max_steps: 10

  - id: settle
    method: wait
    reason: an external system would confirm here; in this example a fixed pause stands in for it
    rejected: []
    depends_on: [compute]
    work:
      seconds: 0.2

  - id: verify-answer
    method: rule
    reason: >
      the value that leaves this process comes from a machine check of the worker's artifact,
      not from the worker; a worker's word is a proposal
    rejected:
      - method: worker
        why: a variable method never produces an exact result (ADR-0014)
    exactness: exact
    checks:
      - { kind: bounds, subject: the answer, pattern: "^42$" }
    depends_on: [settle]
    work:
      rule: verify_artifact
      step: compute
      artifact: output-1
      pattern: "^42$"

  - id: overreach
    method: worker
    reason: >
      thirty commands, so that the worker's estimate exceeds what the budget has left;
      this step exists to show a rejection before start
    rejected:
      - method: rule
        why: the point is a worker estimate above the limit
    exactness: tolerant
    fallback:
      when: the assignment fails
      to: human
      role: owner
    requires: [shell.script]
    depends_on: [verify-answer]
    work:
      task:
        goal: run far more commands than the budget allows
        acceptance:
          - never reached
        inputs:
          commands:
            - "true"
            - "true"
            - "true"
            - "true"
            - "true"
            - "true"
            - "true"
            - "true"
            - "true"
            - "true"
            - "true"
            - "true"
            - "true"
            - "true"
            - "true"
            - "true"
            - "true"
            - "true"
            - "true"
            - "true"
            - "true"
            - "true"
            - "true"
            - "true"
            - "true"
            - "true"
            - "true"
            - "true"
            - "true"
            - "true"
      max_steps: 100

# How a person runs this process without Taktus (UC-6.3, ADR-0180): the sequence, and for every
# step the system to act in, what to do there, the expertise it needs, each credential by its
# parameter and where an authorised person finds it, and how to tell that it is done.
takeover:
  sequence: >
    A person starts it whenever they want to see the example work. The five steps run in order:
    write down the command, run it in a shell, pause briefly, check that the output is 42, and
    note that the last step is not carried out because it asks for more than the budget allows.
  steps:
    prepare-commands:
      system: a text file or a sheet of paper
      do: write down the one command to run, expr 6 '*' 7
      expertise: none
      credentials: []
      done: the command is written down exactly as given
    compute:
      system: a shell on any computer with a POSIX shell
      do: run the written command, expr 6 '*' 7, and keep what it prints
      expertise: running a command in a shell
      credentials: []
      done: the command ran and its output is kept
    settle:
      system: none
      do: wait a moment before going on; nothing has to be confirmed
      expertise: none
      credentials: []
      done: the moment has passed
    verify-answer:
      system: the kept output
      do: compare the output with 42; the output is the process's result only if it is exactly 42
      expertise: none
      credentials: []
      done: the output is exactly 42, or the process stops here with the output as found
    overreach:
      system: none
      do: >
        do not run it; this step asks for thirty commands, more than the process's limit of two
        seconds of compute allows, and exists to show that it is refused before it starts
      expertise: none
      credentials: []
      done: the step is recorded as not carried out

# What counts as an equivalent result of each variable step that no scorer scores
# yet: its class's ceiling until its cases narrow it (UC-8.4, ADR-0300 §1).
tolerances:
  compute: 0.25
  overreach: 0.25
