[project]
name = "taktus"
version = "0.0.0"
description = "An operating layer for a business"
requires-python = ">=3.13"
license = { file = "LICENSE" }

dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "sqlalchemy[asyncio]>=2",
  "psycopg[binary,pool]",
  "alembic",
  "httpx",
  "structlog",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp",
  "mcp",
  "typer",
  "jsonschema",
  "pgvector",
  "pyyaml",
]

[project.optional-dependencies]
dev = [
  "pytest", "pytest-asyncio", "testcontainers[postgres]",
  "mypy", "types-jsonschema", "types-pyyaml", "ruff", "import-linter", "coverage",
]

[project.scripts]
taktusd = "taktus.composition.daemon:main"
taktusctl = "taktus.composition.taktusctl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taktus"]

[tool.hatch.build.targets.wheel.force-include]
# The conformance suite validates against the contracts; an installed package carries them.
"contracts" = "taktus/contracts"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # a test asserts

[tool.mypy]
strict = true
packages = ["taktus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
