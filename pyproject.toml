[project]
name = "taktus"
version = "0.0.0"
description = "An operating layer for a business"
requires-python = ">=3.13"
license = { file = "LICENSE" }

dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "sqlalchemy[asyncio]>=2",
  "psycopg[binary,pool]",
  "alembic",
  "httpx",
  "structlog",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp",
  "mcp",
  "typer",
  "jsonschema",
  "pgvector",
  "pyyaml",
  "pyjwt[crypto]",
]

[project.optional-dependencies]
dev = [
  "pytest", "pytest-asyncio", "pytest-xdist", "testcontainers[postgres]",
  "mypy", "types-jsonschema", "types-pyyaml", "ruff", "import-linter", "coverage",
]
# The ML bench worker's libraries (workers/mlbench), at the exact versions its image installs, so
# that the tests run the worker as it ships. Never part of the control plane image (DEC-0011).
mlbench = ["scikit-learn==1.9.1", "numpy==2.5.4"]

[project.scripts]
taktusd = "taktus.composition.daemon:main"
taktusctl = "taktus.composition.taktusctl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taktus"]

[tool.hatch.build.targets.wheel.force-include]
# The conformance suite validates against the contracts; an installed package carries them.
"contracts" = "taktus/contracts"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # a test asserts

[tool.mypy]
strict = true
# The product, the repository's own tools and the backup program, held to the same check
# (`make lint`, #142).
files = ["src/taktus", "tools", "deploy/backup"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Every skip says why in the summary, so that a test that needs a cluster or Docker and did not
# run is visible in every log, CI's included, instead of passing quietly.
addopts = "-rs"
# A test that asserts a bound on wall-clock time runs alone, after the suite that spreads over
# the cores: other processes on the same cores would move its measurement (ADR-0096).
markers = ["timing: asserts a bound on wall-clock time; `make test` runs it in one process"]
