[project]
name = "taktus"
version = "0.0.0"
description = "An operating layer for a business"
requires-python = ">=3.13"
license = { file = "LICENSE" }

dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "sqlalchemy[asyncio]>=2",
  "psycopg[binary,pool]",
  "alembic",
  "httpx",
  "structlog",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp",
  "mcp",
  # The HTTP client the MCP library's streamable HTTP transport takes, named here because the
  # vendor connector configures it (ADR-0117); the MCP library already brings it.
  "httpx2",
  "typer",
  "jsonschema",
  "pgvector",
  "pyyaml",
  "pyjwt[crypto]",
]

[project.optional-dependencies]
dev = [
  "pytest", "pytest-asyncio", "pytest-xdist", "testcontainers[postgres]",
  "mypy", "types-jsonschema", "types-pyyaml", "ruff", "import-linter", "coverage",
  # A vendor's MCP server the conformance suite runs against through the vendor connector
  # (ADR-0117): the MCP project's own reference time server, local, without credentials.
  "mcp-server-time==2026.10.19",
]
# The ML bench worker's libraries (workers/mlbench), at the exact versions its image installs, so
# that the tests run the worker as it ships. Never part of the control plane image (DEC-0011).
mlbench = ["scikit-learn==1.9.1", "numpy==2.5.4"]

[dependency-groups]
# What a connector's image installs (connectors/Dockerfile, ADR-0158), exported from the lock
# file at build time so that every connector runs at the versions the tests ran. The control
# plane needs these too and lists them above; none of the control plane's other libraries
# reaches a connector's image.
connectors = ["mcp", "httpx", "httpx2", "pyjwt[crypto]"]

[project.scripts]
taktusd = "taktus.composition.daemon:main"
taktusctl = "taktus.composition.taktusctl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The connectors are a package of their own beside the control plane (ADR-0158): one wheel
# carries both for development and the tests, and each image copies only its part: the control
# plane image copies src/ and never connectors/, a connector image connectors/ and never src/.
packages = ["src/taktus", "connectors/taktus_connectors"]

[tool.hatch.build.targets.wheel.force-include]
# The conformance suite validates against the contracts; an installed package carries them.
"contracts" = "taktus/contracts"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # a test asserts

[tool.mypy]
strict = true
# The product, the repository's own tools and the backup program, held to the same check
# (`make lint`, #142).
files = ["src/taktus", "connectors/taktus_connectors", "tools", "deploy/backup"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Every skip says why in the summary, so that a test that needs a cluster or Docker and did not
# run is visible in every log, CI's included, instead of passing quietly.
addopts = "-rs"
# A test that asserts a bound on wall-clock time runs alone, after the suite that spreads over
# the cores: other processes on the same cores would move its measurement (ADR-0096).
markers = ["timing: asserts a bound on wall-clock time; `make test` leaves it out; `make timing` and CI's lane `timing` run it alone, in one process"]
