    why: What the project must achieve, each requirement with how it is verified.
    system: repository
    path: docs/usecases
    shape: directory
    template: templates/use-case.md
    maintained_days: 90
  - id: architecture-decisions
    title: Architecture decisions
    why: How the project was decided, each decision with the alternatives it rejected.
    system: repository
